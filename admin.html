  // ---- Dashboard: profile ring + stats · latest requests · active
  //      projects + tasks · recent downloads -------------------------------
  // Deal-desk pattern (Jacob's reference): "matches" are requests,
  // "mandates" are projects, "seller" is the client, "sector" the service.
  function relTime(d) {
    if (!d) return '—';
    var t = new Date(String(d).length === 10 ? d + 'T12:00:00' : d); if (isNaN(t)) return '—';
    var today = new Date(); today.setHours(12, 0, 0, 0);
    var days = Math.round((new Date(t.getFullYear(), t.getMonth(), t.getDate(), 12) - today) / 864e5);
    if (days === 0) return 'Today';
    if (days === 1) return 'Tomorrow';
    if (days === -1) return 'Yesterday';
    if (days > 0) return days < 7 ? 'In ' + days + ' days' : days < 30 ? 'In ' + Math.round(days / 7) + ' week' + (Math.round(days / 7) > 1 ? 's' : '') : 'In ' + Math.round(days / 30) + ' mo';
    var a = -days;
    return a < 7 ? a + ' days ago' : a < 30 ? Math.round(a / 7) + ' week' + (Math.round(a / 7) > 1 ? 's' : '') + ' ago' : Math.round(a / 30) + ' mo ago';
  }
  function compact(n) {
    n = Number(n) || 0;
    if (n >= 1e6) return '$' + (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'm';
    if (n >= 1e4) return '$' + (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'k';
    return '$' + Math.round(n).toLocaleString();
  }
  function initials(name) {
    return String(name || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(function (w) { return w[0].toUpperCase(); }).join('') || '?';
  }
  // Fit score for a request — five honest signals, 100 points:
  //   services picked 30 · sqft on the rate card 20 · lead time ≥ 3 days
  //   20 · California 15 · business (non-freemail) address 15
  function fitScore(r) {
    var s = 0;
    if ((r.services || '').trim()) s += 30;
    var sq = parseInt(r.sqft, 10) || 0;
    if (sq && sq <= 6000) s += 20; else if (sq) s += 8;
    var td = r.target_date || r.launch_date;
    if (td) { var lead = (new Date(String(td).slice(0, 10) + 'T12:00:00') - new Date()) / 864e5; s += lead >= 3 ? 20 : 8; }
    if (/^ca$/i.test(r.state || '') || /california/i.test((r.city || '') + ' ' + (r.state || ''))) s += 15;
    if (r.email && !/@(gmail|yahoo|hotmail|icloud|outlook|aol|me)\./i.test(r.email)) s += 15;
    return Math.min(100, s);
  }
  // Estimated value: the request's own estimate, else priced from the
  // sheet (services + add-ons at the given sqft).
  function estValue(r) {
    if (r.estimated_total) return Number(r.estimated_total);
    var names = String(r.services || '').split(/,\s*/).concat(String(r.addons || '').split(/,\s*/)).filter(Boolean);
    var sum = 0, any = false;
    names.forEach(function (nm) { var q = svcQuote(nm.trim(), r.sqft); if (typeof q.price === 'number') { sum += q.price; any = true; } });
    return any ? sum : null;
  }
  function lastUpdate(b) {
    return [b.created_at, b.confirmed_at, b.delivery_created_at, b.delivery_sent_at, b.invoice_sent_at, b.delivery_approved_at]
      .filter(Boolean).map(function (x) { return new Date(x); }).filter(function (d) { return !isNaN(d); })
      .sort(function (a, c) { return c - a; })[0] || null;
  }
  function nextUpdate(b) {
    var addDays = function (d, n) { var t = new Date(String(d).slice(0, 10) + 'T12:00:00'); t.setDate(t.getDate() + n); return t; };
    if (b.status === 'pending') {
      var p = state.proposals.find(function (x) { return x.booking_id == b.id; });
      return p && p.sent_at ? { when: addDays(p.sent_at, 3), what: 'Proposal follow-up' } : { when: null, what: 'Send proposal' };
    }
    if (b.status === 'upcoming') return b.shoot_date ? { when: new Date(String(b.shoot_date).slice(0, 10) + 'T12:00:00'), what: 'Shoot' } : { when: null, what: 'Set shoot date' };
    if (b.status === 'editing' || b.status === 'revisions') return b.shoot_date ? { when: addDays(b.shoot_date, b.status === 'revisions' ? 1 : 2), what: 'Delivery due' } : { when: null, what: 'Delivery' };
    if (b.status === 'delivered' || b.status === 'completed') {
      return b.invoice_sent_at ? { when: addDays(b.invoice_sent_at, 14), what: 'Payment due' } : { when: new Date(), what: 'Send invoice' };
    }
    return { when: null, what: '' };
  }

  function vDash() {
    var now = Date.now(), d30 = 30 * 864e5;
    var reqs = state.requests || [];
    var inWin = function (r, from, to) { var t = new Date(r.created_at).getTime(); return t >= from && t < to; };
    var reviewed = function (r) { return r.status !== 'pending'; };
    var rev30 = reqs.filter(function (r) { return inWin(r, now - d30, now + 1) && reviewed(r); }).length;
    var revPrev = reqs.filter(function (r) { return inWin(r, now - 2 * d30, now - d30) && reviewed(r); }).length;
    var acc30 = reqs.filter(function (r) { return inWin(r, now - d30, now + 1) && r.status === 'accepted'; }).length;
    var accPrev = reqs.filter(function (r) { return inWin(r, now - 2 * d30, now - d30) && r.status === 'accepted'; }).length;
    var delta = function (cur, prev) {
      if (!prev) return cur ? '<em>new</em> vs last month' : '<span class="mut">no change vs last month</span>';
      var pct = Math.round(100 * (cur - prev) / prev);
      return '<em' + (pct < 0 ? ' class="down"' : '') + '>' + (pct >= 0 ? '+' : '') + pct + '%</em> vs last month';
    };
    // average turnaround: shoot → delivery email, last 90 days
    var turns = state.bookings.filter(function (b) { return b.shoot_date && b.delivery_sent_at && (now - new Date(b.delivery_sent_at)) < 90 * 864e5; })
      .map(function (b) { return (new Date(b.delivery_sent_at) - new Date(String(b.shoot_date).slice(0, 10) + 'T12:00:00')) / 864e5; })
      .filter(function (x) { return x >= 0 && x < 60; });
    var avgTurn = turns.length ? (turns.reduce(function (a, c) { return a + c; }, 0) / turns.length) : null;
    var active = state.bookings.filter(function (b) { return ['canceled', 'paid'].indexOf(b.status) === -1; });
    var pipeline = active.reduce(function (s, b) { return s + (b.price ? net(b) + (Number(b.travel_fee) || 0) : 0); }, 0);

    function stat(icon, label, big, small, deltaHtml) {
      return '<div class="dz-stat"><div class="lbl"><i>' + icon + '</i>' + label + '</div><b>' + big + (small ? '<small>' + small + '</small>' : '') + '</b>' +
        (deltaHtml ? '<span class="d">' + deltaHtml + '</span>' : '') + '</div>';
    }
    var profile = '<div class="dz-card dz-profile">' +
      '<div class="dz-lbl">Overview</div>' +
      '<div class="dz-stats">' +
        stat('&#9634;', 'Requests reviewed', rev30, '', delta(rev30, revPrev)) +
        stat('&#10003;', 'Requests accepted', acc30, '', delta(acc30, accPrev)) +
        stat('&#9719;', 'Average turnaround', avgTurn == null ? '—' : (avgTurn < 1 ? '<1' : avgTurn.toFixed(1)), avgTurn == null ? '' : 'days', turns.length ? '<span class="mut">shoot &rarr; delivery, last 90 days</span>' : '<span class="mut">no deliveries yet</span>') +
        stat('$', 'Current pipeline value', compact(pipeline), '', '<span class="mut">' + active.length + ' active project' + (active.length === 1 ? '' : 's') + '</span>') +
      '</div></div>';

    // ---- latest requests (matches) ----
    var latest = reqs.slice().sort(function (a, b) { return new Date(b.created_at) - new Date(a.created_at); }).slice(0, 8);
    var cards = latest.map(function (r) {

      '<span class="dz-arrows"><button onclick="ADM.dzScroll(-1)">&lsaquo;</button><button onclick="ADM.dzScroll(1)">&rsaquo;</button></span></div>' +
      (cards ? '<div class="dz-row" id="dz-row">' + cards + '</div>' : '<div class="dz-card dz-empty" style="padding:1rem 1.1rem">No requests yet — applications from /book land here with a fit score and a priced overview.</div>') +

    var table = '<div class="dz-card">' + (rows.length

            '<td>' + esc(b.type || 'Photography') + '</td>' +

            '<td class="mut">' + relTime(x.last) + '</td>' +

    var projects = '<div><div class="dz-sechead"><h2>Active projects</h2><span class="dz-count">' + active.length + '</span><span class="grow"></span><a class="more" onclick="ADM.go(\'pipeline\')">View all</a></div>' + table + '</div>';

    // ---- recent downloads (delivery activity) ----

      '<div class="dz-card">' + (dl.length

    var weekHtml = '<div class="dz-card dz-tasks"><div class="dz-tasks__head"><h2>This week</h2><span class="dz-count">' + week.length + '</span></div>' +
      (week.length ? week.map(function (b) {

          '<span class="t">' + esc(b.title) + '<small>' + (b.shoot_time ? fmtT(b.shoot_time) : '') + (b.client_name ? ' &middot; ' + esc(b.client_name) : '') + '</small></span>' +
          (b.confirmed_at ? '<span class="dz-pill dz-pill--hi">Confirmed</span>' : '<span class="dz-pill dz-pill--mid">Unconfirmed</span>') + '</div>';
      }).join('') : '<div class="dz-empty">No shoots in the next 7 days.</div>') + '</div>';
    var nowD = new Date();
    var paidThisMonth = state.bookings.filter(function (b) { if (b.status !== 'paid') return false; var d = new Date(b.paid_at || b.invoice_sent_at || b.delivered_at || b.created_at); return d.getMonth() === nowD.getMonth() && d.getFullYear() === nowD.getFullYear(); })

      }).join('') + '</span><span style="flex:1"></span>' +

      '<input type="date" id="bl-to" value="' + nowD.toLocaleDateString('en-CA') + '" style="font-family:var(--sans);font-size:0.76rem;border:1px solid var(--line);border-radius:8px;padding:0.4rem 0.5rem">' +

  // ---- Calendar: month grid of shoots + twilights ------------------------
  function vCalendar() {
    var ym = state.calMonth || new Date().toISOString().slice(0, 7);
    var y = parseInt(ym.slice(0, 4), 10), mo = parseInt(ym.slice(5, 7), 10) - 1;
    var first = new Date(y, mo, 1), last = new Date(y, mo + 1, 0);
    var todayS = new Date().toLocaleDateString('en-CA');
    var byDay = {};
    state.bookings.forEach(function (b) {
      if (b.status === 'canceled') return;
      var add = function (d, kind, time) { if (!d) return; var k = String(d).slice(0, 10); (byDay[k] = byDay[k] || []).push({ b: b, kind: kind, time: time }); };
      add(b.shoot_date, 'shoot', b.shoot_time);
      if (b.twilight_date || b.twilight_time) add(b.twilight_date || b.shoot_date, 'twilight', b.twilight_time);
    });
    var ext = state.calExt[ym];
    if (!ext) setTimeout(function () { ADM.calExtLoad(ym); }, 0);
    (ext || []).forEach(function (e) {
      var k = String(e.start).slice(0, 10);
      var time = e.allDay ? '' : String(e.start).slice(11, 16);
      (byDay[k] = byDay[k] || []).push({ ext: e, kind: 'ext', time: time });
    });
    var cells = '';
    var lead = first.getDay();
    for (var i = 0; i < lead; i++) cells += '<div class="cal__cell cal__cell--pad"></div>';
    for (var d = 1; d <= last.getDate(); d++) {
      var key = y + '-' + String(mo + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
      var list = (byDay[key] || []).sort(function (a, c) { return (a.time || '') < (c.time || '') ? -1 : 1; });
      cells += '<div class="cal__cell' + (key === todayS ? ' today' : '') + (key < todayS ? ' past' : '') + '"><span class="cal__n">' + d + '</span>' +
        list.map(function (it) {
          if (it.kind === 'ext') {
            return '<span class="cal__ev cal__ev--ext" title="' + esc(it.ext.title) + (it.ext.location ? ' · ' + esc(it.ext.location) : '') + '">' +
              (it.time ? '<b>' + esc(fmtT(it.time)) + '</b> ' : '') + esc(it.ext.title) + '</span>';
          }
          return '<a class="cal__ev cal__ev--' + it.kind + (it.b.confirmed_at ? '' : ' unconf') + '" onclick="ADM.go(\'project/' + it.b.id + '\')" title="' + esc(it.b.title) + (it.b.client_name ? ' · ' + esc(it.b.client_name) : '') + '">' +
            (it.kind === 'twilight' ? '&#9790; ' : '') + (it.time ? '<b>' + esc(fmtT(it.time)) + '</b> ' : '') + esc(it.b.title) + '</a>';
        }).join('') + '</div>';
    }
    var monthName = first.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
    var count = Object.keys(byDay).filter(function (k) { return k.slice(0, 7) === ym; }).reduce(function (n, k) { return n + byDay[k].length; }, 0);
    return head('Calendar',
        '<span class="adm-seg"><button onclick="ADM.calMove(-1)">&lsaquo;</button><button onclick="ADM.calMove(0)">Today</button><button onclick="ADM.calMove(1)">&rsaquo;</button></span>' +
        '<button class="adm-btn" onclick="ADM.newBooking()">+ New project</button>') +
      '<div class="dz-sechead" style="margin-bottom:0.6rem"><h2>' + esc(monthName) + '</h2><span class="dz-count">' + count + '</span><span class="grow"></span>' +
        '<span class="mut" style="font-size:0.7rem">solid = confirmed &middot; outlined = not confirmed &middot; &#9790; twilight &middot; grey = your Google Calendar' + (state.calBusy[ym] ? ' (loading…)' : '') + '</span></div>' +
      '<div class="dz-card cal"><div class="cal__head">' + ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(function (w) { return '<span>' + w + '</span>'; }).join('') + '</div>' +
      '<div class="cal__grid">' + cells + '</div></div>';
  }

  // ---- Clients: roster with health signals -------------------------------
  function clientStats(c) {
    var mine = state.bookings.filter(function (b) { return b.client_id == c.id && b.status !== 'canceled'; });
    var total = function (b) { return net(b) + (Number(b.travel_fee) || 0); };
    var today = new Date().toLocaleDateString('en-CA');
    var past = mine.filter(function (b) { return b.shoot_date && String(b.shoot_date).slice(0, 10) <= today; })
      .sort(function (a, b) { return String(b.shoot_date).localeCompare(String(a.shoot_date)); });
    var lastShoot = past.length ? String(past[0].shoot_date).slice(0, 10) : null;
    var active = mine.filter(function (b) { return ['paid'].indexOf(b.status) === -1; }).length;
    var days = lastShoot ? Math.round((Date.now() - new Date(lastShoot + 'T12:00:00')) / 864e5) : null;
    return {
      projects: mine.length,
      lifetime: mine.filter(function (b) { return b.status === 'paid'; }).reduce(function (s, b) { return s + total(b); }, 0),
      open: mine.filter(function (b) { return b.invoice_sent_at && b.status !== 'paid'; }).reduce(function (s, b) { return s + total(b); }, 0),
      lastShoot: lastShoot, days: days, active: active,
      checkin: !!(lastShoot && days > 90 && !active),
    };
  }
  function vClients() {
    var rows = state.clients.map(function (c) { return { c: c, s: clientStats(c) }; })
      .sort(function (a, b) { return (b.s.lifetime + b.s.open) - (a.s.lifetime + a.s.open); });
    var due = rows.filter(function (r) { return r.s.checkin; }).length;
    return head('Clients', (due ? '<span class="dz-pill dz-pill--mid" style="align-self:center">' + due + ' due for a check-in</span>' : '') + '<button class="adm-btn" onclick="ADM.newClient()">+ New client</button>') +
      '<div class="adm-card adm-card--flush">' + (rows.length
        ? '<table class="dz-table"><tr><th>Client</th><th class="hide-m">Contact</th><th>Projects</th><th>Lifetime value</th><th class="hide-m">Last shoot</th><th>Open balance</th><th></th></tr>' +
          rows.map(function (r) {
            var c = r.c, s = r.s;
            return '<tr class="click" onclick="ADM.go(\'client/' + c.id + '\')">' +
              '<td><span class="who"><span class="dz-avatar dz-avatar--soft">' + esc(initials(c.name)) + '</span><span><b>' + esc(c.name) + '</b><small>' + esc(c.brokerage || '—') + '</small></span></span></td>' +
              '<td class="hide-m mut">' + esc(c.email || c.phone || '—') + '</td>' +
              '<td>' + s.projects + '</td>' +
              '<td>' + (s.lifetime ? money(s.lifetime) : '<span class="mut">—</span>') + '</td>' +
              '<td class="hide-m mut">' + (s.lastShoot ? relTime(s.lastShoot) : '—') + '</td>' +
              '<td>' + (s.open ? '<span style="color:#a03a3a">' + money(s.open) + '</span>' : '<span class="mut">—</span>') + '</td>' +
              '<td style="text-align:right">' + (s.checkin ? '<span class="dz-pill dz-pill--mid">Check in</span>' : (s.active ? '<span class="dz-pill dz-pill--hi">Active</span>' : '')) + '</td></tr>';
          }).join('') + '</table>'
        : '<p class="adm-empty" style="padding:1rem 1.1rem">No clients yet.</p>') + '</div>';
  }

  // ---- CSV helpers (bookkeeping export + client statements) --------------
  function csvOf(rows) {
    return rows.map(function (r) { return r.map(function (v) { v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(','); }).join('\r\n');
  }
  function downloadText(name, text) {
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv' })); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  }
  function invoiceRows(list) {
    var total = function (b) { return net(b) + (Number(b.travel_fee) || 0); };
    return [['Invoice', 'Project', 'Client', 'Brokerage', 'Location', 'Service', 'Shoot date', 'Invoice sent', 'Paid date', 'Status', 'Subtotal', 'Travel', 'Discount', 'Total']]
      .concat(list.map(function (b) {
        var cl = state.clients.find(function (c) { return c.id == b.client_id; }) || {};
        return ['JCS-' + String(b.id).padStart(4, '0'), b.title, b.client_name || '', cl.brokerage || '', b.location || '', b.type || '',
          b.shoot_date ? String(b.shoot_date).slice(0, 10) : '', b.invoice_sent_at ? String(b.invoice_sent_at).slice(0, 10) : '',
          b.paid_at ? String(b.paid_at).slice(0, 10) : '', b.status === 'paid' ? 'paid' : 'unpaid',
          Number(b.price) || 0, Number(b.travel_fee) || 0, Number(b.discount_value) || 0, total(b)];
      }));
  }

                '<button class="adm-btn adm-btn--danger adm-btn--sm" onclick="ADM.reqDecline(' + r.id + ')">Decline</button>'
              : (r.project_id ? '<button class="adm-btn adm-btn--ghost adm-btn--sm" onclick="ADM.go(\'project/' + r.project_id + '\')">Open project</button>' : '') +
                '<button class="adm-btn adm-btn--danger adm-btn--sm" onclick="ADM.reqDelete(' + r.id + ')">Delete</button>') +
          '</div></div>';

      : '<div class="adm-card"><p class="adm-empty">No ' + (state.reqTab === 'all' ? '' : state.reqTab + ' ') + 'requests. Applications from jacobcschrader.com/book land here.</p></div>');

  // ---- Projects: the listings ledger ----------------------------------
  // One row per project — address · client · stage · files · invoice ·
  // downloads state · Lock/Unlock (jacobguthrie.com/admin/listings).
  function pipeItems() {
    var q = state.q.toLowerCase();
    var f = state.stageFilter || 'active';
    return state.bookings.filter(function (b) {
      if (f === 'active' && b.status === 'canceled') return false;
      if (f !== 'active' && f !== 'all' && b.status !== f) return false;
      if (state.clientFilter && String(b.client_id) !== state.clientFilter) return false;
      if (q && (esc(b.title) + ' ' + (b.client_name || '') + ' ' + (b.location || '') + ' ' + (b.delivery_slug || '')).toLowerCase().indexOf(q) === -1) return false;
      return true;
    });
  }

  function vPipeline() {
    var items = pipeItems();
    var segs = [['active', 'All'], ['pending', 'Pending'], ['upcoming', 'Upcoming'], ['editing', 'Editing'],
                ['revisions', 'Revisions'], ['delivered', 'Delivered'], ['completed', 'Completed'], ['paid', 'Paid'], ['canceled', 'Canceled']];
    var toolbar = '<div class="adm-tools">' +
      '<span class="adm-seg">' + segs.map(function (s) {

      '<span class="grow" style="flex:1"></span>' +
      '<input type="search" id="pipe-q" placeholder="Search projects…" value="' + esc(state.q) + '" oninput="ADM.search(this.value)">' +
      '<select onchange="ADM.clientFilter(this.value)"><option value="">All clients</option>' +

    var info = card('Project info',
      '<div class="adm-kvgrid">' +

          : '—') +

  // ---- Delivery workspace (#delivery/<id>) — Visaro pattern: the project

  // ================= licensing =================
  var LIC_ROLES = { architect:'Architect', builder:'Builder', developer:'Developer', interior:'Interior Design',
                    landscape:'Landscape', pool:'Pool & Outdoor', brokerage:'Brokerage', other:'Other' };
  // The license pipeline: prospect → preview sent (watermarked gallery)
  // → accepted (they said yes) → licensed (final gallery + invoice +
  // terms sent) → paid. Declined parks a lead.
  var LIC_STATUS = { prospect:'Prospect', preview_sent:'Preview sent', accepted:'Said yes',
                     licensed:'Licensed', paid:'Paid', declined:'Declined' };
  var LIC_TABS = {
    active:   { label: 'Active licenses', set: ['accepted','licensed','paid'] },
    pipeline: { label: 'Outreach',        set: ['prospect','preview_sent'] },
    all:      { label: 'All',             set: null },
    declined: { label: 'Declined',        set: ['declined'] }
  };

  function licDue(l) {
    if (!l.follow_up || ['licensed','paid','declined'].indexOf(l.status) > -1) return false;
    return new Date(l.follow_up) <= new Date(new Date().toDateString());
  }
  // Suggested license fee from the JCS rate card (tunable defaults —
  // film base reflects the 2026-07-29 film pricing).
  function licSuggest(role, media, print, ads, size) {
    var base = media === 'film' ? 600 : 350;
    var mult = { developer:1.6, builder:1.4, architect:1.2, interior:1.0, brokerage:1.0, landscape:0.8, pool:0.8, other:1.0 }[role] || 1;
    var v = base * mult * (print ? 1.3 : 1) * (ads ? 1.5 : 1) * (size === 'small' ? 0.8 : size === 'full' ? 1.25 : 1);
    var round = function (n) { return Math.round(n / 25) * 25; };
    return { low: round(v * 0.75), rec: round(v), high: round(v * 1.25) };
  }

  function vLicensing() {
    var leads = state.licenseLeads;
    var props = []; leads.forEach(function (l) { if (props.indexOf(l.property) === -1) props.push(l.property); });

    var activeCount = leads.filter(function (l) { return ['accepted','licensed','paid'].indexOf(l.status) > -1; }).length;
    var collected = leads.filter(function (l) { return l.status === 'paid'; })
      .reduce(function (t, l) { return t + (Number(l.fee) || 0); }, 0);
    var outstanding = leads.filter(function (l) { return l.status === 'licensed'; })
      .reduce(function (t, l) { return t + (Number(l.fee) || 0); }, 0);
    var awaiting = leads.filter(function (l) { return l.status === 'preview_sent'; }).length;
    var dueCount = leads.filter(licDue).length;

    var list = leads.filter(function (l) {
      if (state.licProp && l.property !== state.licProp) return false;
      if (state.licTab === 'due') return licDue(l);
      var t = LIC_TABS[state.licTab] || LIC_TABS.all;
      return !t.set || t.set.indexOf(l.status) > -1;
    });

    var tabs = Object.keys(LIC_TABS).concat(['due']);
    var seg = '<div class="lx-tabs">' + tabs.map(function (t) {
      var label = t === 'due' ? 'Follow-ups' + (dueCount ? ' · ' + dueCount : '') : LIC_TABS[t].label;
      return '<button class="lx-tab' + (state.licTab === t ? ' on' : '') + '" onclick="ADM.licTab(\'' + t + '\')">' + label + '</button>';
    }).join('') + '</div>';

    var datalist = '<datalist id="lic-props">' + state.bookings.map(function (b) {
      return '<option value="' + esc(b.title) + '">' + esc(b.location || '') + '</option>';
    }).join('') + '</datalist>';
    var roleOpts = Object.keys(LIC_ROLES).map(function (r) {
      return '<option value="' + r + '">' + LIC_ROLES[r] + '</option>';
    }).join('');

    var results = '';
    if (state.licSearching) {
      results = '<div class="lx-note" style="margin-top:0.9rem">Running research&hellip;</div>';
    } else if (state.licResults) {
      if (state.licResults.needsKey) {
        results = '<div class="lx-note" style="margin-top:0.9rem">No search key yet — grab a free one at <a href="https://serper.dev" target="_blank" rel="noopener">serper.dev</a> ' +
          '(2,500 searches, no card) and paste it in <a href="#settings">Settings</a>. Quick links meanwhile: ' +
          Object.keys(LIC_ROLES).slice(0, 7).map(function (r) {
            return '<a href="https://www.google.com/search?q=' + encodeURIComponent('"' + (state.licQ || '') + '" ' + LIC_ROLES[r]) + '" target="_blank" rel="noopener">' + LIC_ROLES[r] + ' &nearr;</a>';
          }).join(' &nbsp;·&nbsp; ') + '</div>';
      } else if (state.licResults.searchError) {

  // ---- Deliveries: cover-card board of every listing with media ---------

          '<input id="tpl-' + k + '-subject" value="' + esc(subj) + '" placeholder="Subject">' +
          '<textarea id="tpl-' + k + '-note" placeholder="Opening paragraph">' + esc(note) + '</textarea>' +
          '<div class="tpl__ph">Placeholders: <code>{first}</code> <code>{name}</code> <code>{property}</code> <code>{location}</code>' + (/invoice/.test(k) ? ' <code>{number}</code> <code>{total}</code>' : k === 'confirm' ? ' <code>{date}</code>' : k === 'proposal' ? ' <code>{total}</code>' : '') + '</div></div></details>';
      }).join('') +

    var bodySto =

  // ---- shell helpers: needs-attention feed, sidebar status, bell ------
  function notifItems() {
    var out = [], now = Date.now(), day = 864e5;
    var pend = state.requests.filter(function (r) { return r.status === 'pending'; });
    if (pend.length) out.push({ t: pend.length + ' new request' + (pend.length > 1 ? 's' : '') + ' to review', s: pend.slice(0, 3).map(function (r) { return r.name; }).join(', '), r: 'requests', c: 'amb' });
    state.proposals.forEach(function (p) {
      if (p.status === 'sent' && p.sent_at && now - new Date(p.sent_at) > 3 * day)
        out.push({ t: 'Proposal waiting: ' + p.title, s: 'Sent ' + relTime(p.sent_at) + ' — worth a follow-up', r: 'proposal/' + p.id, c: 'amb' });
    });
    state.bookings.forEach(function (b) {
      if (b.status === 'canceled') return;
      var tot = net(b) + (Number(b.travel_fee) || 0);
      if (b.downloads_locked && b.status === 'paid') out.push({ t: 'Paid but downloads locked: ' + b.title, s: 'Unlock so the client can download', r: 'project/' + b.id, c: 'grn' });
      if (b.status === 'paid') return;
      if (b.delivery_feedback && !b.delivery_approved_at) out.push({ t: 'Changes requested: ' + b.title, s: String(b.delivery_feedback).slice(0, 90), r: 'project/' + b.id, c: 'red' });
      if (b.status === 'upcoming' && b.shoot_date && !b.confirmed_at && (new Date(String(b.shoot_date).slice(0, 10) + 'T12:00:00') - now) < 3 * day)
        out.push({ t: 'Unconfirmed shoot: ' + b.title, s: 'Shoot ' + relTime(b.shoot_date).toLowerCase() + ' — send the confirmation', r: 'project/' + b.id, c: 'amb' });
      if ((b.status === 'editing' || b.status === 'revisions') && b.shoot_date && !b.delivery_sent_at && (now - new Date(String(b.shoot_date).slice(0, 10) + 'T12:00:00')) > 3 * day)
        out.push({ t: 'Delivery overdue: ' + b.title, s: 'Shot ' + relTime(b.shoot_date).toLowerCase() + ' — nothing sent yet', r: 'project/' + b.id, c: 'red' });
      if (['delivered', 'completed'].indexOf(b.status) > -1 && !b.invoice_sent_at && b.price)
        out.push({ t: 'Invoice not sent: ' + b.title, s: money(tot) + ' — delivered ' + relTime(b.delivered_at || b.delivery_sent_at).toLowerCase(), r: 'project/' + b.id, c: 'amb' });
      if (b.invoice_sent_at && now - new Date(b.invoice_sent_at) > 14 * day)
        out.push({ t: 'Invoice overdue: ' + b.title, s: money(tot) + ' — sent ' + relTime(b.invoice_sent_at).toLowerCase(), r: 'project/' + b.id, c: 'red' });
    });
    var due = state.clients.filter(function (c) { return clientStats(c).checkin; }).slice(0, 3);
    due.forEach(function (c) { out.push({ t: 'Due for a check-in: ' + c.name, s: 'No shoot in 90+ days and nothing on the books', r: 'client/' + c.id, c: '' }); });
    return out.slice(0, 40);
  }
  function paintBell() {
    var n = notifItems().length, el = $('adm-bell-n');
    if (el) { el.textContent = n; el.classList.toggle('adm-hidden', !n); }
  }
  function paintSide() {
    var g = $('side-gcal'), d = $('side-date');
    if (d) d.textContent = new Date().toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
    if (!g) return;
    if (!state.gcal) { g.textContent = 'Checking…'; g.className = ''; }
    else if (state.gcal.ok) { g.textContent = 'Connected'; g.className = 'ok'; }
    else if (state.gcal.configured) { g.textContent = 'Not working'; g.className = 'warn'; }
    else { g.textContent = 'Not set up'; g.className = 'warn'; }
  }

  // ================= render =================
  function render() {
    var r = route(), m = $('main');
    var section = r.split('/')[0];
    // legacy routes from older emails/bookmarks


    var owns = { dash:'dash', requests:'requests', pipeline:'pipeline', project:'pipeline', deliveries:'deliveries', delivery:'deliveries', calendar:'calendar',
                 proposals:'proposals', proposal:'proposals', licensing:'licensing', billing:'billing',
                 clients:'clients', client:'clients', portfolio:'portfolio', siteproject:'portfolio', settings:'settings' }[section] || 'dash';
    document.querySelectorAll('#nav a').forEach(function (a) { a.classList.toggle('on', a.dataset.r === owns); });
    var side = $('side'); if (side) side.classList.remove('open');
    var qr = $('adm-qres'); if (qr) qr.hidden = true;
    var nf = $('adm-notif'); if (nf) nf.hidden = true;
    paintBell(); paintSide();
    if (section === 'requests') m.innerHTML = vRequests();
    else if (section === 'billing') m.innerHTML = vBilling();
    else if (section === 'calendar') m.innerHTML = vCalendar();
    else if (section === 'pipeline') m.innerHTML = vPipeline();
    else if (section === 'delivery') {
      var did = r.split('/')[1];
      m.innerHTML = vDeliveryPage(did);
      if (!state.ls || String(state.ls.id) !== String(did)) ADM.lsLoad(did);
      window.scrollTo(0, 0);
    }
    else if (section === 'project') {
      var pid = r.split('/')[1];
      m.innerHTML = vBookingDetail(pid);
      // files + activity load once per listing; uploads in flight keep their state
      if (!state.ls || String(state.ls.id) !== String(pid)) ADM.lsLoad(pid);
      window.scrollTo(0, 0);
    }
    else if (section === 'proposals') m.innerHTML = vProposals();
    else if (section === 'proposal') m.innerHTML = vProposalEdit(r.split('/')[1]);
    else if (section === 'licensing') m.innerHTML = vLicensing();
    else if (section === 'clients') m.innerHTML = vClients();
    else if (section === 'client') m.innerHTML = vClientDetail(r.split('/')[1]);
    else if (section === 'portfolio') { state.sp = null; m.innerHTML = vPortfolio(); }
    else if (section === 'siteproject') m.innerHTML = vSiteProject(r.split('/')[1]);
    else if (section === 'deliveries') { m.innerHTML = vDeliveries(); if (!state.dl && !state.dlBusy) ADM.dlLoad(); }
    else if (section === 'settings') {
      // Fresh data when ARRIVING at Settings; redraws while here reuse the
      // cache. (backupInfo() re-renders when it lands — fetching on every
      // render made an endless fetch→render→fetch loop that redrew the pane
      // every second and wiped whatever you were typing.)
      if (state._lastSection !== 'settings') { state.backup = null; state.gcalStatus = null; }
      m.innerHTML = vSettings();
      setTimeout(function () { ADM.gcalCheck(); if (!state.backup) ADM.backupInfo(); }, 0);
    }
    else m.innerHTML = vDash();
    state._lastSection = section;
  }

  $('nav').addEventListener('click', function (e) {
    var a = e.target.closest('a'); if (a && a.dataset.r) go(a.dataset.r);
  });
  // Settings accordions: remember open/closed. Section rows persist across
  // reloads (localStorage); template rows only for the session.
  state.accOpen = {};
  $('main').addEventListener('toggle', function (e) {
    var d = e.target; if (!d || !d.dataset || !d.dataset.acc) return;
    var id = d.dataset.acc;
    state.accOpen[id] = d.open;
    if (!/^tpl-/.test(id)) { try { localStorage.setItem('adm-acc:' + id, d.open ? '1' : '0'); } catch (err) {} }
    // keep the Expand/Collapse-all button honest without a full re-render
    var b = document.querySelector('.adm-head button[onclick^="ADM.accAll"]');
    if (b && !/^tpl-|^lic-/.test(id)) {
      var any = [].slice.call(document.querySelectorAll('details.acc')).some(function (x) { return x.open; });
      b.textContent = any ? 'Collapse all' : 'Expand all'; b.setAttribute('onclick', 'ADM.accAll(' + (any ? 'false' : 'true') + ')');
    }
  }, true);

  // exposed for inline handlers
  window.ADM = {
    go: go,
    accAll: function (open) {
      document.querySelectorAll('details.acc').forEach(function (d) { d.open = !!open; });
    },
    miscSave: async function () {
      var body = {};
      if ($('s-deposit')) body.deposit_pct = $('s-deposit').value.trim();
      if ($('s-archive')) body.archive_months = $('s-archive').value.trim();
      try { var j = await api('settings', 'PUT', body); state.settings = j.settings || state.settings; toast('Saved.'); }
      catch (e) { toast(friendly(e), 'err'); }
    },
    dvTab: function (t) { state.dvTab = t; render(); },
    dvSort: function (v) { state.dvSort = v; render(); },
    dvQ: function (v) {
      // update the board in place — re-rendering the page would eat the
      // search field's focus on every keystroke
      state.dvQ = v;
      var el = $('dv-board'); if (el) el.innerHTML = dvCards();
    },
    dlLoad: async function () {
      if (state.dlBusy) return; state.dlBusy = true;
      try { state.dl = await api('downloads?limit=300'); } catch (e) { state.dl = { events: [], week: 0 }; }
      state.dlBusy = false;
      if (route() === 'deliveries') render();
    },
    backupInfo: async function () {
      // one fetch, then a single redraw of Settings (render() will not schedule
      // us again because state.backup is now set)
      try { state.backup = await api('backup'); } catch (e) { state.backup = { error: friendly(e), backups: [], storage: null }; }
      if (route() === 'settings') render();
    },
    backupNow: async function () {
      toast('Backing up…');
      try { var j = await api('backup', 'POST', {}); toast('Backup saved (' + Math.round(j.backup.bytes / 1024) + ' KB).'); state.backup = null; ADM.backupInfo(); }
      catch (e) { toast(friendly(e), 'err'); }
    },
    calExtLoad: async function (ym) {
      if (state.calExt[ym] || state.calBusy[ym]) return;
      state.calBusy[ym] = true;
      var y = parseInt(ym.slice(0, 4), 10), mo = parseInt(ym.slice(5, 7), 10);
      var from = ym + '-01', to = y + '-' + String(mo).padStart(2, '0') + '-' + String(new Date(y, mo, 0).getDate()).padStart(2, '0');
      try { var j = await api('gcalevents?from=' + from + '&to=' + to); state.calExt[ym] = j.events || []; }
      catch (e) { state.calExt[ym] = []; }
      state.calBusy[ym] = false;
      if (route() === 'calendar') render();
    },
    // ---- calendar ----
    calMove: function (dir) {
      if (dir === 0) { state.calMonth = new Date().toISOString().slice(0, 7); render(); return; }

    // Decode a photo once, derive the 2048px web copy + ~640px thumb.
    lsDerive: function (file) {
      return new Promise(function (resolve) {
        var img = new Image();
        img.onload = function () {
          var w = img.naturalWidth, h = img.naturalHeight;
          function make(max, q) {
            return new Promise(function (res) {
              var scale = Math.min(1, max / Math.max(w, h));
              var c = document.createElement('canvas');
              c.width = Math.max(1, Math.round(w * scale)); c.height = Math.max(1, Math.round(h * scale));
              c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
              c.toBlob(function (b) { res(b); }, 'image/jpeg', q);
            });
          }
          Promise.all([make(2048, 0.84), make(640, 0.78)]).then(function (r) {
            URL.revokeObjectURL(img.src);
            resolve({ w: w, h: h, web: r[0], thumb: r[1] });
          });
        };
        img.onerror = function () { URL.revokeObjectURL(img.src); resolve(null); };
        img.src = URL.createObjectURL(file);
      });
    },
    // Poster frame for a film (first second and a half), for the grids.
    lsPoster: function (file) {
      return new Promise(function (resolve) {
        var v = document.createElement('video'), done = false;
        var finish = function (b) { if (done) return; done = true; try { URL.revokeObjectURL(v.src); } catch (e) {} resolve(b || null); };
        v.muted = true; v.playsInline = true; v.preload = 'auto';
        v.onloadeddata = function () { try { v.currentTime = Math.min(1.5, (v.duration || 3) / 3); } catch (e) { finish(null); } };
        v.onseeked = function () {
          try {
            var s = Math.min(1, 1280 / (v.videoWidth || 1280));
            var c = document.createElement('canvas');

    },
    reqAccept: async function (id) {
      if (!confirm('Book directly (skip the proposal)? A client + project are created as Upcoming (no email yet — you set the quote, then Confirm & send).')) return;
      try {
        var j = await api('requests', 'POST', { id: id, action: 'accept' });
        await reload(); go('project/' + j.projectId);
      } catch (e) { toast(friendly(e), 'err'); }
    },
    reqPropose: async function (id) {
      if (!confirm('Send a proposal? A client + Pending project + draft proposal are created, prefilled from the application — you set the prices, then Send. Their acceptance signs it and books the project.')) return;
      try {
        var j = await api('requests', 'POST', { id: id, action: 'propose' });
        await reload(); go('proposal/' + j.proposalId);
        toast('Draft proposal ready — set the prices, then send.');
      } catch (e) { toast(friendly(e), 'err'); }
    },
    reqDecline: async function (id) {
      if (!confirm('Decline this request? A graceful decline email goes to the applicant.')) return;
      try { await api('requests', 'POST', { id: id, action: 'decline' }); await reload(); render(); }
      catch (e) { toast(friendly(e), 'err'); }
    },
    reqDelete: async function (id) {
      if (!confirm('Delete this request permanently?')) return;
      try { await api('requests', 'DELETE', { id: id }); await reload(); render(); }
      catch (e) { toast(friendly(e), 'err'); }
    },
    newClient: function () { clientModal(); },
    editClient: function (id) { clientModal(state.clients.find(function (c) { return c.id == id; })); },
    delClient: async function (id) {
      if (!confirm('Delete this client? Their projects are kept (unlinked).')) return;
      try { await api('clients', 'DELETE', { id: id }); await reload(); go('clients'); render(); } catch (e) { toast(friendly(e), 'err'); }
    },
    newBooking: function (clientId) { bookingModal(null, clientId); },
    editBooking: function (id) { bookingModal(state.bookings.find(function (b) { return b.id == id; })); },
    delBooking: async function (id) {
      if (!confirm('Delete this project?')) return;
      try { await api('bookings', 'DELETE', { id: id }); await reload(); go('pipeline'); render(); } catch (e) { toast(friendly(e), 'err'); }
    }
  };

  // "/" focuses search; clicks outside close the search + attention popovers
  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName) && !$('app').classList.contains('adm-hidden')) {
      e.preventDefault(); var q = $('adm-q'); if (q) { q.focus(); q.select(); }
    }
  });
  document.addEventListener('mousedown', function (e) {
    var qr = $('adm-qres'), nf = $('adm-notif');
    if (qr && !qr.hidden && !e.target.closest('.adm-search')) qr.hidden = true;
    if (nf && !nf.hidden && !e.target.closest('.adm-top__acts')) nf.hidden = true;
  });

  // boot
  fetch('/api/admin/me').then(function (r) { r.ok ? showApp() : showLogin(); }).catch(showLogin);
})();
</script>
</body>
</html>
