<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Studio Admin — Jacob Schrader</title>
<link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png">
<link rel="icon" type="image/png" sizes="512x512" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
<style>
/* ================= Studio Admin — Resid-inspired system ==============
   Brand tokens from styles.css (--navy, --serif, --sans) + Resid layer:
   Space Mono microlabels, teal accent, dark ledger surfaces, pills. */
:root { --rx-teal: #3f7c92; --rx-dark: #0d1524; --rx-line: rgba(15,34,64,0.12);
        /* JCS brand: tracked-caps microlabels are Inter (the site's
           eyebrow style), not a monospace — the var name stays for
           compatibility with every rule that references it. */
        --rx-mono: var(--sans); }
body { background: #ecece8; }
.adm-hidden { display: none !important; }

/* ---- Login ---- */
.adm-login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
.adm-login__card { background: #fff; width: min(400px, 100%); padding: clamp(2rem, 5vw, 3rem); border: 1px solid var(--rx-line); border-radius: 22px; text-align: center; }
.adm-login__brand { font-family: var(--serif); font-style: italic; font-weight: 300; font-size: 2.2rem; color: var(--navy); }
.adm-login__sub { font-family: var(--rx-mono); font-size: 0.6rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--rx-teal); margin: 0.6rem 0 2rem; }

/* ---- Shell: sidebar + content ---- */
.adm-app { display: flex; min-height: 100vh; }
.adm-side { width: 216px; flex: 0 0 216px; background: var(--rx-dark); color: #fff; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
.adm-side__brand { padding: 2rem 1.6rem 1.6rem; }
.adm-side__brand b { display: block; font-family: var(--serif); font-style: italic; font-weight: 300; font-size: 1.9rem; line-height: 1; }
.adm-side__brand span { display: block; margin-top: 0.55rem; font-family: var(--rx-mono); font-size: 0.54rem; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(127,179,200,0.75); }
.adm-side nav { flex: 1; padding: 0.6rem 0; }
.adm-side nav a { display: flex; align-items: center; gap: 0.6rem; padding: 0.66rem 1.6rem; color: rgba(247,245,240,0.55); font-size: 0.82rem; letter-spacing: 0.01em; cursor: pointer; }
.adm-side nav a::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: transparent; flex: none; transition: background 0.2s; }
.adm-side nav a:hover { color: #f7f5f0; }
.adm-side nav a.on { color: #f7f5f0; background: rgba(247,245,240,0.06); }
.adm-side nav a.on::before { background: var(--rx-teal); }
.adm-side__foot { padding: 1.4rem 1.6rem; border-top: 1px solid rgba(247,245,240,0.1); }
.adm-side__foot a { color: rgba(247,245,240,0.5); font-family: var(--rx-mono); font-size: 0.6rem; letter-spacing: 0.16em; text-transform: uppercase; cursor: pointer; }
.adm-side__foot a:hover { color: #f7f5f0; }
.adm-main { flex: 1; min-width: 0; padding: clamp(1.4rem, 3vw, 2.6rem) clamp(1.2rem, 3.5vw, 3rem) 5rem; }

/* ---- View header ---- */
.adm-head { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.6rem; flex-wrap: wrap; }
.adm-head h1 { font-family: var(--sans); font-weight: 800; letter-spacing: -0.03em; font-size: 1.7rem; color: var(--ink); margin: 0; line-height: 1.05; }
.adm-headmark { flex-basis: 100%; display: flex; align-items: center; gap: 0.55rem; font-family: var(--rx-mono); font-size: 0.62rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--rx-teal); margin-bottom: -0.5rem; }
.adm-headmark::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--rx-teal); }
.adm-headmark .dim { color: var(--muted); }
.adm-head .grow { flex: 1; }
.adm-back { font-family: var(--rx-mono); font-size: 0.62rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); cursor: pointer; }
.adm-back:hover { color: var(--rx-teal); }

/* ---- Buttons / badges / tables ---- */
.adm-btn { display: inline-flex; align-items: center; gap: 0.5rem; background: var(--navy); color: #f7f5f0; border: 0; border-radius: 999px; cursor: pointer; font-family: var(--sans); font-size: 0.78rem; font-weight: 600; letter-spacing: -0.01em; text-transform: none; padding: 0.68rem 1.35rem; transition: opacity 0.2s; }
.adm-btn:hover { background: var(--navy); opacity: 0.86; }
.adm-btn--ghost { background: transparent; color: var(--ink); border: 1px solid rgba(15,34,64,0.25); }
.adm-btn--ghost:hover { background: #fff; opacity: 1; }
.adm-btn--danger { background: transparent; color: #a33; border: 1px solid rgba(170,51,51,0.35); }
.adm-btn--danger:hover { background: #fdf3f3; opacity: 1; }
.adm-badge { display: inline-flex; align-items: center; gap: 0.38rem; font-family: var(--rx-mono); font-size: 0.56rem; letter-spacing: 0.12em; text-transform: uppercase; padding: 0.3rem 0.68rem; border-radius: 999px; border: 1px solid rgba(15,34,64,0.16); background: #fff; color: var(--muted); white-space: nowrap; }
.adm-badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
.adm-badge--live { background: #e7f3ec; color: #1d5d38; border-color: rgba(29,93,56,0.35); }
.adm-badge--draft { background: #faf6e9; color: #8a6d1f; border-color: rgba(138,109,31,0.3); }
.adm-badge--upcoming { background: #ecf2f9; color: #2c5d8f; border-color: rgba(44,93,143,0.35); }
.adm-badge--editing { background: #faf6e9; color: #8a6d1f; border-color: rgba(138,109,31,0.3); }
.adm-badge--revisions { background: #fdf1e7; color: #b3541e; border-color: rgba(179,84,30,0.35); }
.adm-badge--delivered { background: #f2eefa; color: #6b4fa0; border-color: rgba(107,79,160,0.3); }
.adm-badge--completed { background: #e7f3ec; color: #1d5d38; border-color: rgba(29,93,56,0.35); }
.adm-badge--paid { background: var(--rx-dark); color: #7fb3c8; border-color: var(--rx-dark); }
.adm-badge--canceled { background: #faeeee; color: #9c3a3a; border-color: rgba(156,58,58,0.3); }
.adm-badge--pending { background: #faf6e9; color: #8a6d1f; border-color: rgba(138,109,31,0.3); }
.adm-badge--accepted { background: #eef4f7; color: var(--rx-teal); border-color: rgba(63,124,146,0.4); }
.adm-badge--declined { background: #faeeee; color: #9c3a3a; border-color: rgba(156,58,58,0.3); }
.adm-count { display: inline-block; min-width: 18px; text-align: center; background: var(--rx-teal); color: #fff; font-family: var(--rx-mono); font-size: 0.6rem; font-weight: 700; border-radius: 9px; padding: 0.1rem 0.35rem; margin-left: 0.5rem; }

.adm-card { background: #fff; border: 1px solid var(--rx-line); border-radius: 18px; padding: clamp(1.2rem, 2.5vw, 1.7rem); }
.adm-card + .adm-card { margin-top: 1.3rem; }
.adm-card h2 { display: flex; align-items: center; gap: 0.55rem; font-family: var(--rx-mono); font-style: normal; font-weight: 400; font-size: 0.66rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink); margin: 0 0 1.1rem; }
.adm-card h2::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--rx-teal); flex: none; }
.adm-table { width: 100%; border-collapse: collapse; font-size: 0.87rem; }
.adm-table th { text-align: left; font-family: var(--rx-mono); font-size: 0.56rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); font-weight: 400; padding: 0.55rem 0.8rem 0.55rem 0; border-bottom: 1px solid rgba(15,34,64,0.16); }
.adm-table td { padding: 0.8rem 0.8rem 0.8rem 0; border-bottom: 1px solid rgba(15,34,64,0.07); color: var(--ink); vertical-align: middle; }
.adm-table tr.click { cursor: pointer; }
.adm-table tr.click:hover td { background: #f6f6f2; }
.adm-empty { color: var(--muted); font-size: 0.9rem; padding: 1rem 0; }
small.mut { color: var(--muted); }

/* ---- Dashboard (dark ledger band, Resid-style) ---- */
.adm-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem 1.6rem; margin-bottom: 1.4rem; background: var(--rx-dark); border-radius: 18px; padding: 1.3rem 1.5rem; }
.adm-stat { background: transparent; padding: 0; }
.adm-stat b { display: block; font-family: var(--rx-mono); font-size: 1.4rem; font-weight: 700; color: #f7f5f0; line-height: 1.2; letter-spacing: 0; }
.adm-stat:first-child b { color: #7fb3c8; }
.adm-stat span { display: block; margin-top: 0.3rem; font-family: var(--rx-mono); font-size: 0.55rem; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(247,245,240,0.45); }
.adm-cols { display: grid; grid-template-columns: 1.4fr 1fr; gap: 1.4rem; align-items: start; }
@media (max-width: 980px) { .adm-cols { grid-template-columns: 1fr; } }
.adm-day { display: flex; gap: 1rem; padding: 0.7rem 0; border-bottom: 1px solid var(--line-soft); }
.adm-day__date { flex: 0 0 74px; text-align: center; }
.adm-day__date b { display: block; font-family: var(--rx-mono); font-weight: 700; font-size: 1.2rem; color: var(--ink); line-height: 1.1; }
.adm-day__date span { font-family: var(--rx-mono); font-size: 0.55rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--rx-teal); }
.adm-day__body { flex: 1; cursor: pointer; }
.adm-day__body:hover .t { text-decoration: underline; text-underline-offset: 3px; }
.adm-day__body .t { color: var(--ink); font-size: 0.92rem; }
.adm-feed li { list-style: none; padding: 0.65rem 0; border-bottom: 1px solid var(--line-soft); font-size: 0.86rem; color: var(--ink); }
.adm-feed li small { display: block; color: var(--muted); margin-top: 0.15rem; }
.adm-feed { margin: 0; padding: 0; }

/* ---- Pipeline (kanban) ---- */
.adm-pipe { display: grid; grid-template-columns: repeat(6, minmax(190px, 1fr)); gap: 1rem; overflow-x: auto; align-items: start; padding-bottom: 0.5rem; }
@media (max-width: 1200px) { .adm-pipe { display: flex; } .adm-pipe .adm-col { flex: 0 0 240px; } }
.adm-col { background: rgba(13,21,36,0.045); border-radius: 14px; padding: 0.8rem; min-height: 220px; }
.adm-col.dragover { outline: 2px dashed var(--rx-teal); outline-offset: -2px; }
.adm-col__head { display: flex; align-items: baseline; gap: 0.5rem; padding: 0.2rem 0.3rem 0.8rem; }
.adm-col__head b { font-family: var(--rx-mono); font-size: 0.58rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink); font-weight: 400; }
.adm-col__head span { font-family: var(--rx-mono); font-size: 0.6rem; color: var(--muted); }
.adm-col__sum { margin-left: auto; font-family: var(--rx-mono); font-size: 0.62rem; color: var(--rx-teal); }
.adm-cardlet { background: #fff; border: 1px solid var(--rx-line); border-radius: 12px; padding: 0.85rem 0.95rem; margin-bottom: 0.7rem; cursor: grab; position: relative; }
.adm-cardlet:active { cursor: grabbing; }
.adm-cardlet.dragging { opacity: 0.4; }
.adm-cardlet b { display: block; font-weight: 700; letter-spacing: -0.01em; font-size: 0.92rem; color: var(--ink); margin-bottom: 0.2rem; cursor: pointer; }
.adm-cardlet b:hover { text-decoration: underline; text-underline-offset: 3px; }
.adm-cardlet small { display: block; color: var(--muted); font-size: 0.76rem; line-height: 1.5; }
.adm-cardlet .adv { position: absolute; right: 0.5rem; bottom: 0.45rem; background: none; border: 0; cursor: pointer; color: var(--muted); font-size: 1rem; padding: 0.2rem 0.4rem; }
.adm-cardlet .adv:hover { color: var(--navy); }

/* ---- Pipeline toolbar + stacked stages ---- */
.adm-tools { display: flex; gap: 0.7rem; align-items: center; flex-wrap: wrap; margin-bottom: 1.4rem; }
.adm-seg { display: inline-flex; gap: 0.35rem; border: 0; background: transparent; }
.adm-seg button { background: transparent; border: 1px solid rgba(15,34,64,0.16); border-radius: 999px; cursor: pointer; font-family: var(--rx-mono); font-size: 0.58rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); padding: 0.44rem 0.9rem; }
.adm-seg button.on { background: var(--rx-dark); border-color: var(--rx-dark); color: #f7f5f0; }
.adm-tools input[type=search], .adm-tools select { font-family: var(--sans); font-size: 0.85rem; color: var(--ink); background: #fff; border: 1px solid rgba(15,34,64,0.2); border-radius: 999px; padding: 0.5rem 1rem; outline: none; }
.adm-tools input[type=search] { min-width: 200px; }
.adm-tools input[type=search]:focus, .adm-tools select:focus { border-color: var(--rx-teal); }

.adm-stage { background: #fff; border: 1px solid var(--rx-line); border-left: 3px solid var(--navy); border-radius: 14px; margin-bottom: 1rem; overflow: hidden; }
.adm-stage__head { display: flex; align-items: baseline; gap: 0.7rem; padding: 0.95rem 1.2rem; cursor: pointer; user-select: none; }
.adm-stage__head b { font-family: var(--rx-mono); font-size: 0.62rem; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 700; }
.adm-stage__head .n { font-family: var(--rx-mono); font-size: 0.6rem; color: var(--muted); }
.adm-stage__head .s { font-family: var(--rx-mono); font-size: 0.66rem; color: var(--rx-teal); margin-left: auto; }
.adm-stage__head .chev { color: var(--muted); font-size: 0.8rem; transition: transform 0.2s; }
.adm-stage.closed .chev { transform: rotate(-90deg); }
.adm-stage__body { padding: 0 1.2rem 1.1rem; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 0.8rem; }
.adm-stage__list { padding: 0 1.2rem 0.6rem; }
.adm-stage.closed .adm-stage__body, .adm-stage.closed .adm-stage__list { display: none; }
.adm-prow { display: grid; grid-template-columns: 2.2fr 1.3fr 1fr auto 96px 22px; align-items: center; gap: 1rem; padding: 0.8rem 0.2rem; border-top: 1px solid var(--line-soft); cursor: pointer; }
.adm-prow:hover { background: #f6f6f2; }
.adm-prow__t b { display: block; font-size: 0.92rem; font-weight: 700; letter-spacing: -0.01em; color: var(--ink); }
.adm-prow__t small { color: var(--muted); font-size: 0.78rem; }
.adm-prow__c, .adm-prow__d { font-size: 0.84rem; color: var(--muted); }
.adm-prow__p { font-family: var(--rx-mono); font-size: 0.84rem; font-weight: 700; color: var(--ink); text-align: right; }
.adm-prow .adv { background: none; border: 0; cursor: pointer; color: var(--muted); font-size: 1.1rem; padding: 0 0.2rem; }
.adm-prow .adv:hover { color: var(--navy); }
.adm-badge--unpaid { background: #f5e8e8; color: #a03a3a; }
@media (max-width: 820px) {
  .adm-prow { grid-template-columns: 1fr auto 80px 20px; }
  .adm-prow__c, .adm-prow__d { display: none; }
}
.adm-stage.dragover { outline: 2px dashed var(--navy); outline-offset: -2px; }
.adm-stage__body .adm-cardlet { margin-bottom: 0; border: 1px solid var(--line-soft); }

/* ---- Deliveries ---- */
.adm-delgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 1.2rem; }
.adm-del { background: #fff; border: 1px solid var(--rx-line); border-radius: 16px; overflow: hidden; }
.adm-del__cover { position: relative; aspect-ratio: 16/10; background: linear-gradient(150deg, var(--navy) 0%, #1a3357 100%); cursor: pointer; }
.adm-del__cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.adm-del__cover .adm-badge { position: absolute; top: 0.7rem; left: 0.7rem; }
.adm-del__cover .adm-del__mono { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--serif); font-style: italic; font-size: 1.6rem; color: rgba(255,255,255,0.35); }
.adm-del__body { padding: 1rem 1.2rem 1.15rem; }
.adm-del b { display: block; font-weight: 700; letter-spacing: -0.01em; font-size: 0.98rem; color: var(--ink); cursor: pointer; }
.adm-del b:hover { color: var(--rx-teal); }
.adm-del small { display: block; color: var(--muted); margin: 0.3rem 0 0.8rem; line-height: 1.6; }
.adm-del .lnk { font-family: var(--rx-mono); font-size: 0.6rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--rx-teal); text-decoration: none; border: 1px solid rgba(63,124,146,0.35); border-radius: 999px; padding: 0.28rem 0.7rem; }
.adm-del .nolnk { font-family: var(--rx-mono); font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase; color: #8a6d1f; }

/* ---- Portfolio grid ---- */
.adm-projgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1.2rem; }
.adm-proj { background: #fff; border: 1px solid var(--rx-line); border-radius: 14px; overflow: hidden; display: block; color: var(--ink); }
.adm-proj .ph-wrap { aspect-ratio: 3/2; background: var(--navy-deep); overflow: hidden; }
.adm-proj img { width: 100%; height: 100%; object-fit: cover; display: block; }
.adm-proj .cap { padding: 0.8rem 0.9rem 0.9rem; }
.adm-proj .cap b { display: block; font-weight: 700; letter-spacing: -0.01em; font-size: 0.94rem; color: var(--ink); margin-bottom: 0.3rem; }

/* ---- Detail pages ---- */
.adm-detail { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem 2rem; margin-bottom: 0.4rem; }
.adm-kv label { display: block; font-family: var(--rx-mono); font-size: 0.54rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.3rem; }
.adm-kv div { font-size: 0.95rem; color: var(--ink); }
.adm-kv a { color: var(--rx-teal); text-decoration: underline; text-underline-offset: 3px; }
.adm-notes { background: #f4f4f0; border: 1px solid rgba(15,34,64,0.07); border-radius: 12px; padding: 1rem 1.2rem; font-size: 0.9rem; color: var(--ink); white-space: pre-line; margin-top: 1rem; }

/* ---- Project detail page ---- */
.adm-phead { display: flex; align-items: flex-start; gap: 1.2rem; flex-wrap: wrap; margin: 0.4rem 0 1.6rem; }
.adm-phead h1 { font-family: var(--sans); font-style: normal; font-weight: 800; letter-spacing: -0.03em; font-size: clamp(1.6rem, 3vw, 2.1rem); color: var(--ink); margin: 0 0 0.35rem; line-height: 1.1; }
.adm-phead .sub { font-size: 0.9rem; color: var(--muted); }
.adm-phead .sub a { color: var(--navy); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.adm-phead .acts { margin-left: auto; display: flex; gap: 0.6rem; flex-wrap: wrap; }
.adm-detail2 { display: grid; grid-template-columns: 1.55fr 1fr; gap: 1.4rem; align-items: start; }
@media (max-width: 980px) { .adm-detail2 { grid-template-columns: 1fr; } }
.adm-kvgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1.1rem 2rem; }
.adm-sched { display: flex; gap: 1rem; align-items: center; padding: 0.85rem 0; }
.adm-sched + .adm-sched { border-top: 1px solid var(--line-soft); }
.adm-sched__date { flex: 0 0 66px; text-align: center; background: #f4f4f0; border-radius: 12px; padding: 0.5rem 0.3rem; }
.adm-sched__date b { display: block; font-family: var(--rx-mono); font-size: 1.25rem; font-weight: 700; color: var(--ink); line-height: 1.1; }
.adm-sched__date span { font-family: var(--rx-mono); font-size: 0.52rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--rx-teal); }
.adm-sched__body b { display: block; font-size: 0.94rem; color: var(--ink); font-weight: 500; }
.adm-sched__body small { color: var(--muted); }
.adm-money__total { font-family: var(--rx-mono); font-size: 1.9rem; font-weight: 700; color: var(--ink); line-height: 1.15; }
.adm-mrow { display: flex; justify-content: space-between; gap: 1rem; font-size: 0.88rem; color: var(--ink); padding: 0.45rem 0; }
.adm-mrow small { color: var(--muted); }
.adm-mrow + .adm-mrow { border-top: 1px solid var(--line-soft); }
.adm-rail .adm-btn { width: 100%; justify-content: center; }
.adm-rail .adm-btn + .adm-btn { margin-top: 0.6rem; }
.adm-confnote { font-size: 0.82rem; color: var(--muted); margin-top: 0.8rem; text-align: center; }
.adm-confnote.ok { color: #2e5d3a; }

/* ---- Modal ---- */
.adm-modal { position: fixed; inset: 0; z-index: 200; background: rgba(13,21,36,0.6); display: flex; align-items: flex-start; justify-content: center; padding: 4vh 1rem; overflow: auto; }
.adm-modal__card { background: #fff; border-radius: 20px; width: min(640px, 100%); padding: clamp(1.5rem, 3vw, 2.2rem); }
.adm-modal__card h2 { font-family: var(--sans); font-style: normal; font-weight: 800; letter-spacing: -0.02em; font-size: 1.2rem; color: var(--ink); margin: 0 0 1.2rem; }
.adm-form { display: grid; grid-template-columns: 1fr 1fr; gap: 0.9rem; }
.adm-form .full { grid-column: 1 / -1; }
@media (max-width: 560px) { .adm-form { grid-template-columns: 1fr; } }
.adm-field label { display: block; font-family: var(--rx-mono); font-size: 0.54rem; letter-spacing: 0.13em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.38rem; }

/* ================= Licensing — Resid-inspired design system =================

:root { --lx-teal: #3f7c92; --lx-dark: #0d1524; --lx-ink: #16233b; --lx-line: rgba(15,34,64,0.12); }

  display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem 1.6rem; }
.lx-ledger .cell b { display: block; font-family: var(--rx-mono); font-weight: 700;
  font-size: 1.45rem; color: #f7f5f0; letter-spacing: 0; }
.lx-ledger .cell.teal b { color: #7fb3c8; }

.lx-card { background: #fff; border: 1px solid var(--lx-line); border-radius: 18px;

.lx-tabs { display: flex; gap: 0.4rem; flex-wrap: wrap; }

@media (max-width: 640px) { .lx-ledger { padding: 1.1rem 1.1rem; } .lx-card { padding: 1.05rem 1.1rem; } }

   Brand fonts over the Resid structure: Cormorant italic display,
   Cormorant lining-numeral money, Inter tracked-caps microlabels. */
.adm-head h1, .adm-modal__card h2, .adm-phead h1 {

}
</style>

    <div class="adm-side__foot"><a id="logout">Sign out</a></div>
  </aside>
  <main class="adm-main" id="main"></main>
</div>

<!-- Modal root -->
<div id="modal-root"></div>

<script src="projects-data.js"></script>
<script src="pricing-data.js"></script>
<script src="admin-blob.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];}); }
  function money(n){ return n==null||n===''?'—':'$'+Number(n).toLocaleString(); }
  function fmtT(t){ if(!/^\d{2}:\d{2}/.test(String(t||''))) return t||''; var p=t.slice(0,5).split(':'); var h=+p[0], ap=h>=12?'PM':'AM'; h=h%12||12; return h+':'+p[1]+' '+ap; }
  function discLabel(d){ return d.code + ' — ' + (d.kind === 'percent' ? Number(d.value) + '%' : '$' + Number(d.value).toLocaleString()) + (d.note ? ' · ' + d.note : ''); }
  function net(b){ return (Number(b.price) || 0) - (Number(b.discount_value) || 0); }
  function dstr(d){ if(!d) return '—'; var t=new Date(d); return isNaN(t)?'—':t.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); }

  var state = { clients: [], bookings: [], requests: [], discounts: [], siteProjects: [], proposals: [], licenseLeads: [], sp: null, reqTab: 'pending', loaded: false,
              view: localStorage.getItem('adm-view') || 'pipeline', q: '', clientFilter: '', collapsed: {},
              licTab: 'active', licProp: '', licResults: null, licSearching: false };
var STAGE_COLOR = { upcoming:'#4a6da8', editing:'#b98a2f', revisions:'#b9652f', delivered:'#7a5fb8', completed:'#3f7a4f', paid:'#1d4d2a' };
  // Service lineup — mirrors the JCS-Pricing sheet (2026-07-29).
  var ADDONS = {
    'Photography': ['Flash / Ambient Photography','Aerial Photography','Vertical / Vignette Images','Twilight Photography','Virtual Staging','Virtual Twilight'],
    'Film':        ['Cinematic Property Film','Luxury Social Reel','Basic Property Film','Basic Social Reel','Twilight Videography','Teaser Video'],
    'Beyond':      ['Zillow 3D Tour','2D Floor Plan','Property Website']
  };
  var STAGES = ['upcoming','editing','revisions','delivered','completed','paid'];   // pipeline order
  // 'pending' sits BEFORE the pipeline: proposal sent, waiting on the
  // client's acceptance (which flips the project to upcoming).
  var STAGE_LABEL = { pending:'Pending proposal', upcoming:'Upcoming', editing:'Editing', revisions:'Revisions', delivered:'Delivered', completed:'Completed', paid:'Paid' };
  var STATUSES = ['pending'].concat(STAGES).concat(['canceled']);

  // ---- pricing-data.js hookups (the Numbers-sheet rates) -------------
  // Shared by the project + proposal forms so admin quotes always match
  // the sheet. svcDesc: the public description for a service name.
  function svcDesc(nm) {
    var P = window.JCS_PRICING || { services: [], extras: [] };
    var hit = '';
    (P.services || []).forEach(function (s) {
      if (s.name === nm && s.desc) hit = hit || s.desc;
      (s.addons || []).forEach(function (a) { if (a.name === nm) hit = hit || a.note || ''; });
    });
    (P.extras || []).forEach(function (x) { if (x.name === nm) hit = hit || x.note || ''; });
    return hit;
  }
  // svcQuote: exact price at a sqft — same engine as the booking wizard
  // (tiered brackets, flat add-ons, Zillow's own table). Tiered things
  // stay blank without a sqft; per-image add-ons return a note instead
  // of a price; 6,000+ (Inquire) stays blank for a hand quote.
  function svcQuote(nm, sqft) {
    var P = window.JCS_PRICING, out = { price: '', note: '' };
    if (!P) return out;
    var n = parseInt(sqft, 10) || 0;
    function tiered(t) { if (!n) return; var p = P.priceAt(t, n); if (typeof p === 'number') out.price = p; else out.inquire = true; }
    (P.services || []).forEach(function (s) {
      if (s.name === nm) tiered(s);
      (s.addons || []).forEach(function (a) {
        if (a.name !== nm) return;
        if (a.unit) out.note = '$' + a.price + ' per ' + a.unit + ' — tallied after the shoot';
        else out.price = a.price;
      });
    });
    (P.extras || []).forEach(function (x) {
      if (x.name !== nm) return;
      if (typeof x.price === 'number') out.price = x.price; else tiered(x);
    });
    return out;
  }

  async function api(path, method, body) {
    var r = await fetch('/api/admin/' + path, {
      method: method || 'GET',
      headers: body ? { 'Content-Type': 'application/json' } : undefined,
      body: body ? JSON.stringify(body) : undefined
    });
    if (r.status === 401) { showLogin(); throw new Error('unauthorized'); }
    var j = await r.json().catch(function(){ return {}; });
    if (!r.ok) throw new Error(j.error || 'error');
    return j;
  }
  function friendly(err) {
    if (err && err.userMessage) return err.userMessage;   // validation notes pass through
    return String(err.message) === 'db-not-configured'
      ? 'Database not connected — check the Neon integration in Vercel.'
      : 'Something went wrong — try again.';
  }

  // Quiet toast notifications (replaces alert() popups).
  function toast(msg, kind) {
    var host = $('adm-toasts');
    if (!host) {
      host = document.createElement('div');
      host.id = 'adm-toasts';
      document.body.appendChild(host);
    }
    var t = document.createElement('div');
    t.className = 'adm-toast' + (kind === 'err' ? ' adm-toast--err' : '');
    t.textContent = msg;
    host.appendChild(t);
    requestAnimationFrame(function () { t.classList.add('in'); });
    setTimeout(function () {
      t.classList.remove('in');
      setTimeout(function () { t.remove(); }, 350);
    }, kind === 'err' ? 5200 : 3200);
  }

  // ================= router =================
  function go(route) { location.hash = route; }
  function route() { return (location.hash || '#dash').slice(1); }
  window.addEventListener('hashchange', render);

  // ================= auth =================
  function showLogin(){ $('login').classList.remove('adm-hidden'); $('app').classList.add('adm-hidden'); }
  async function showApp(){
    $('login').classList.add('adm-hidden'); $('app').classList.remove('adm-hidden');
    try { await reload(); } catch (e) {}
    render();
  }
  async function reload() {
    var c = await api('clients'), b = await api('bookings'), r = await api('requests'), d = await api('discounts'), st = await api('settings'), sp = await api('siteprojects'), pr = await api('proposals'), lic = await api('licensing');
    state.clients = c.clients; state.bookings = b.bookings; state.requests = r.requests; state.discounts = d.discounts;
    state.siteProjects = sp.projects || [];
    state.proposals = pr.proposals || [];
    state.licenseLeads = lic.leads || [];
    state.settings = st.settings || {}; state.loaded = true;
    var pending = state.requests.filter(function (x) { return x.status === 'pending'; }).length;
    var badge = $('req-badge');
    if (badge) { badge.textContent = pending; badge.classList.toggle('adm-hidden', !pending); }
  }
  $('login-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    var msg = $('login-msg'); msg.classList.add('adm-hidden');
    var r = await fetch('/api/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: $('l-email').value, password: $('l-pass').value }) }).catch(function(){ return null; });
    if (!r || !r.ok) {
      msg.textContent = !r ? 'Network error — try again.' : 'Wrong email or password.';
      msg.classList.remove('adm-hidden'); return;
    }
    $('l-pass').value = ''; showApp();
  });
  $('logout').addEventListener('click', async function () {
    await fetch('/api/admin/logout', { method: 'POST' }).catch(function(){});
    showLogin();
  });

  // ================= modal =================
  function closeModal(){ $('modal-root').innerHTML = ''; }
  function openModal(title, formHtml, onSubmit, submitLabel) {
    $('modal-root').innerHTML =
      '<div class="adm-modal" id="modal-bg"><form class="adm-modal__card" id="modal-form">' +
      '<h2>' + esc(title) + '</h2><div class="adm-form">' + formHtml + '</div>' +
      '<div style="margin-top:1.4rem;display:flex;gap:0.8rem">' +
      '<button class="adm-btn" type="submit">' + esc(submitLabel || 'Save') + '</button>' +
      '<button class="adm-btn adm-btn--ghost" type="button" id="modal-cancel">Cancel</button></div>' +
      '<p class="adm-msg adm-hidden" id="modal-msg"></p></form></div>';
    $('modal-cancel').addEventListener('click', closeModal);
    $('modal-bg').addEventListener('mousedown', function (e) { if (e.target === this) closeModal(); });
    document.addEventListener('keydown', function onEsc(e) { if (e.key === 'Escape') { closeModal(); document.removeEventListener('keydown', onEsc); } });
    $('modal-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      try { await onSubmit(); closeModal(); } catch (err) {
        var m = $('modal-msg'); m.textContent = friendly(err); m.classList.remove('adm-hidden');
      }
    });
  }
  function fld(id, label, inner) {
    return '<div class="adm-field"><label for="' + id + '">' + label + '</label>' + inner + '</div>';
  }
  // Time picker: a select in 30-minute steps (6:00 AM – 10:00 PM). If an
  // existing project has an off-grid time (e.g. 9:15), it's kept as an
  // extra option so editing never silently changes it.
  function timeSel(id, val) {
    val = String(val || '').slice(0, 5);
    var opts = ['<option value="">—</option>'], onGrid = false;
    for (var m = 6 * 60; m <= 22 * 60; m += 30) {
      var hh = String(Math.floor(m / 60)).padStart(2, '0'), mm = m % 60 ? '30' : '00';
      var t = hh + ':' + mm, sel = t === val;
      if (sel) onGrid = true;
      opts.push('<option value="' + t + '"' + (sel ? ' selected' : '') + '>' + fmtT(t) + '</option>');
    }
    if (val && !onGrid) opts.push('<option value="' + esc(val) + '" selected>' + fmtT(val) + '</option>');
    return '<select id="' + id + '">' + opts.join('') + '</select>';
  }

  // ================= client form =================
  function clientModal(c, onSaved) {
    c = c || {};
    openModal(c.id ? 'Edit client' : 'New client',
      fld('f-name', 'Name *', '<input id="f-name" required value="' + esc(c.name || '') + '">') +
      fld('f-brokerage', 'Brokerage', '<input id="f-brokerage" value="' + esc(c.brokerage || '') + '">') +
      fld('f-email', 'Email', '<input id="f-email" type="email" value="' + esc(c.email || '') + '">') +
      fld('f-phone', 'Phone', '<input id="f-phone" value="' + esc(c.phone || '') + '">') +
      '<div class="adm-field full"><label for="f-extra">CC emails <small style="text-transform:none;letter-spacing:0">(assistant, spouse\u2026 \u2014 comma-separated; every notification goes to all)</small></label>' +
        '<input id="f-extra" placeholder="assistant@brokerage.com, spouse@gmail.com" value="' + esc(cliExtras(c).join(', ')) + '"></div>' +
      '<div class="adm-field full"><label for="f-notes">Notes</label><textarea id="f-notes">' + esc(c.notes || '') + '</textarea></div>',
      async function () {
        var extras = $('f-extra').value.split(/[,;\s]+/).filter(function (e) { return e.indexOf('@') > 0; });
        var body = { id: c.id, name: $('f-name').value, email: $('f-email').value, phone: $('f-phone').value,
                     brokerage: $('f-brokerage').value, notes: $('f-notes').value,
                     extra_emails: JSON.stringify(extras) };
        var j = await api('clients', c.id ? 'PUT' : 'POST', body);
        await reload();
        if (onSaved) onSaved(j.client); else render();
      });
  }

  // ================= project (booking) form =================
  function bookingModal(b, presetClient, draft) {
    b = b || {};
    var v = draft || b;   // draft = values captured before a quick client-create
    var checkedAddons = [];
    try { checkedAddons = JSON.parse(v.addons || '[]'); } catch (e) {}
    var selClientId = v.client_id || presetClient || '';
    var selClient = state.clients.find(function (c) { return c.id == selClientId; });
    function addonLabel(label, on) {
      return '<label style="display:flex;align-items:center;gap:0.5rem;font-size:0.85rem;color:var(--ink);text-transform:none;letter-spacing:0;cursor:pointer">' +
        '<input type="checkbox" class="f-addon" value="' + esc(label) + '"' + (on ? ' checked' : '') + ' style="width:auto"> ' + esc(label) +
        '<small class="f-svc-pr" data-nm="' + esc(label) + '" style="color:var(--muted);margin-left:0.35rem;white-space:nowrap"></small></label>';
    }
    var standardAddons = Object.keys(ADDONS).reduce(function (all, g) { return all.concat(ADDONS[g]); }, []);
    var customAddons = checkedAddons.filter(function (x) { return standardAddons.indexOf(x) === -1; });
    var addonsHtml = Object.keys(ADDONS).map(function (group) {
      return '<div style="margin-top:0.6rem"><div style="font-size:0.6rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--muted);margin-bottom:0.4rem">' + group + '</div>' +
        '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:0.35rem 1rem">' +
        ADDONS[group].map(function (label) { return addonLabel(label, checkedAddons.indexOf(label) > -1); }).join('') +
        '</div></div>';
    }).join('') +
      '<div style="margin-top:0.6rem"><div style="font-size:0.6rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--muted);margin-bottom:0.4rem">Custom</div>' +
        '<div id="f-customlist" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:0.35rem 1rem">' +
        customAddons.map(function (label) { return addonLabel(label, true); }).join('') + '</div>' +
        '<div style="display:flex;gap:0.5rem;margin-top:0.5rem">' +
          '<input id="f-customsvc" placeholder="Add a custom service…" style="flex:1;font-family:var(--sans);font-size:0.85rem;color:var(--ink);background:var(--paper-warm);border:1px solid var(--line);padding:0.5rem 0.7rem;outline:none">' +
          '<input id="f-customprice" type="number" min="0" step="1" placeholder="$" style="width:110px;font-family:var(--sans);font-size:0.85rem;color:var(--ink);background:var(--paper-warm);border:1px solid var(--line);padding:0.5rem 0.7rem;outline:none">' +
          '<button type="button" class="adm-btn adm-btn--ghost" id="f-addcustom" style="padding:0.45rem 0.9rem">+ Add</button>' +
        '</div></div>';

    openModal(b.id ? 'Edit project' : 'New project',
      '<div class="adm-field full"><label for="f-title">Property address *</label><div style="position:relative">' +
        '<input id="f-title" required placeholder="7750 Lahontan Drive" autocomplete="off" value="' + esc(v.title || '') + '">' +
        '<div id="f-addr-list" class="adm-cl-list" hidden></div></div></div>' +
      fld('f-city', 'City', '<input id="f-city" placeholder="Truckee" value="' + esc(v.city || '') + '">') +
      '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:0.9rem">' +
        '<div class="adm-field"><label for="f-state">State</label><input id="f-state" value="' + esc(v.state || 'CA') + '"></div>' +
        '<div class="adm-field"><label for="f-zip">Zip</label><input id="f-zip" value="' + esc(v.zip || '') + '"></div>' +
        '<div class="adm-field"><label for="f-sqft">Sqft</label><input id="f-sqft" type="number" min="0" value="' + (v.sqft == null ? '' : v.sqft) + '"></div>' +
      '</div>' +
      '<div class="adm-field full"><label for="f-client-q">Client</label><div style="display:flex;gap:0.5rem">' +
        '<div style="position:relative;flex:1">' +
          '<input type="hidden" id="f-client" value="' + esc(selClientId) + '">' +
          '<input id="f-client-q" placeholder="Search clients\u2026" autocomplete="off" value="' + esc(selClient ? selClient.name : '') + '">' +
          '<div id="f-client-list" class="adm-cl-list" hidden></div>' +
        '</div>' +
        '<button type="button" class="adm-btn adm-btn--ghost" id="f-newclient" style="padding:0.55rem 0.9rem">+ New</button></div></div>' +
      fld('f-date', 'Shoot date', '<input id="f-date" type="date" value="' + (v.shoot_date ? String(v.shoot_date).slice(0, 10) : '') + '">') +
      fld('f-time', 'Shoot time', timeSel('f-time', v.shoot_time)) +
      fld('f-twidate', 'Twilight <small style="text-transform:none;letter-spacing:0">(optional — date blank = same day)</small>', '<input id="f-twidate" type="date" value="' + (v.twilight_date ? String(v.twilight_date).slice(0, 10) : '') + '">') +
      fld('f-twitime', 'Twilight time <small style="text-transform:none;letter-spacing:0">(optional)</small>', timeSel('f-twitime', v.twilight_time)) +
      '<div class="adm-field full"><label>Addons <small style="text-transform:none;letter-spacing:0">(builds the deliverables list)</small></label>' + addonsHtml + '</div>' +
      '<div class="adm-field full"><label for="f-deliverables">Deliverables <small style="text-transform:none;letter-spacing:0">(shown to client — edit freely)</small></label><textarea id="f-deliverables">' + esc(v.deliverables || '') + '</textarea></div>' +
      fld('f-price', 'Price ($) <small style="text-transform:none;letter-spacing:0">(auto from sqft + service + add-ons — type to override)</small>',
        '<input id="f-price" type="number" min="0" step="1" value="' + (v.price == null ? '' : v.price) + '">') +
      fld('f-travel', 'Travel fee ($)', '<input id="f-travel" type="number" min="0" step="1" placeholder="e.g. 150" value="' + (v.travel_fee == null ? '' : v.travel_fee) + '">') +
      fld('f-travelnote', 'Travel fee note', '<input id="f-travelnote" placeholder="e.g. Tahoe trip" value="' + esc(v.travel_note || '') + '">') +
      fld('f-discount', 'Discount code', '<select id="f-discount"><option value="">No discount</option>' +
        state.discounts.filter(function (d) { return d.active || d.code === v.discount_code; }).map(function (d) {
          return '<option value="' + esc(d.code) + '"' + (v.discount_code === d.code ? ' selected' : '') + '>' + esc(discLabel(d)) + '</option>';
        }).join('') + '</select>') +
      '<div class="adm-field full"><label for="f-notes">Access notes <small style="text-transform:none;letter-spacing:0">(internal — your calendar only)</small></label><textarea id="f-notes" placeholder="Gate codes, staging, access notes…">' + esc(v.notes || '') + '</textarea></div>' +
      '<div class="adm-field full" style="border-top:1px solid var(--line);padding-top:0.9rem;display:flex;justify-content:space-between;align-items:baseline">' +
        '<label style="margin:0">Total</label>' +
        '<div><span id="f-total" style="font-family:var(--rx-mono);font-size:1.25rem;color:var(--ink);font-weight:700">$0</span>' +
        '<small id="f-total-note" class="mut" style="display:block;text-align:right;letter-spacing:0"></small></div></div>' +
      // Sending options — pick from the first three, or the proposal by
      // itself. No Stage select: status sets itself (proposal → Pending;
      // otherwise Upcoming, or straight to Editing for a past date).
      (function () {
        var optConfirm = b.id ? !v.skip_confirmation : true;
        var optPrice = v.show_price !== false;
        var optSilent = !!v.skip_confirmation;
        var chk = function (id, text, on, sub) {
          return '<label style="display:flex;align-items:center;gap:0.5rem;text-transform:none;letter-spacing:0;font-size:0.85rem;color:var(--ink);cursor:pointer' + (sub ? ';margin-left:1.55rem' : '') + '">' +
            '<input type="checkbox" id="' + id + '" style="width:auto"' + (on ? ' checked' : '') + '> ' + text + '</label>';
        };
        return '<div class="adm-field full" style="border-top:1px solid var(--line);padding-top:0.9rem">' +
          '<label>' + (b.id ? 'Confirmation preferences' : 'On create') + '</label>' +
          '<div style="display:grid;gap:0.45rem;margin-top:0.35rem">' +
          chk('f-opt-confirm', 'Send booking confirmation' + (b.id ? '' : ' <small style="color:var(--muted)">(emails the client + calendar invite when you create)</small>'), optConfirm) +
          chk('f-opt-price', 'Include price in confirmation', optPrice, true) +
          chk('f-opt-silent', 'Don&rsquo;t send confirmation <small style="color:var(--muted)">(you still get your copy + calendar on Confirm)</small>', optSilent) +
          (!b.id
            ? chk('f-opt-proposal', 'Send a proposal <small style="color:var(--muted)">(project waits as Pending &mdash; their acceptance signs &amp; books it)</small>', false)
            : '') +
          '</div></div>';
      })(),
      async function () {
        // merge over the existing booking so delivery fields (managed in
        // the delivery editor) survive a project edit
        var body = Object.assign({}, b.id ? b : {}, collectProjectForm(b.id));
        var viaProposal = !b.id && $('f-opt-proposal') && $('f-opt-proposal').checked;
        var sendNow = !b.id && !viaProposal && $('f-opt-confirm').checked;
        if (!b.id && !viaProposal && !$('f-opt-confirm').checked && !$('f-opt-silent').checked) {
          throw Object.assign(new Error('opt'), { userMessage: 'Pick a sending option — confirmation, no confirmation, or a proposal.' });
        }
        if (sendNow && !$('f-date').value) {
          throw Object.assign(new Error('opt'), { userMessage: 'Add a shoot date to send the confirmation on create — or choose "Don\u2019t send confirmation".' });
        }
        var missingInq = [];
        document.querySelectorAll('.f-svc-pr .f-inqprice').forEach(function (inp) {
          var lab = inp.closest('label'); var box = lab && lab.querySelector('.f-addon');
          if (box && box.checked && inp.value === '') missingInq.push(box.value);
        });
        if (!b.id && priceAuto && missingInq.length) {
          throw Object.assign(new Error('inq'), { userMessage: 'Past 6,000 sqft each service takes a custom price. Set: ' + missingInq.join(', ') + '.' });
        }
        if (!b.id) {
          // status sets itself, mirroring the pipeline: proposal gates as
          // Pending; a past shoot date lands straight in Editing.
          var todayLA = new Date().toLocaleDateString('en-CA', { timeZone: 'America/Los_Angeles' });
          body.status = viaProposal ? 'pending'
            : ($('f-date').value && $('f-date').value <= todayLA ? 'editing' : 'upcoming');
        }
        var j = await api('bookings', b.id ? 'PUT' : 'POST', body);
        if (sendNow && j.booking) {
          try {
            var conf = await api('confirm', 'POST', { id: j.booking.id });
            toast(conf.clientSent ? 'Project created — confirmation sent.'
              : 'Project created — no client email on file, so only you received the copy.');
          } catch (e3) {
            toast('Project created, but the confirmation failed to send — use Confirm inside the project.', 'err');
          }
        } else if (!b.id && !viaProposal) {
          toast('Project created — no emails sent.');
        }
        // Proposal-first: draft a linked proposal prefilled from the
        // project (service + price + travel), then land in the editor —
        // review, tweak, Send. The project stays Pending until accepted.
        if (viaProposal && j.booking) {
          var bk = j.booking;
          var cl = state.clients.find(function (c) { return c.id == bk.client_id; }) || {};
          // Each checked service becomes its own priced line (sheet rates
          // at the project's sqft); custom services ride along unpriced.
          var picked = [];
          try { picked = JSON.parse(bk.addons || '[]'); } catch (e2) {}
          var groupOf = function (label) {
            var g = Object.keys(ADDONS).filter(function (k) { return ADDONS[k].indexOf(label) > -1; })[0];
            return g === 'Beyond' ? 'Extras' : (g || 'The Campaign');
          };
          var inqMap = {};
          document.querySelectorAll('.f-svc-pr .f-inqprice').forEach(function (inp) {
            if (inp.value !== '') inqMap[inp.dataset.nm] = Number(inp.value) || 0;
          });
          var items = picked.map(function (nm) {
            var q = svcQuote(nm, bk.sqft);
            var d = svcDesc(nm);
            var priceVal = (q.inquire && inqMap[nm] != null) ? inqMap[nm] : q.price;
            return { group: groupOf(nm), name: nm,
                     desc: d + (q.note ? (d ? ' — ' : '') + q.note : ''),
                     price: priceVal, badge: '' };
          });
          if (!items.length) items = [{ group: 'The Campaign', name: bk.type || 'Photography',
            desc: bk.deliverables || '', price: bk.price == null || bk.price === '' ? '' : Number(bk.price), badge: '' }];
          if (Number(bk.travel_fee)) items.push({ group: 'The Campaign', name: 'Travel',
            desc: bk.travel_note || '', price: Number(bk.travel_fee), badge: '' });
          var pj = await api('proposals', 'POST', {
            title: bk.title, location: bk.location || '',
            client_name: cl.name || '', client_email: cl.email || '',
            items: items, booking_id: bk.id, client_id: bk.client_id || ''
          });
          await reload();
          go('proposal/' + pj.proposal.id);
          toast('Project saved as Pending — review the proposal, then send it.');
          return;
        }
        await reload();
        if (!b.id && j.booking) go('project/' + j.booking.id); else render();
      }, b.id ? 'Save' : 'Create project');

    // addons → deliverables composer
    function checkedList() {
      return Array.prototype.map.call(document.querySelectorAll('.f-addon:checked'), function (x) { return x.value; });
    }
    // With no Service dropdown, the stored type derives from the first
    // checked MAIN service (calendar + emails still read naturally).
    function derivedType() {
      var mains = ((window.JCS_PRICING || {}).services || []).map(function (s) { return s.name; });
      var hit = checkedList().filter(function (l) { return mains.indexOf(l) > -1; })[0];
      return hit || '';
    }
    function regenDeliverables() { $('f-deliverables').value = checkedList().join(' · '); }
    // delegate so custom checkboxes added later also trigger the composer
    $('modal-form').addEventListener('change', function (e) {
      if (e.target.classList && e.target.classList.contains('f-addon')) regenDeliverables();
    });
    function addCustomService() {
      var input = $('f-customsvc');
      var label = input.value.trim().slice(0, 100);
      var price = $('f-customprice').value === '' ? null : Number($('f-customprice').value) || 0;
      if (!label) return;
      var exists = Array.prototype.some.call(document.querySelectorAll('.f-addon'), function (x) {
        return x.value.toLowerCase() === label.toLowerCase();
      });
      if (!exists) {
        var wrap = document.createElement('div');
        wrap.innerHTML = addonLabel(label, true);
        var box = wrap.firstChild.querySelector('input');
        if (price != null) {
          box.setAttribute('data-price', price);

          tag.textContent = '— ' + money(price);
          wrap.firstChild.appendChild(tag);
        }
        $('f-customlist').appendChild(wrap.firstChild);
      }
      input.value = ''; $('f-customprice').value = '';
      regenDeliverables();
      autoPrice();   // declaration is hoisted; joins the quote instantly
    }
    $('f-addcustom').addEventListener('click', addCustomService);
    $('f-customsvc').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); addCustomService(); }
    });
    // inline new client: stash the draft, create the client, come back
    // address autocomplete — Google Places when a key is set in
    // Settings (Google-quality suggestions), Photon/OSM as fallback.
    // Picking a suggestion fills street, city, state, and zip.
    (function () {
      var input = $('f-title'), list = $('f-addr-list'), timer = null, seq = 0;
      var gkey = (state.settings || {}).google_places_key || '';
      var ST = { 'california':'CA','nevada':'NV','oregon':'OR','washington':'WA','arizona':'AZ','utah':'UT',
        'idaho':'ID','colorado':'CO','texas':'TX','florida':'FL','new york':'NY','montana':'MT','wyoming':'WY',
        'hawaii':'HI','new mexico':'NM','georgia':'GA','north carolina':'NC','south carolina':'SC','tennessee':'TN',
        'massachusetts':'MA','new jersey':'NJ','connecticut':'CT','illinois':'IL','michigan':'MI','minnesota':'MN',
        'ohio':'OH','pennsylvania':'PA','virginia':'VA','maryland':'MD' };
      function stateCode(s) { return ST[String(s || '').toLowerCase()] || s || ''; }
      function show(items) {
        list.innerHTML = items.map(function (it, i) {
          return '<div class="adm-cl-item" data-i="' + i + '"><b>' + esc(it.line) + '</b>' +
            (it.sub ? '<small>' + esc(it.sub) + '</small>' : '') + '</div>';
        }).join('');
        list._items = items;
        list.hidden = !items.length;
      }
      async function lookupGoogle(q, mySeq) {
        var r = await fetch('https://places.googleapis.com/v1/places:autocomplete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Goog-Api-Key': gkey },
          body: JSON.stringify({
            input: q,
            includedRegionCodes: ['us'],
            locationBias: { circle: { center: { latitude: 38.5, longitude: -121.5 }, radius: 50000 } }
          })
        });
        if (!r.ok || mySeq !== seq) return false;
        var j = await r.json();
        var items = (j.suggestions || []).map(function (s) {
          var p = s.placePrediction;
          if (!p) return null;
          return {
            line: (p.structuredFormat && p.structuredFormat.mainText && p.structuredFormat.mainText.text) || p.text.text,
            sub: (p.structuredFormat && p.structuredFormat.secondaryText && p.structuredFormat.secondaryText.text) || '',
            placeId: p.placeId
          };
        }).filter(Boolean).slice(0, 6);
        if (mySeq !== seq) return true;
        show(items);
        return true;
      }
      async function lookupPhoton(q, mySeq) {
        var r = await fetch('https://photon.komoot.io/api/?limit=6&lat=38.5&lon=-121.5&q=' + encodeURIComponent(q));
        if (!r.ok || mySeq !== seq) return;
        var j = await r.json();
        var items = (j.features || []).filter(function (f) {
          return f.properties && f.properties.housenumber && f.properties.street;
        }).map(function (f) {
          var p = f.properties;
          return {
            line: (p.housenumber + ' ' + p.street).trim(),
            sub: [p.city || p.district, stateCode(p.state), p.postcode].filter(Boolean).join(', '),
            fill: { city: p.city || p.district || '', state: stateCode(p.state), zip: p.postcode || '' }
          };
        }).slice(0, 6);
        if (mySeq !== seq) return;
        show(items);
      }
      async function lookup(q) {
        var mySeq = ++seq;
        try {
          if (gkey) { if (await lookupGoogle(q, mySeq)) return; }
          await lookupPhoton(q, mySeq);
        } catch (e) { list.hidden = true; }
      }
      async function pick(it) {
        input.value = it.line;
        if (it.fill) {
          if (it.fill.city) $('f-city').value = it.fill.city;
          if (it.fill.state) $('f-state').value = it.fill.state;
          if (it.fill.zip) $('f-zip').value = it.fill.zip;
        } else if (it.placeId && gkey) {
          try {
            var r = await fetch('https://places.googleapis.com/v1/places/' + it.placeId + '?fields=addressComponents', {
              headers: { 'X-Goog-Api-Key': gkey }
            });
            if (r.ok) {
              var j = await r.json();
              var get = function (type, short) {
                var c = (j.addressComponents || []).find(function (x) { return (x.types || []).indexOf(type) > -1; });
                return c ? (short ? c.shortText : c.longText) : '';
              };
              var num = get('street_number'), route = get('route');
              if (num && route) input.value = num + ' ' + route;
              if (get('locality')) $('f-city').value = get('locality');
              if (get('administrative_area_level_1', true)) $('f-state').value = get('administrative_area_level_1', true);
              if (get('postal_code')) $('f-zip').value = get('postal_code');
            }
          } catch (e) { /* keep the typed line */ }
        }
        list.hidden = true;
      }
      input.addEventListener('input', function () {
        clearTimeout(timer);
        var q = input.value.trim();
        if (q.length < 5) { list.hidden = true; return; }
        timer = setTimeout(function () { lookup(q); }, 300);
      });
      input.addEventListener('keydown', function (e) { if (e.key === 'Escape') list.hidden = true; });
      input.addEventListener('blur', function () { setTimeout(function () { list.hidden = true; }, 180); });
      list.addEventListener('mousedown', function (e) {
        var item = e.target.closest('.adm-cl-item'); if (!item) return;
        pick(list._items[item.dataset.i]);
      });
    })();

    // live total: price + travel − discount
    function updateTotal() {
      var price = Number($('f-price').value) || 0;
      var travel = Number($('f-travel').value) || 0;
      var code = $('f-discount').value;
      var disc = 0, note = [];
      if (travel) note.push('incl. ' + money(travel) + ' travel');
      if (code) {
        var d = state.discounts.find(function (x) { return x.code === code; });
        if (d) {
          disc = d.kind === 'percent' ? Math.round(price * Number(d.value)) / 100 : Math.min(Number(d.value), price);
          note.push('\u2212' + money(disc) + ' ' + code);
        }
      }
      $('f-total').textContent = money(price + travel - disc);
      $('f-total-note').textContent = note.join(' \u00b7 ');
    }
    ['f-price', 'f-travel'].forEach(function (id) { $(id).addEventListener('input', updateTotal); });
    $('f-discount').addEventListener('change', updateTotal);
    updateTotal();

    // ---- price auto-generates from the pricing sheet -----------------
    // New projects only, and only until the price is touched by hand:
    // base service at the sqft (Full Campaign = stills + film), plus
    // every flat-priced add-on that matches the sheet. Per-image and
    // custom add-ons never join the sum.
    var priceAuto = !b.id && (v.price == null || v.price === '');
    // Past 6,000 sqft the sheet says Inquire: each tiered service takes
    // its own custom price input, and those add into the auto total.
    function paintProjPrices() {
      var sq = $('f-sqft').value;
      document.querySelectorAll('.f-svc-pr').forEach(function (el) {
        var q = svcQuote(el.dataset.nm, sq);
        if (q.inquire) {
          var prev = el.querySelector('.f-inqprice');
          var val = prev ? prev.value : '';
          el.innerHTML = '&mdash; <input type="number" min="0" step="1" class="f-inqprice" data-nm="' + esc(el.dataset.nm) + '" placeholder="$" value="' + esc(val) + '" style="width:84px;font-family:var(--sans);font-size:0.8rem;color:var(--ink);background:var(--paper-warm);border:1px solid var(--line);padding:0.25rem 0.45rem;outline:none">';
        } else el.innerHTML = '';
      });
    }
    function autoPrice() {
      if (!priceAuto) return;
      var sq = $('f-sqft').value, sum = null;
      checkedList().forEach(function (nm) {
        var q = svcQuote(nm, sq);
        if (typeof q.price === 'number') sum = (sum || 0) + q.price;
      });
      document.querySelectorAll('.f-addon:checked[data-price]').forEach(function (x) {
        sum = (sum || 0) + (Number(x.dataset.price) || 0);
      });
      document.querySelectorAll('.f-svc-pr .f-inqprice').forEach(function (inp) {
        var lab = inp.closest('label'); var box = lab && lab.querySelector('.f-addon');
        if (box && box.checked && inp.value !== '') sum = (sum || 0) + (Number(inp.value) || 0);
      });
      $('f-price').value = sum == null ? '' : sum;
      updateTotal();
    }
    // Sending options keep each other honest: price implies confirm;
    // silent and proposal clear the others; at least one stays checked
    // at save (validated in the handler).
    (function () {
      var c = $('f-opt-confirm'), p = $('f-opt-price'), sl = $('f-opt-silent'), pr = $('f-opt-proposal');
      function un(x) { if (x) x.checked = false; }
      if (c) c.addEventListener('change', function () { if (c.checked) { un(sl); un(pr); } else un(p); });
      if (p) p.addEventListener('change', function () { if (p.checked) { c.checked = true; un(sl); un(pr); } });
      if (sl) sl.addEventListener('change', function () { if (sl.checked) { un(c); un(p); un(pr); } });
      if (pr) pr.addEventListener('change', function () { if (pr.checked) { un(c); un(p); un(sl); } });
    })();

    $('f-price').addEventListener('input', function () { priceAuto = false; });
    $('f-sqft').addEventListener('input', function () { paintProjPrices(); autoPrice(); });
    $('modal-form').addEventListener('change', function (e) {

  function vDash() {
    var now = new Date();
    var startToday = new Date(now.toDateString());
    var weekEnd = new Date(startToday.getTime() + 7 * 864e5);
    var active = state.bookings.filter(function (b) { return b.status !== 'canceled'; });
    var monthSum = active.filter(function (b) {
      if (!b.shoot_date) return false; var d = new Date(b.shoot_date);
      return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
    }).reduce(function (s, b) { return s + net(b); }, 0);
    var yearSum = active.filter(function (b) {
      return b.shoot_date && new Date(b.shoot_date).getFullYear() === now.getFullYear();
    }).reduce(function (s, b) { return s + net(b); }, 0);
    var unpaid = active.filter(function (b) { return b.status !== 'paid'; })
      .reduce(function (s, b) { return s + net(b); }, 0);

    var week = state.bookings.filter(function (b) {
      if (b.status !== 'upcoming' || !b.shoot_date) return false;
      var d = new Date(b.shoot_date); return d >= startToday && d < weekEnd;
    }).sort(function (a, b) { return new Date(a.shoot_date) - new Date(b.shoot_date); });

    var activity = []
      .concat(state.bookings.map(function (b) { return { at: b.created_at, html: 'Project — ' + esc(b.title) + (b.price ? ' · ' + money(b.price) : ''), r: 'project/' + b.id }; }))
      .concat(state.clients.map(function (c) { return { at: c.created_at, html: 'Client — ' + esc(c.name), r: 'client/' + c.id }; }))
      .sort(function (a, b) { return new Date(b.at) - new Date(a.at); }).slice(0, 8);

    var pendingReq = state.requests.filter(function (x) { return x.status === 'pending'; }).length;

        '<button class="' + (state.view === 'pipeline' ? 'on' : '') + '" onclick="ADM.view(\'pipeline\')">Pipeline</button>' +

        }).join('') + '</select></div>';

      }).join('') + '</div>';
    } else {
      var prow = function (b, next) {
        var paid = b.status === 'paid';
        var total = b.price ? net(b) + (Number(b.travel_fee) || 0) : null;
        return '<div class="adm-prow" draggable="true" data-id="' + b.id + '" onclick="ADM.go(\'project/' + b.id + '\')">' +
          '<div class="adm-prow__t"><b>' + esc(b.title) + '</b>' + (b.location ? '<small>' + esc(b.location) + '</small>' : '') + '</div>' +
          '<div class="adm-prow__c">' + esc(b.client_name || '—') + '</div>' +
          '<div class="adm-prow__d">' + dstr(b.shoot_date) + '</div>' +
          '<span class="adm-badge adm-badge--' + (paid ? 'paid">Paid' : 'unpaid">Unpaid') + '</span>' +
          '<div class="adm-prow__p">' + (total == null ? '—' : money(total)) + '</div>' +
          (next ? '<button class="adv" title="Move to ' + STAGE_LABEL[next] + '" onclick="event.stopPropagation();ADM.stage(' + b.id + ',\'' + next + '\')">&rsaquo;</button>' : '<span></span>') +
        '</div>';
      };
      body = '<div id="pipe">' + STAGES.map(function (stage) {
        var list = items.filter(function (b) { return b.status === stage; })
          .sort(function (x, y) { return new Date(y.shoot_date || 0) - new Date(x.shoot_date || 0); });
        var sum = list.reduce(function (s, b) { return s + net(b); }, 0);
        var next = STAGES[STAGES.indexOf(stage) + 1];
        var closed = state.collapsed[stage] ? ' closed' : '';
        return '<div class="adm-stage' + closed + '" data-stage="' + stage + '" style="border-left-color:' + STAGE_COLOR[stage] + '">' +
          '<div class="adm-stage__head" onclick="ADM.fold(\'' + stage + '\')">' +
            '<span class="chev">&#9662;</span><b style="color:' + STAGE_COLOR[stage] + '">' + STAGE_LABEL[stage] + '</b>' +
            '<span class="n">' + list.length + ' item' + (list.length === 1 ? '' : 's') + '</span>' +
            (sum ? '<span class="s">' + money(sum) + '</span>' : '<span class="s"></span>') +

            (list.length ? list.map(function (b) { return prow(b, next); }).join('')

          '</div></div>';
      }).join('') + '</div>';

    // Proposal-gated projects sit above the pipeline until accepted.
    var gated = items.filter(function (b) { return b.status === 'pending'; });
    var pendingStrip = gated.length
      ? '<div class="adm-card" style="margin-bottom:1.1rem">' +
        '<div style="font-size:0.62rem;letter-spacing:0.18em;text-transform:uppercase;font-weight:600;color:var(--muted);margin-bottom:0.35rem">Pending proposal &mdash; awaiting client acceptance</div>' +
        gated.map(function (b) {
          var p = state.proposals.find(function (x) { return x.booking_id == b.id; });
          return '<div style="display:flex;align-items:baseline;gap:0.9rem;flex-wrap:wrap;padding:0.6rem 0;border-bottom:1px solid var(--line-soft)">' +
            '<b style="cursor:pointer;font-weight:700;letter-spacing:-0.01em;color:var(--ink)" onclick="ADM.go(\'project/' + b.id + '\')">' + esc(b.title) + '</b>' +
            '<small class="mut">' + esc(b.client_name || '') + '</small>' +
            (p ? (p.status === 'sent'
                    ? '<span class="adm-badge adm-badge--pending">Sent ' + dstr(p.sent_at) + (p.sends > 1 ? ' · ×' + p.sends : '') + '</span>'
                    : '<span class="adm-badge adm-badge--draft">Draft &mdash; not sent yet</span>')
                : '<span class="adm-badge adm-badge--draft">No proposal linked</span>') +
            '<span style="flex:1"></span>' +
            (p ? '<button class="adm-btn adm-btn--ghost" onclick="ADM.go(\'proposal/' + p.id + '\')">Open proposal</button>' : '') +
          '</div>';

      : '';

    var canceled = state.bookings.filter(function (b) { return b.status === 'canceled'; }).length;
    return head('Projects', '<button class="adm-btn" onclick="ADM.newBooking()">+ New project</button>') +
      toolbar + pendingStrip + body +
      (canceled ? '<p class="adm-empty">' + canceled + ' canceled project' + (canceled > 1 ? 's' : '') + ' hidden — find them via client pages.</p>' : '') +
      '<p class="adm-empty">Drag a card between stages, or use the &rsaquo; button to advance it.</p>';
  }

  function wirePipeline() {
    var pipe = $('pipe'); if (!pipe) return;
    var draggedId = null;
    var zone = function (el) { return el.closest ? el.closest('[data-stage]') : null; };
    pipe.addEventListener('dragstart', function (e) {
      var card = e.target.closest('.adm-cardlet, .adm-prow'); if (!card) return;
      draggedId = card.dataset.id; card.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    pipe.addEventListener('dragend', function (e) {
      var card = e.target.closest('.adm-cardlet, .adm-prow'); if (card) card.classList.remove('dragging');
      pipe.querySelectorAll('[data-stage]').forEach(function (c) { c.classList.remove('dragover'); });
    });
    pipe.addEventListener('dragover', function (e) {
      var col = zone(e.target); if (!col) return;
      e.preventDefault();
      pipe.querySelectorAll('[data-stage]').forEach(function (c) { c.classList.toggle('dragover', c === col); });
    });
    pipe.addEventListener('drop', function (e) {
      var col = zone(e.target); if (!col || !draggedId) return;
      e.preventDefault();
      ADM.stage(draggedId, col.dataset.stage);
      draggedId = null;
    });
  }

  function vDeliveries() {
    var delivered = state.bookings.filter(function (b) {
      return b.delivery_created_at || ['delivered', 'completed', 'paid'].indexOf(b.status) > -1 || dvLinks(b).length;
    }).sort(function (a, b) {
      // newest "Create delivery" first (legacy items fall back to sent time)
      return new Date(b.delivery_created_at || b.delivery_sent_at || 0) -
             new Date(a.delivery_created_at || a.delivery_sent_at || 0);
    });
    return head('Deliveries') +
      (delivered.length
        ? '<div class="adm-delgrid">' + delivered.map(function (b) {
            var n = dvLinks(b).length;
            var isDraft = !!(b.delivery_created_at || n) && !b.delivery_sent_at;
            var sent = b.delivery_sent_at
              ? 'Sent ' + dstr(b.delivery_sent_at) + (b.delivery_sends > 1 ? ' · ' + b.delivery_sends + '&times;' : '')
              : '';
            var badge = b.delivery_approved_at
              ? '<span class="adm-badge adm-badge--paid">Approved</span>'
              : (b.delivery_feedback && b.delivery_sent_at
                  ? '<span class="adm-badge adm-badge--unpaid">Changes requested</span>'

                    ? '<span class="adm-badge adm-badge--delivered">Sent</span>'
                    : (isDraft ? '<span class="adm-badge adm-badge--draft">Draft</span>' : ''));
            // cover: unfurled from the gallery link, else a matching
            // portfolio cover, else the navy monogram
            var cover = (b.delivery_cover_url && b.delivery_cover_url !== '-') ? b.delivery_cover_url : '';

              var pf = (window.PROJECTS_DATA || []).find(function (p) {
                return p.title.toLowerCase() === String(b.title).toLowerCase() && p.cover_url;

            return '<div class="adm-del">' +

              (sent ? '<br>' + sent : (b.delivered_at ? '<br>Delivered ' + dstr(b.delivered_at) : '')) +
              (n ? ' · ' + n + ' link' + (n > 1 ? 's' : '') : '') + '</small>' +
              ((b.delivery_created_at || n)
                ? '<a class="lnk" style="cursor:pointer" onclick="ADM.delEdit(' + b.id + ')">Open delivery &rarr;</a>' +
                  (b.delivery_token
                    ? ' &nbsp;<a class="lnk" href="/delivery?t=' + esc(b.delivery_token) + '" target="_blank" rel="noopener">Preview &rarr;</a>'
                    : '')
                : '<a class="lnk" style="cursor:pointer" onclick="ADM.delEdit(' + b.id + ')">Create delivery &rarr;</a>') +
              '</div>' +
            '</div>';
          }).join('') + '</div>'
        : '<div class="adm-card"><p class="adm-empty">Nothing here yet — hit Create delivery on a project to start a draft.</p></div>');
  }

  // ---- portfolio editor ------------------------------------------------
  function spBlank() {
    return { id: null, slug: '', title: '', location: '', year: String(new Date().getFullYear()),
      headline: '', summary: '', shot_for: '', brokerage: '', price: '',
      cover_url: '', gallery: [], horizontal_url: '', vertical_url: '', draft: true, sort_order: 0,
      slugTouched: false, busy: '' };
  }
  function spInit(idPart) {
    if (state.sp && String(state.sp.id || 'new') === String(idPart)) return state.sp;
    if (idPart === 'new') { state.sp = spBlank(); return state.sp; }
    var row = (state.siteProjects || []).find(function (x) { return String(x.id) === String(idPart); });
    if (!row) return null;
    var g = []; try { g = JSON.parse(row.gallery || '[]'); } catch (e) {}
    state.sp = { id: row.id, slug: row.slug, title: row.title, location: row.location || '',
      year: row.year || '', headline: row.headline || '', summary: row.summary || '',
      shot_for: row.shot_for || '', brokerage: row.brokerage || '', price: row.price || '',
      cover_url: row.cover_url || '', gallery: g, horizontal_url: row.horizontal_url || '',
      vertical_url: row.vertical_url || '', draft: !!row.draft, sort_order: row.sort_order || 0,
      slugTouched: true, busy: '' };
    return state.sp;
  }

    }).join('');
    return head(p.id ? 'Edit project' : 'New project', '', true) +
      '<form class="adm-card" onsubmit="ADM.spSave(event)" style="max-width:860px">' +
        '<div class="adm-form">' +
