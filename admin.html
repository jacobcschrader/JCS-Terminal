        fld('sp-slug', 'URL slug <small style="text-transform:none;letter-spacing:0">(jacobcschrader.com/project?slug=&hellip;)</small>', '<input id="sp-slug" value="' + esc(p.slug) + '" oninput="state.sp.slugTouched=true;state.sp.slug=this.value">') +
        fld('sp-location', 'Location', '<input id="sp-location" placeholder="Truckee, CA" value="' + esc(p.location) + '">') +
        fld('sp-year', 'Year', '<input id="sp-year" value="' + esc(p.year) + '">') +
        fld('sp-price', 'Price', '<input id="sp-price" placeholder="$6,995,000" value="' + esc(p.price) + '">') +
        fld('sp-headline', 'Headline', '<input id="sp-headline" placeholder="Martis Camp Estate" value="' + esc(p.headline) + '">') +
        fld('sp-shotfor', 'Shot for', '<input id="sp-shotfor" placeholder="Eric Navarro" value="' + esc(p.shot_for) + '">') +
        fld('sp-brokerage', 'Brokerage', '<input id="sp-brokerage" placeholder="Compass" value="' + esc(p.brokerage) + '">') +
        '<div class="adm-field full"><label for="sp-summary">Description <small style="text-transform:none;letter-spacing:0">(optional)</small></label><textarea id="sp-summary">' + esc(p.summary) + '</textarea></div>' +
        '</div>' +

        '<h2 style="margin-top:1.6rem">Cover &amp; films</h2>' +
        '<div class="sp-tiles">' +
          spTile('cover', p.cover_url, 'Cover photo', false) +
          spTile('horizontal', p.horizontal_url, 'Horizontal film', true) +
          spTile('vertical', p.vertical_url, 'Vertical reel', true) +
        '</div>' +

        '<h2 style="margin-top:1.6rem">Gallery <small class="mut" style="font-weight:400;text-transform:none;letter-spacing:0">(' + p.gallery.length + ' photos — order shown is the order on the site)</small></h2>' +
        '<div class="sp-thumbs">' + thumbs +
          '<label class="sp-thumb sp-thumb--add"><input type="file" accept="image/*" multiple hidden onchange="ADM.spUpload(\'gallery\', this)"><span>+ Add photos</span></label>' +
        '</div>' +
        (p.busy ? '<div class="sp-progress">' + esc(p.busy) + '</div>' : '') +

        '<div style="display:flex;align-items:center;gap:1.4rem;flex-wrap:wrap;margin-top:1.8rem;border-top:1px solid var(--line);padding-top:1.4rem">' +
          '<label style="display:flex;align-items:center;gap:0.5rem;font-size:0.85rem;cursor:pointer"><input type="checkbox" id="sp-live" style="width:auto"' + (p.draft ? '' : ' checked') + '> Published <small class="mut">(visible on the website)</small></label>' +
          '<span class="grow"></span>' +
          (p.id ? '<button type="button" class="adm-btn adm-btn--ghost" onclick="ADM.spDelete()" style="color:#8a2f2f">Delete</button>' : '') +
          '<button class="adm-btn" type="submit">' + (p.id ? 'Save changes' : 'Create project') + '</button>' +
        '</div>' +
      '</form>';
  }

  // ================= proposals =================
  function propTotal(p) {
    var t = 0;
    try { JSON.parse(p.items || '[]').forEach(function (it) { if (typeof it.price === 'number') t += it.price; }); } catch (e) {}
    return t;
  }
  function propUrl(p) { return 'https://proposal.jacobcschrader.com/' + p.slug; }
  function propBadge(p) {
    if (p.accepted_at) return '<span class="adm-badge adm-badge--paid">Accepted</span>';
    if (p.sent_at) return '<span class="adm-badge adm-badge--accepted">Sent</span>';
    return '<span class="adm-badge adm-badge--pending">Draft</span>';
  }

  function vProposals() {
    var list = state.proposals;
    return head('Proposals', '<button class="adm-btn" onclick="ADM.propNew()">+ New proposal</button>') +
      '<div class="adm-card">' + (list.length
        ? list.map(function (p) {
            var t = propTotal(p);
            return '<div style="padding:1.05rem 0;border-bottom:1px solid var(--line-soft);display:flex;gap:0.9rem;align-items:baseline;flex-wrap:wrap;cursor:pointer" onclick="ADM.go(\'proposal/' + p.id + '\')">' +
              '<b style="font-weight:700;letter-spacing:-0.01em;font-size:0.98rem;color:var(--ink)">' + esc(p.title) + '</b>' +
              (p.client_name ? '<small class="mut">' + esc(p.client_name) + '</small>' : '') +
              propBadge(p) +
              '<span style="flex:1"></span>' +
              (t ? '<span style="font-family:var(--rx-mono);font-weight:700;font-size:0.9rem;color:var(--ink)">' + money(t) + '</span>' : '') +
              '<small class="mut">' + dstr(p.created_at) + '</small></div>';
          }).join('')
        : '<p class="adm-empty">No proposals yet. Create one, add the scope, then send your client their private link — proposal.jacobcschrader.com/&lt;property&gt;.</p>') +
      '</div>';
  }

  function propItemRow(it, i) {
    it = it || {};
    return '<div class="adm-prop-item" data-i="' + i + '">' +
      '<input class="pi-group" placeholder="Group" value="' + esc(it.group || '') + '">' +
      '<span><input class="pi-name" placeholder="Line item — e.g. Photography" value="' + esc(it.name || '') + '">' +
      '<input class="pi-desc" placeholder="One-line description (optional)" value="' + esc(it.desc || '') + '">' +
      '<input class="pi-badge" placeholder="Badge (optional — e.g. Includes drone)" value="' + esc(it.badge || '') + '"></span>' +
      '<input class="pi-price" type="number" min="0" step="50" placeholder="Included" oninput="ADM.propLiveTotal()" value="' + (it.price === '' || it.price == null ? '' : esc(it.price)) + '">' +
      '<span class="pi-acts">' +
        '<button type="button" class="adm-btn adm-btn--ghost" title="Move up" onclick="ADM.propItemMove(' + i + ',-1)">&uarr;</button>' +
        '<button type="button" class="adm-btn adm-btn--ghost" title="Move down" onclick="ADM.propItemMove(' + i + ',1)">&darr;</button>' +
        '<button type="button" class="adm-btn--danger adm-btn" title="Remove" onclick="ADM.propItemDel(' + i + ')">&times;</button>' +
      '</span></div>';
  }

  function vProposalEdit(id) {
    var p = state.proposals.find(function (x) { return x.id == id; });
    if (!p) return head('Proposal', '', true) + '<p class="adm-empty">Proposal not found.</p>';
    var items = [];
    try { items = JSON.parse(p.items || '[]'); } catch (e) {}
    state.propItems = items;   // working copy for the row editor
    var t = propTotal(p);
    return head(p.title, propBadge(p) +
        '<button class="adm-btn adm-btn--ghost" onclick="ADM.propPreview(' + p.id + ')">Preview</button>' +
        '<button class="adm-btn adm-btn--ghost" onclick="ADM.propCopy(' + p.id + ')">Copy link</button>' +
        '<button class="adm-btn" onclick="ADM.propSend(' + p.id + ')">' + (p.sent_at ? 'Resend' : 'Send to client') + '</button>', true) +
      (p.booking_id
        ? '<p class="mut" style="font-size:0.82rem;margin:0 0 0.9rem">Linked to a <b>Pending</b> project &mdash; the client&rsquo;s acceptance signs it and moves it to Upcoming. ' +
          '<a style="cursor:pointer;color:var(--rx-teal);text-decoration:underline;text-underline-offset:3px" onclick="ADM.go(\'project/' + p.booking_id + '\')">Open project</a></p>'
        : '') +
      (p.signed_at
        ? '<p class="mut" style="font-size:0.82rem;margin:0 0 0.9rem">&#10003; Signed by <b>' + esc(p.signature || p.accepted_by || '') + '</b> on ' + dstr(p.signed_at) +
          (function () { try { var a = JSON.parse(p.acceptance || '{}');
            return (a.phone ? ' &middot; ' + esc(a.phone) : '') + (a.access ? ' &middot; Access: ' + esc(a.access) : '') + (a.notes ? ' &middot; &ldquo;' + esc(a.notes) + '&rdquo;' : '');
          } catch (e) { return ''; } })() + '</p>'
        : '') +
      '<div class="adm-card"><h2>The property</h2><div class="adm-form">' +
        fld('pp-title', 'Property / title *', '<input id="pp-title" required value="' + esc(p.title) + '">') +
        fld('pp-location', 'Location <small style="text-transform:none;letter-spacing:0">(e.g. Danville, California)</small>', '<input id="pp-location" value="' + esc(p.location || '') + '">') +
        fld('pp-slug', 'Link slug <small style="text-transform:none;letter-spacing:0">(proposal.jacobcschrader.com/&hellip;)</small>', '<input id="pp-slug" value="' + esc(p.slug) + '">') +
        fld('pp-client', 'Prepared for', '<input id="pp-client" placeholder="Marie Morgenstern" value="' + esc(p.client_name || '') + '">') +
        fld('pp-email', 'Client email', '<input id="pp-email" type="email" placeholder="client@brokerage.com" value="' + esc(p.client_email || '') + '">') +
        '<div class="adm-field full"><label for="pp-intro">Intro line <small style="text-transform:none;letter-spacing:0">(under &ldquo;Scope &amp; Investment&rdquo; — optional)</small></label>' +
          '<input id="pp-intro" placeholder="A full marketing suite that ensures maximum exposure." value="' + esc(p.intro || '') + '"></div>' +
      '</div></div>' +
      '<div class="adm-card" style="margin-top:1.2rem"><h2>Scope &amp; investment</h2>' +
        '<p class="mut" style="font-size:0.8rem;margin:0.2rem 0 0.8rem">Group labels (Photography, Film&hellip;) render as section headings. Leave the price blank to show &ldquo;Included&rdquo;.</p>' +
        '<div id="pp-items">' + state.propItems.map(propItemRow).join('') + '</div>' +
        '<div style="display:flex;gap:0.8rem;align-items:center;margin-top:0.9rem">' +
          '<button type="button" class="adm-btn adm-btn--ghost" onclick="ADM.propItemAdd()">+ Add line item</button>' +
          '<span style="flex:1"></span>' +
          '<span style="font-size:0.72rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted)">Campaign total</span>' +
          '<b id="pp-total" style="font-family:var(--rx-mono);font-weight:700;font-size:1.05rem;color:var(--ink)">' + money(t) + '</b>' +
        '</div>' +
        '<div class="adm-field full" style="margin-top:1rem"><label for="pp-note">Note under the total <small style="text-transform:none;letter-spacing:0">(optional)</small></label>' +
          '<input id="pp-note" placeholder="A full marketing suite that ensures maximum exposure." value="' + esc(p.note || '') + '"></div>' +
        '<div style="margin-top:1.3rem;display:flex;gap:0.8rem;flex-wrap:wrap">' +
          '<button class="adm-btn" onclick="ADM.propSave(' + p.id + ')">Save proposal</button>' +
          '<button class="adm-btn--danger adm-btn" onclick="ADM.propDelete(' + p.id + ')">Delete</button>' +
        '</div>' +
        (p.sent_at ? '<p class="mut" style="font-size:0.78rem;margin-top:0.9rem">Sent ' + dstr(p.sent_at) + (p.sends > 1 ? ' · ' + p.sends + '×' : '') + (p.accepted_at ? ' · accepted ' + dstr(p.accepted_at) + (p.accepted_by ? ' by ' + esc(p.accepted_by) : '') : '') + '</p>' : '') +
      '</div>';
  }

  // ================= licensing =================
  var LIC_ROLES = { architect:'Architect', builder:'Builder', developer:'Developer', interior:'Interior Design',
                    landscape:'Landscape', pool:'Pool & Outdoor', brokerage:'Brokerage', other:'Other' };
  // The license pipeline: prospect → preview sent (watermarked gallery)
  // → accepted (they said yes) → licensed (final gallery + invoice +
  // terms sent) → paid. Declined parks a lead.
  var LIC_STATUS = { prospect:'Prospect', preview_sent:'Preview sent', accepted:'Said yes',
                     licensed:'Licensed', paid:'Paid', declined:'Declined' };
  var LIC_TABS = {
    active:   { label: 'Active licenses', set: ['accepted','licensed','paid'] },
    pipeline: { label: 'Outreach',        set: ['prospect','preview_sent'] },
    all:      { label: 'All',             set: null },
    declined: { label: 'Declined',        set: ['declined'] }
  };

  function licDue(l) {
    if (!l.follow_up || ['licensed','paid','declined'].indexOf(l.status) > -1) return false;
    return new Date(l.follow_up) <= new Date(new Date().toDateString());
  }
  // Suggested license fee from the JCS rate card (tunable defaults —
  // film base reflects the 2026-07-29 film pricing).
  function licSuggest(role, media, print, ads, size) {
    var base = media === 'film' ? 600 : 350;
    var mult = { developer:1.6, builder:1.4, architect:1.2, interior:1.0, brokerage:1.0, landscape:0.8, pool:0.8, other:1.0 }[role] || 1;
    var v = base * mult * (print ? 1.3 : 1) * (ads ? 1.5 : 1) * (size === 'small' ? 0.8 : size === 'full' ? 1.25 : 1);
    var round = function (n) { return Math.round(n / 25) * 25; };
    return { low: round(v * 0.75), rec: round(v), high: round(v * 1.25) };
  }

  function vLicensing() {
    var leads = state.licenseLeads;
    var props = []; leads.forEach(function (l) { if (props.indexOf(l.property) === -1) props.push(l.property); });

    var activeCount = leads.filter(function (l) { return ['accepted','licensed','paid'].indexOf(l.status) > -1; }).length;
    var collected = leads.filter(function (l) { return l.status === 'paid'; })
      .reduce(function (t, l) { return t + (Number(l.fee) || 0); }, 0);
    var outstanding = leads.filter(function (l) { return l.status === 'licensed'; })
      .reduce(function (t, l) { return t + (Number(l.fee) || 0); }, 0);
    var awaiting = leads.filter(function (l) { return l.status === 'preview_sent'; }).length;
    var dueCount = leads.filter(licDue).length;

    var list = leads.filter(function (l) {
      if (state.licProp && l.property !== state.licProp) return false;
      if (state.licTab === 'due') return licDue(l);
      var t = LIC_TABS[state.licTab] || LIC_TABS.all;
      return !t.set || t.set.indexOf(l.status) > -1;
    });

    var tabs = Object.keys(LIC_TABS).concat(['due']);
    var seg = '<div class="lx-tabs">' + tabs.map(function (t) {
      var label = t === 'due' ? 'Follow-ups' + (dueCount ? ' · ' + dueCount : '') : LIC_TABS[t].label;
      return '<button class="lx-tab' + (state.licTab === t ? ' on' : '') + '" onclick="ADM.licTab(\'' + t + '\')">' + label + '</button>';
    }).join('') + '</div>';

    var datalist = '<datalist id="lic-props">' + state.bookings.map(function (b) {
      return '<option value="' + esc(b.title) + '">' + esc(b.location || '') + '</option>';
    }).join('') + '</datalist>';
    var roleOpts = Object.keys(LIC_ROLES).map(function (r) {
      return '<option value="' + r + '">' + LIC_ROLES[r] + '</option>';
    }).join('');

    var results = '';
    if (state.licSearching) {
      results = '<div class="lx-note" style="margin-top:0.9rem">Running research<span class="lx-cursor"></span></div>';
    } else if (state.licResults) {
      if (state.licResults.needsKey) {
        results = '<div class="lx-note" style="margin-top:0.9rem">NO SEARCH KEY — grab a free key at <a href="https://serper.dev" target="_blank" rel="noopener">SERPER.DEV</a> ' +
          '(2,500 searches, no card) and paste it in <a href="#settings">SETTINGS</a>. Quick links meanwhile: ' +
          Object.keys(LIC_ROLES).slice(0, 7).map(function (r) {
            return '<a href="https://www.google.com/search?q=' + encodeURIComponent('"' + (state.licQ || '') + '" ' + LIC_ROLES[r]) + '" target="_blank" rel="noopener">' + LIC_ROLES[r] + ' &nearr;</a>';
          }).join(' &nbsp;·&nbsp; ') + '</div>';
      } else if (state.licResults.searchError) {
        results = '<div class="lx-note" style="margin-top:0.9rem">SEARCH FAILED — ' + esc(state.licResults.searchError) + '</div>';
      } else if (!state.licResults.results.length) {
        results = '<div class="lx-note" style="margin-top:0.9rem">0 RESULTS for ' + esc(state.licResults.q || '') + ' — try another role or a broader address.</div>';
      } else {
        results = '<div style="margin-top:0.6rem">' +
          '<div class="lx-marker" style="margin:0.7rem 0 0.2rem"><span class="dot"></span>OUTPUT: ' + state.licResults.results.length + ' PARTIES<span class="dim">// CLICK + LEAD TO TRACK</span></div>' +
          state.licResults.results.map(function (r, i) {
            return '<div class="lx-result">' +
              '<div class="lx-result__t">' +
                '<a class="title" href="' + esc(r.link) + '" target="_blank" rel="noopener">' + esc(r.title) + '</a>' +
                '<span class="lx-domain">' + esc(r.domain) + '</span>' +
                '<span style="flex:1"></span>' +
                '<button class="lx-btn lx-btn--teal lx-btn--sm" onclick="ADM.licAddFromResult(' + i + ')">+ Lead</button>' +
              '</div>' +
              '<div class="lx-snippet">' + esc(r.snippet) + '</div>' +
            '</div>';
          }).join('') + '</div>';
      }
    }

    // A lead row: company + stage chips, the stage timeline, gallery
    // link state, and only the actions that make sense at its stage.
    var rows = list.map(function (l) {
      var due = licDue(l);
      var timeline = [];
      if (l.emailed_at && l.status !== 'prospect') timeline.push('preview ' + dstr(l.emailed_at) + (l.sends > 1 ? ' ×' + l.sends : ''));
      if (l.accepted_at) timeline.push('yes ' + dstr(l.accepted_at));
      if (l.licensed_at) timeline.push('licensed ' + dstr(l.licensed_at));
      if (l.paid_at) timeline.push('paid ' + dstr(l.paid_at));
      if (l.follow_up && !l.paid_at) timeline.push('follow up ' + dstr(l.follow_up));

      var galleries =
        (l.preview_url ? '<a href="' + esc(l.preview_url) + '" target="_blank" rel="noopener">preview &nearr;</a>' : '<i>no preview link</i>') +
        ' · ' +
        (l.final_url ? '<a href="' + esc(l.final_url) + '" target="_blank" rel="noopener">final &nearr;</a>' : '<i>no final link</i>');

      var acts = '';
      if (l.status === 'prospect') {
        acts = '<button class="lx-btn lx-btn--sm" onclick="ADM.licDraft(' + l.id + ',\'preview\')">Send preview</button>';
      } else if (l.status === 'preview_sent') {
        acts = '<button class="lx-btn lx-btn--teal lx-btn--sm" onclick="ADM.licMark(' + l.id + ',\'accepted\')">They said yes</button>' +
               '<button class="lx-btn lx-btn--ghost lx-btn--sm" onclick="ADM.licDraft(' + l.id + ',\'preview\')">Resend preview</button>';
      } else if (l.status === 'accepted') {
        acts = '<button class="lx-btn lx-btn--sm" onclick="ADM.licDraft(' + l.id + ',\'license\')">Send license + invoice</button>';
      } else if (l.status === 'licensed') {
        acts = '<button class="lx-btn lx-btn--teal lx-btn--sm" onclick="ADM.licMark(' + l.id + ',\'paid\')">Mark paid</button>' +
               '<button class="lx-btn lx-btn--ghost lx-btn--sm" onclick="ADM.licDraft(' + l.id + ',\'license\')">Resend license</button>';
      }
      acts += '<button class="lx-btn lx-btn--ghost lx-btn--sm" onclick="ADM.licEdit(' + l.id + ')">Edit</button>';
      if (['paid','declined'].indexOf(l.status) === -1) {
        acts += '<button class="lx-btn lx-btn--ghost lx-btn--sm" onclick="ADM.licMark(' + l.id + ',\'declined\')">Decline</button>';
      }
      acts += '<button class="lx-btn lx-btn--danger lx-btn--sm" onclick="ADM.licDelete(' + l.id + ')">Delete</button>';

      return '<div class="lx-row">' +
        '<div class="lx-row__top">' +
          '<span class="lx-row__co">' + esc(l.company) + '</span>' +
          '<span class="lx-chip lx-chip--role">' + (LIC_ROLES[l.role] || 'Other') + '</span>' +
          '<span class="lx-chip lx-chip--' + esc(l.status) + '"><span class="d"></span>' + (LIC_STATUS[l.status] || l.status) + '</span>' +
          (due ? '<span class="lx-chip lx-chip--due"><span class="d"></span>Follow up</span>' : '') +
          '<span style="flex:1"></span>' +
          (l.fee ? '<span class="lx-fee' + (l.status === 'paid' ? ' lx-fee--paid' : '') + '">' + money(l.fee) + '</span>' : '') +
        '</div>' +
        '<div class="lx-row__meta">' + esc(l.property) + (l.location ? ' · ' + esc(l.location) : '') + '</div>' +
        '<div class="lx-row__meta" style="margin-top:0.1rem">' +
          (l.contact_name ? esc(l.contact_name) + ' · ' : '') + (l.email ? esc(l.email) : '<i>no email yet</i>') +
          ' · ' + galleries +
          (timeline.length ? ' · ' + timeline.join(' · ') : '') +
        '</div>' +
        (l.notes ? '<div class="adm-notes" style="margin-top:0.5rem">' + esc(l.notes) + '</div>' : '') +
        '<div class="lx-row__acts">' + acts + '</div></div>';
    }).join('');

    var emptyCopy = state.licTab === 'active'
      ? 'NO ACTIVE LICENSES YET — run research below, send watermarked previews, and yeses land here.'
      : state.licTab === 'pipeline'
      ? 'NO OUTREACH IN FLIGHT — research a property and send the watermarked preview.'
      : 'NOTHING FOR THIS FILTER.';

    return '<div class="lx-marker" style="margin-top:0.3rem"><span class="dot"></span>(JCS &mdash; 01)<span class="dim">// LICENSE TRACKER</span></div>' +
      '<div style="display:flex;align-items:flex-end;gap:1rem;flex-wrap:wrap">' +
        '<div><h1 class="lx-h1">License <span class="t">everything.</span></h1>' +
        '<div class="lx-sub">Watermarked preview &rarr; yes &rarr; license, invoice &amp; final gallery<span class="lx-cursor"></span></div></div>' +
        '<span style="flex:1"></span>' +
        '<button class="lx-btn" onclick="ADM.licNew()">+ Add lead</button>' +
      '</div>' +
      '<div class="lx-ledger">' +
        '<div class="cell teal"><b>' + activeCount + '</b><span>Active licenses</span></div>' +
        '<div class="cell"><b>' + money(collected) + '</b><span>Collected</span></div>' +
        '<div class="cell"><b>' + money(outstanding) + '</b><span>Invoiced, unpaid</span></div>' +
        '<div class="cell"><b>' + awaiting + '</b><span>Awaiting reply</span></div>' +
        '<div class="cell' + (dueCount ? ' click" onclick="ADM.licTab(\'due\')"' : '"') + '><b>' + dueCount + '</b><span>Follow-ups due</span></div>' +
      '</div>' +
      '<div class="lx-card">' +

      '<div class="adm-phead"><div>' +
        '<h1>' + esc(b.title) + '</h1>' +
        '<div class="sub"><span class="adm-badge adm-badge--' + esc(b.status) + '">' + esc(b.status) + '</span>&ensp;' +
          esc(fullLoc || '') + (b.sqft ? ' · ' + Number(b.sqft).toLocaleString() + ' sqft' : '') +
          (b.client_id ? ' · <a onclick="ADM.go(\'client/' + b.client_id + '\')">' + esc(b.client_name || '') + '</a>' : '') +
        '</div></div>' +
        '<div class="acts">' +
          '<button class="adm-btn adm-btn--ghost" onclick="ADM.editBooking(' + b.id + ')">Edit</button>' +

        kv('Service', esc(b.type || '—')) +

        kv('Total amount', total != null ? money(total) : '—') +
        kv('Payment', '<span class="adm-badge adm-badge--' + (b.status === 'paid' ? 'paid">Paid' : 'unpaid">Unpaid') + '</span>') +
        kv('Client', b.client_id
          ? '<a style="cursor:pointer" onclick="ADM.go(\'client/' + b.client_id + '\')">' + esc(b.client_name || '') + '</a>' +

      '</div>' +
      (b.deliverables

        : '') +
      (b.notes
        ? '<div class="adm-notes" style="margin-top:0.8rem"><b style="display:block;font-size:0.62rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:0.4rem">Access notes</b>' + esc(b.notes) + '</div>'

          '<div style="margin-top:1rem">' +
          '<div class="adm-mrow"><span>' + esc(b.type || 'Shoot') + '</span><span>' + money(b.price) + '</span></div>' +
          (travel ? '<div class="adm-mrow"><span>Travel' + (b.travel_note ? ' <small>(' + esc(b.travel_note) + ')</small>' : '') + '</span><span>' + money(travel) + '</span></div>' : '') +

          '<div class="adm-confnote">' + (b.show_price === false ? 'Price hidden in client confirmation.' : 'Price shown in client confirmation.') + '</div>'
        : '<p class="adm-empty">No price set — Edit to add the quote.</p>') +

            : '') +

            (b.delivery_sent_at

              : (b.client_id ? 'Not sent to client yet.' : 'Add a client to send the delivery.')) +

          (b.delivery_approved_at

          '<p class="adm-empty" style="margin-top:0.8rem">Add named links (gallery, films, floor plans…), a note, and CC — then send the client their branded delivery page.</p>') +
      '</div>';

    return html + '<div class="adm-detail2">' + main +
      '<div class="adm-rail">' + moneyCard + statusCard + delivery + '</div></div>';

    // ---- proposals ----
    // New proposal = pick the property, the CLIENT (search / select /

    // sets them in the editor.
    propNew: function (presetClientId, draft) {
      draft = draft || {};
      var selClient = state.clients.find(function (c) { return c.id == (draft.client_id || presetClientId); });
      var GROUP_LABEL = { 'Photography': 'Photography', 'Film': 'Film', 'Beyond': 'Extras' };
      var picked = draft.services || [];

      var pLabel = function (label, group, on, priceAttr, priceTag) {
        return '<label style="display:flex;align-items:center;gap:0.5rem;font-size:0.85rem;color:var(--ink);text-transform:none;letter-spacing:0;cursor:pointer">' +
          '<input type="checkbox" class="p-svc" value="' + esc(label) + '" data-group="' + esc(group) + '"' +
          (priceAttr != null ? ' data-price="' + esc(priceAttr) + '"' : '') +
          (on ? ' checked' : '') + ' style="width:auto"> ' + esc(label) +
          (priceTag != null
            ? '<small style="color:var(--muted);margin-left:0.35rem">&mdash; ' + money(priceTag) + '</small>'
            : '<small class="p-svc-pr" data-nm="' + esc(label) + '" style="color:var(--muted);margin-left:0.35rem;white-space:nowrap"></small>') +
          '</label>';
      };
      var svcHtml = Object.keys(ADDONS).map(function (group) {
        return '<div style="margin-top:0.6rem"><div style="font-size:0.6rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--muted);margin-bottom:0.4rem">' + group + '</div>' +
          '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:0.35rem 1rem">' +
          ADDONS[group].map(function (label) {
            return pLabel(label, GROUP_LABEL[group] || group, picked.indexOf(label) > -1);
          }).join('') + '</div></div>';
      }).join('') +
        '<div style="margin-top:0.6rem"><div style="font-size:0.6rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--muted);margin-bottom:0.4rem">Custom</div>' +
          '<div id="p-customlist" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:0.35rem 1rem">' +
          customs.map(function (cx) { return pLabel(cx.name, 'Extras', true, cx.price, cx.price === '' ? null : cx.price); }).join('') + '</div>' +
          '<div style="display:flex;gap:0.5rem;margin-top:0.5rem">' +
            '<input id="p-customsvc" placeholder="Add a custom service…" style="flex:1;font-family:var(--sans);font-size:0.85rem;color:var(--ink);background:var(--paper-warm);border:1px solid var(--line);padding:0.5rem 0.7rem;outline:none">' +
            '<input id="p-customprice" type="number" min="0" step="1" placeholder="$" style="width:110px;font-family:var(--sans);font-size:0.85rem;color:var(--ink);background:var(--paper-warm);border:1px solid var(--line);padding:0.5rem 0.7rem;outline:none">' +
            '<button type="button" class="adm-btn adm-btn--ghost" id="p-addcustom" style="padding:0.45rem 0.9rem">+ Add</button>' +
          '</div></div>';

      openModal('New proposal',
        fld('f-ptitle', 'Property / title *', '<input id="f-ptitle" required placeholder="465 Headwaters Way" value="' + esc(draft.title || '') + '">') +
        fld('f-ploc', 'Location', '<input id="f-ploc" placeholder="Danville, California" value="' + esc(draft.location || '') + '">') +
        fld('f-psqft', 'Sqft <small style="text-transform:none;letter-spacing:0">(prices services exactly, like a project)</small>',
          '<input id="f-psqft" type="number" min="0" placeholder="4500" value="' + esc(draft.sqft || '') + '">') +
        '<div class="adm-field full"><label for="p-client-q">Client *</label><div style="display:flex;gap:0.5rem">' +
          '<div style="position:relative;flex:1">' +
            '<input type="hidden" id="p-client" value="' + esc(selClient ? selClient.id : '') + '">' +
            '<input id="p-client-q" placeholder="Search clients…" autocomplete="off" value="' + esc(selClient ? selClient.name : '') + '">' +
            '<div id="p-client-list" class="adm-cl-list" hidden></div>' +
          '</div>' +
          '<button type="button" class="adm-btn adm-btn--ghost" id="p-newclient" style="padding:0.55rem 0.9rem">+ New</button></div></div>' +
        '<div class="adm-field full"><label>Scope &amp; investment <small style="text-transform:none;letter-spacing:0">(selected services become the line items, priced from the sqft — tweak anything in the editor)</small></label>' +
          svcHtml + '</div>',
        async function () {
          var cl = state.clients.find(function (c) { return c.id == $('p-client').value; });
          if (!cl) {
            $('p-client-q').focus();
            throw Object.assign(new Error('pick-client'), { userMessage: 'Choose a client — search above, or create one with + New.' });
          }
          var sqft = $('f-psqft').value;
          var needPrice = [];
          var items = Array.prototype.map.call(document.querySelectorAll('.p-svc:checked'), function (x) {
            if (x.hasAttribute('data-price')) {
              return { group: x.dataset.group, name: x.value, desc: '',
                       price: x.dataset.price === '' ? '' : Number(x.dataset.price) || 0, badge: '' };
            }
            var q = svcQuote(x.value, sqft);
            var d = svcDesc(x.value);
            var priceVal = q.price;
            if (q.inquire) {
              var inp = document.querySelector('.p-inqprice[data-nm="' + CSS.escape(x.value) + '"]');
              if (inp && inp.value !== '') priceVal = Number(inp.value) || 0;
              else needPrice.push(x.value);
            }
            return { group: x.dataset.group, name: x.value,
                     desc: d + (q.note ? (d ? ' — ' : '') + q.note : ''),
                     price: priceVal, badge: '' };
          });
          if (needPrice.length) {
            throw Object.assign(new Error('inq'), { userMessage: 'Past 6,000 sqft each line item takes a custom price — set: ' + needPrice.join(', ') + '.' });
          }
          var j = await api('proposals', 'POST', {
            title: $('f-ptitle').value, location: $('f-ploc').value, sqft: sqft,
            client_id: cl.id, client_name: cl.name || '', client_email: cl.email || '',
            items: items
          });
          await reload(); go('proposal/' + j.proposal.id);
        }, 'Create proposal');

      // client typeahead — same behavior as the project form
      (function () {
        var q = $('p-client-q'), hid = $('p-client'), list = $('p-client-list');
        function draw(term) {
          term = (term || '').trim().toLowerCase();
          var hits = state.clients.filter(function (c) {
            return !term || (c.name + ' ' + (c.email || '') + ' ' + (c.brokerage || '')).toLowerCase().indexOf(term) > -1;
          }).slice(0, 8);
          list.innerHTML = hits.length
            ? hits.map(function (c) {
                return '<div class="adm-cl-item" data-id="' + c.id + '"><b>' + esc(c.name) + '</b>' +
                  (c.email || c.brokerage ? '<small>' + esc([c.email, c.brokerage].filter(Boolean).join(' · ')) + '</small>' : '') + '</div>';
              }).join('')
            : '<div class="adm-cl-item adm-cl-item--empty">No matches — use + New</div>';
          list.hidden = false;
        }
        q.addEventListener('focus', function () { draw(q.value); });
        q.addEventListener('input', function () { hid.value = ''; draw(q.value); });
        q.addEventListener('keydown', function (e) { if (e.key === 'Escape') list.hidden = true; });
        list.addEventListener('mousedown', function (e) {
          var item = e.target.closest('.adm-cl-item'); if (!item || !item.dataset.id) return;
          var c = state.clients.find(function (x) { return x.id == item.dataset.id; });
          hid.value = c.id; q.value = c.name; list.hidden = true;
        });
        q.addEventListener('blur', function () {
          setTimeout(function () {
            list.hidden = true;
            if (!hid.value) q.value = '';
          }, 150);
        });
      })();
      $('p-newclient').addEventListener('click', function () {
        var draftNow = {
          title: $('f-ptitle').value, location: $('f-ploc').value, sqft: $('f-psqft').value,
          services: Array.prototype.map.call(document.querySelectorAll('.p-svc:checked:not([data-price])'), function (x) { return x.value; }),
          customs: Array.prototype.map.call(document.querySelectorAll('.p-svc:checked[data-price]'), function (x) {
            return { name: x.value, price: x.dataset.price };
          })
        };
        clientModal(null, function (nc) { ADM.propNew(nc ? nc.id : null, draftNow); });
      });
      // live prices beside every service as the sqft is typed
      function paintSvcPrices() {
        var sq = $('f-psqft').value;
        document.querySelectorAll('.p-svc-pr').forEach(function (el) {
          var q = svcQuote(el.dataset.nm, sq);
          if (q.inquire) {
            // 6,000+ — the sheet says Inquire, so each line takes its
            // own custom price (typed values survive sqft edits).
            var prev = el.querySelector('.p-inqprice');
            var val = prev ? prev.value : '';
            el.innerHTML = '&mdash; <input type="number" min="0" step="1" class="p-inqprice" data-nm="' + esc(el.dataset.nm) + '" placeholder="$" value="' + esc(val) + '" style="width:84px;font-family:var(--sans);font-size:0.8rem;color:var(--ink);background:var(--paper-warm);border:1px solid var(--line);padding:0.25rem 0.45rem;outline:none">';
          } else {
            el.innerHTML = q.price !== '' ? '&mdash; ' + money(q.price)
              : (q.note ? '&mdash; per image' : '');
          }
        });
      }
      // clicking a nested price input must not toggle the checkbox
      $('modal-form').addEventListener('click', function (e) {
        if (e.target.classList && e.target.classList.contains('p-inqprice')) {
          e.preventDefault(); e.target.focus();
        }
      });
      $('f-psqft').addEventListener('input', paintSvcPrices);
      paintSvcPrices();
      // custom line items, same as the project form (name + price + Add)
      function addCustomLine() {
        var nm = $('p-customsvc').value.trim().slice(0, 100);
        var pr = $('p-customprice').value === '' ? '' : Number($('p-customprice').value) || 0;
        if (!nm) return;
        var exists = Array.prototype.some.call(document.querySelectorAll('.p-svc'), function (x) {
          return x.value.toLowerCase() === nm.toLowerCase();
        });
        if (!exists) {
          var wrap = document.createElement('div');
          wrap.innerHTML = pLabel(nm, 'Extras', true, pr, pr === '' ? null : pr);
          $('p-customlist').appendChild(wrap.firstChild);
        }
        $('p-customsvc').value = ''; $('p-customprice').value = '';
      }
      $('p-addcustom').addEventListener('click', addCustomLine);
      $('p-customsvc').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); addCustomLine(); }
      });
    },
    propReadItems: function () {

    spResize: function (file, max, q) {
      return new Promise(function (resolve) {
        var img = new Image();
        img.onload = function () {
          var w = img.naturalWidth, h = img.naturalHeight;
          var scale = Math.min(1, max / Math.max(w, h));
          if (scale === 1 && file.type === 'image/jpeg') { resolve(file); return; }
          var c = document.createElement('canvas');
          c.width = Math.round(w * scale); c.height = Math.round(h * scale);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          c.toBlob(function (b) { resolve(b || file); }, 'image/jpeg', q);
        };
        img.onerror = function () { resolve(file); };
        img.src = URL.createObjectURL(file);
      });
    },
    spUpload: async function (kind, input) {
      var files = Array.prototype.slice.call(input.files || []);
      if (!files.length) return;
      ADM.spCollect();
      var p = state.sp;
      var dir = 'site/' + (p.slug || 'project');
      var done = 0, failed = [], results = new Array(files.length);
      p.busy = 'Uploading 0 of ' + files.length + '\u2026'; render();

      async function one(i) {
        var f = files[i], blob = f, name = f.name;
        var isVideo = /^video\//.test(f.type);
        try {
          if (!isVideo) {
            blob = await ADM.spResize(f, 2400, 0.82);
            name = name.replace(/\.[^.]+$/, '') + '.jpg';
          }
          var r = await VercelBlobClient.upload(dir + '/' + name, blob, {
            access: 'public',
            handleUploadUrl: '/api/admin/upload',
            contentType: isVideo ? f.type : 'image/jpeg',
            multipart: blob.size > 20 * 1024 * 1024
          });
          results[i] = r.url;
        } catch (e) {
          failed.push(f.name + ' (' + String((e && e.message) || 'error').slice(0, 60) + ')');
        }
        done++;
        var el = document.querySelector('.sp-progress');
        var msg = 'Uploading ' + done + ' of ' + files.length + '\u2026';
        p.busy = msg;
        if (el) el.textContent = msg;   // update in place \u2014 no re-render mid-flight
      }

      // 4 uploads in parallel \u2014 resize + transfer overlap instead of queueing
      var next = 0;
      async function worker() { while (next < files.length) { var i = next++; await one(i); } }
      await Promise.all([worker(), worker(), worker(), worker()]);

      // keep the user's selection order regardless of finish order
      results.forEach(function (url) {
        if (!url) return;
        if (kind === 'gallery') p.gallery.push(url);
        else if (kind === 'cover') p.cover_url = url;
        else if (kind === 'horizontal') p.horizontal_url = url;
        else if (kind === 'vertical') p.vertical_url = url;
      });
      p.busy = ''; render();
      if (failed.length) toast(failed.length + ' failed: ' + failed[0] + (failed.length > 1 ? ' \u2026' : ''), 'err');
      else toast(files.length + (files.length === 1 ? ' file' : ' files') + ' uploaded.');
    },

    discToggle: async function (id) {
      var d = state.discounts.find(function (x) { return x.id == id; }); if (!d) return;
      try { await api('discounts', 'PUT', { id: d.id, code: d.code, kind: d.kind, value: d.value, note: d.note, active: !d.active }); await reload(); render(); }
      catch (e) { toast(friendly(e), 'err'); }
    },
    discDelete: async function (id) {
      if (!confirm('Delete this code? Projects that already used it keep their locked-in discount.')) return;
      try { await api('discounts', 'DELETE', { id: id }); await reload(); render(); }
      catch (e) { toast(friendly(e), 'err'); }
    },
    reqAccept: async function (id) {
      if (!confirm('Book directly (skip the proposal)? A client + project are created as Upcoming (no email yet — you set the quote, then Confirm & send).')) return;
      try {
        var j = await api('requests', 'POST', { id: id, action: 'accept' });
        await reload(); go('project/' + j.projectId);
      } catch (e) { toast(friendly(e), 'err'); }
    },
    reqPropose: async function (id) {
      if (!confirm('Send a proposal? A client + Pending project + draft proposal are created, prefilled from the application — you set the prices, then Send. Their acceptance signs it and books the project.')) return;
      try {
        var j = await api('requests', 'POST', { id: id, action: 'propose' });
        await reload(); go('proposal/' + j.proposalId);
        toast('Draft proposal ready — set the prices, then send.');
      } catch (e) { toast(friendly(e), 'err'); }
    },
    reqDecline: async function (id) {
      if (!confirm('Decline this request? A graceful decline email goes to the applicant.')) return;
      try { await api('requests', 'POST', { id: id, action: 'decline' }); await reload(); render(); }
      catch (e) { toast(friendly(e), 'err'); }
    },
    reqDelete: async function (id) {
      if (!confirm('Delete this request permanently?')) return;
      try { await api('requests', 'DELETE', { id: id }); await reload(); render(); }
      catch (e) { toast(friendly(e), 'err'); }
    },
    newClient: function () { clientModal(); },
    editClient: function (id) { clientModal(state.clients.find(function (c) { return c.id == id; })); },
    delClient: async function (id) {
      if (!confirm('Delete this client? Their projects are kept (unlinked).')) return;
      try { await api('clients', 'DELETE', { id: id }); await reload(); go('clients'); render(); } catch (e) { toast(friendly(e), 'err'); }
    },
    newBooking: function (clientId) { bookingModal(null, clientId); },
    editBooking: function (id) { bookingModal(state.bookings.find(function (b) { return b.id == id; })); },
    delBooking: async function (id) {
      if (!confirm('Delete this project?')) return;
      try { await api('bookings', 'DELETE', { id: id }); await reload(); go('pipeline'); render(); } catch (e) { toast(friendly(e), 'err'); }
    }
  };

  // boot
  fetch('/api/admin/me').then(function (r) { r.ok ? showApp() : showLogin(); }).catch(showLogin);
})();
</script>
</body>
</html>
