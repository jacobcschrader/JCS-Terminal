<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Studio Admin — Jacob Schrader</title>
<link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png">
<link rel="icon" type="image/png" sizes="512x512" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
<style>
/* ================= Studio Admin — editorial admin inside the site =====
   Pattern: jacobguthrie.com/admin (2026-08-08). The admin lives inside
   the public site chrome (nav + footer): warm-white paper, hairlines,
   Cormorant headlines ("Dashboard."), Inter tracked caps, square
   buttons, pill tabs. Tokens come from styles.css; the old Resid-era
   variable names stay aliased so every rule below reads them. ======= */
:root { --rx-teal: var(--accent); --rx-dark: var(--navy); --rx-line: var(--line); --rx-mono: var(--sans);
        --lx-teal: var(--accent); --lx-dark: var(--navy); --lx-ink: var(--ink); --lx-line: var(--line);
        --adm-bg: #f8f7f4; --adm-r: 10px; }
body { background: var(--adm-bg); }
.adm-hidden { display: none !important; }

/* ---- Login ---- */
.adm-login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
.adm-login__card { background: #fff; width: min(400px, 100%); padding: clamp(2rem, 5vw, 3rem); border: 1px solid var(--line); border-radius: var(--adm-r); text-align: center; }
.adm-login__brand { font-family: var(--serif); font-style: italic; font-weight: 300; font-size: 2.2rem; color: var(--navy); }
.adm-login__sub { font-size: 0.6rem; letter-spacing: 0.24em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 0.6rem 0 2rem; }

/* ---- Shell: sidebar + top bar (deal-desk pattern, 2026-08-08) ---- */
.adm-app { display: flex; min-height: 100vh; }
.adm-side { width: 236px; flex: 0 0 236px; background: #fff; border-right: 1px solid var(--line); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow-y: auto; z-index: 70; }
.adm-side__brand { display: flex; align-items: baseline; gap: 0.5rem; padding: 1.25rem 1.25rem 0.9rem; }
.adm-side__brand b { font-family: var(--serif); font-style: italic; font-weight: 400; font-size: 1.5rem; color: var(--navy); line-height: 1; }
.adm-side__brand span { font-size: 0.54rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.adm-side__acct { display: flex; align-items: center; gap: 0.6rem; margin: 0 0.85rem 0.4rem; padding: 0.55rem 0.6rem; border: 1px solid var(--line); border-radius: 10px; }
.adm-side__acct .av { width: 28px; height: 28px; border-radius: 8px; background: var(--navy); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-family: var(--serif); font-style: italic; font-size: 0.82rem; flex: none; }
.adm-side__acct b { display: block; font-size: 0.74rem; font-weight: 600; color: var(--ink); line-height: 1.2; }
.adm-side__acct b i { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #2f9e5b; margin-left: 0.35rem; vertical-align: middle; }
.adm-side__acct small { display: block; font-size: 0.6rem; color: var(--muted); }
.adm-side nav { flex: 1; padding: 0.2rem 0.85rem 0.6rem; }
.adm-side .grp { font-size: 0.54rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 1rem 0.6rem 0.35rem; }
.adm-side nav a { display: flex; align-items: center; gap: 0.6rem; padding: 0.5rem 0.6rem; border-radius: 8px; color: var(--ink); font-size: 0.8rem; cursor: pointer; text-decoration: none; }
.adm-side nav a svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; opacity: 0.7; flex: none; }
.adm-side nav a:hover { background: #f5f4f0; }
.adm-side nav a.on { background: #eef2f7; color: var(--navy); font-weight: 600; }
.adm-side nav a.on svg { opacity: 1; }
.adm-side nav a .adm-count { margin-left: auto; }
.adm-side nav a .ext { margin-left: auto; font-size: 0.7rem; color: var(--muted); }
.adm-side__foot { padding: 0.9rem 1.25rem 1.1rem; border-top: 1px solid var(--line-soft); font-size: 0.68rem; color: var(--muted); }
.adm-side__foot .st { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; margin-bottom: 0.45rem; }
.adm-side__foot .st b { font-size: 0.68rem; color: var(--ink); font-weight: 600; }
.adm-side__foot .st b.ok { color: #2f6b3f; } .adm-side__foot .st b.warn { color: #8a6d1f; }
.adm-side__foot a { color: var(--muted); cursor: pointer; text-decoration: none; }
.adm-side__foot a:hover { color: var(--navy); }
.adm-body { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.adm-top { display: flex; align-items: center; gap: 0.8rem; padding: 0.75rem 1.6rem; background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 60; }
.adm-menu { display: none; width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line); background: #fff; cursor: pointer; align-items: center; justify-content: center; }
.adm-menu span { display: block; width: 14px; height: 1.5px; background: var(--ink); margin: 2px 0; }
.adm-search { position: relative; flex: 1; max-width: 480px; }
.adm-search input { width: 100%; box-sizing: border-box; font-family: var(--sans); font-size: 0.8rem; color: var(--ink); background: #f6f5f1; border: 1px solid transparent; border-radius: 10px; padding: 0.55rem 2.4rem 0.55rem 2.1rem; outline: none; }
.adm-search input:focus { background: #fff; border-color: var(--line); }
.adm-search > svg { position: absolute; left: 0.75rem; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; stroke: var(--muted); fill: none; stroke-width: 1.8; stroke-linecap: round; }
.adm-search kbd { position: absolute; right: 0.6rem; top: 50%; transform: translateY(-50%); font-family: var(--sans); font-size: 0.56rem; color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 0.1rem 0.35rem; }
.adm-qres { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 16px 40px rgba(15,34,64,0.14); overflow: hidden; z-index: 65; max-height: 60vh; overflow-y: auto; }
.adm-qres .g { font-size: 0.54rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 0.6rem 0.9rem 0.2rem; }
.adm-qres a { display: flex; align-items: center; gap: 0.6rem; padding: 0.5rem 0.9rem; font-size: 0.8rem; color: var(--ink); cursor: pointer; text-decoration: none; }
.adm-qres a:hover, .adm-qres a.sel { background: #f5f4f0; }
.adm-qres a small { color: var(--muted); font-size: 0.66rem; margin-left: auto; white-space: nowrap; }
.adm-qres .none { padding: 0.8rem 0.9rem; font-size: 0.78rem; color: var(--muted); }
.adm-top__acts { margin-left: auto; display: flex; gap: 0.5rem; align-items: center; position: relative; }
.adm-icon { position: relative; width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line); background: #fff; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; color: var(--ink); text-decoration: none; }
.adm-icon svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.adm-icon:hover { border-color: rgba(15,34,64,0.45); }
.adm-icon .n { position: absolute; top: -5px; right: -5px; min-width: 16px; height: 16px; border-radius: 8px; background: #c0392b; color: #fff; font-size: 0.55rem; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; padding: 0 4px; }
.adm-notif { position: absolute; top: calc(100% + 8px); right: 0; width: min(400px, 92vw); background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 16px 40px rgba(15,34,64,0.14); z-index: 65; overflow: hidden; }
.adm-notif h4 { font-family: var(--sans); font-size: 0.58rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 0; padding: 0.85rem 1rem 0.5rem; }
.adm-notif a { display: flex; gap: 0.7rem; align-items: flex-start; padding: 0.62rem 1rem; border-top: 1px solid var(--line-soft); font-size: 0.78rem; color: var(--ink); cursor: pointer; text-decoration: none; }
.adm-notif a:hover { background: #f5f4f0; }
.adm-notif a i { width: 8px; height: 8px; border-radius: 50%; margin-top: 0.4rem; flex: none; background: var(--accent); }
.adm-notif a i.red { background: #c0392b; } .adm-notif a i.amb { background: #c9932a; } .adm-notif a i.grn { background: #2f9e5b; }
.adm-notif a small { display: block; color: var(--muted); font-size: 0.66rem; margin-top: 0.1rem; }
.adm-notif .empty { padding: 0.9rem 1rem 1rem; font-size: 0.78rem; color: var(--muted); }
.adm-main { padding: 1.5rem 1.6rem 4rem; max-width: 1380px; width: 100%; box-sizing: border-box; }
@media (max-width: 860px) {
  .adm-side { position: fixed; left: 0; top: 0; bottom: 0; transform: translateX(-102%); transition: transform 0.3s var(--ease); box-shadow: 0 20px 60px rgba(9,22,39,0.25); }
  .adm-side.open { transform: none; }
  .adm-menu { display: inline-flex; }
  .adm-top { padding: 0.65rem 0.9rem; }
  .adm-search kbd { display: none; }
  .adm-main { padding: 1rem 0.9rem 3rem; }
}

/* ---- View header ---- */
.adm-head { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.2rem; flex-wrap: wrap; }
.adm-head h1 { font-family: var(--sans); font-weight: 600; font-style: normal; letter-spacing: -0.01em; font-size: 1.05rem; color: var(--ink); margin: 0; line-height: 1.2; }
.adm-head .grow { flex: 1; }
.adm-back { display: inline-block; font-size: 0.66rem; color: var(--muted); font-weight: 500; cursor: pointer; margin-bottom: 0.8rem; }
.adm-back:hover { color: var(--navy); }

/* ---- Buttons / badges / tables ---- */
.adm-btn, .lx-btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.45rem; background: var(--navy); color: #fff; border: 1px solid var(--navy); border-radius: 8px; cursor: pointer;
  font-family: var(--sans); font-size: 0.74rem; font-weight: 600; letter-spacing: 0; text-transform: none; padding: 0.55rem 0.95rem; line-height: 1.25; text-decoration: none; white-space: nowrap;
  transition: background 0.2s, color 0.2s, border-color 0.2s, opacity 0.2s; }
.adm-btn:hover { background: var(--navy-deep); border-color: var(--navy-deep); opacity: 1; }
.adm-btn--ghost, .lx-btn--ghost { background: #fff; color: var(--ink); border-color: var(--line); }
.adm-btn--ghost:hover, .lx-btn--ghost:hover { background: #fff; color: var(--navy); border-color: rgba(15,34,64,0.5); }
.adm-btn--danger, .lx-btn--danger { background: #fff; color: #a33; border-color: rgba(170,51,51,0.35); }
.adm-btn--danger:hover { background: #fdf3f3; border-color: rgba(170,51,51,0.6); }
.adm-btn--sm, .lx-btn--sm { padding: 0.4rem 0.7rem; font-size: 0.68rem; }
.adm-btn[disabled] { opacity: 0.45; cursor: default; }
.adm-badge { display: inline-flex; align-items: center; gap: 0.38rem; font-size: 0.54rem; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 600; padding: 0.32rem 0.7rem; border-radius: 999px; border: 1px solid var(--line); background: #fff; color: var(--muted); white-space: nowrap; }
.adm-badge--live, .adm-badge--completed, .adm-badge--ready { background: #e6f0e8; color: #2f6b3f; border-color: rgba(47,107,63,0.3); }
.adm-badge--draft, .adm-badge--editing, .adm-badge--pending { background: #faf6e9; color: #8a6d1f; border-color: rgba(138,109,31,0.3); }
.adm-badge--upcoming { background: #ecf1f8; color: #2c5d8f; border-color: rgba(44,93,143,0.35); }
.adm-badge--revisions { background: #fdf1e7; color: #b3541e; border-color: rgba(179,84,30,0.35); }
.adm-badge--delivered { background: #f2eefa; color: #6b4fa0; border-color: rgba(107,79,160,0.3); }
.adm-badge--paid { background: var(--navy); color: #fff; border-color: var(--navy); }
.adm-badge--canceled, .adm-badge--declined { background: #faeeee; color: #9c3a3a; border-color: rgba(156,58,58,0.3); }
.adm-badge--accepted { background: #eef2f7; color: var(--accent); border-color: rgba(82,104,143,0.4); }
.adm-badge--unpaid { background: #f5e8e8; color: #a03a3a; border-color: rgba(160,58,58,0.3); }
.adm-badge--locked { background: #f5e8e8; color: #a03a3a; border-color: rgba(160,58,58,0.3); }

.adm-card, .lx-card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: clamp(1.1rem, 2.2vw, 1.4rem); box-shadow: 0 8px 24px rgba(15,34,64,0.045); }
.adm-card + .adm-card { margin-top: 1.2rem; }
.adm-card h2, .lx-card__head h2 { display: flex; align-items: center; gap: 0.6rem; font-family: var(--sans); font-style: normal; font-weight: 600; font-size: 0.6rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); margin: 0 0 1rem; }
.adm-table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
.adm-table th { text-align: left; font-size: 0.54rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 0.7rem 0.9rem 0.7rem 0; border-bottom: 1px solid var(--line); }
.adm-table td { padding: 0.85rem 0.9rem 0.85rem 0; border-bottom: 1px solid var(--line-soft); color: var(--ink); vertical-align: middle; }
.adm-table tr:last-child td { border-bottom: 0; }
.adm-table tr.click { cursor: pointer; }
.adm-table tr.click:hover td { background: #faf9f6; }
.adm-table .u { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: rgba(15,34,64,0.35); }
.adm-table--ledger { font-size: 0.82rem; }
.adm-table--ledger th, .adm-table--ledger td { padding-left: 0.9rem; }
.adm-table--ledger td { padding-top: 0.95rem; padding-bottom: 0.95rem; }
.adm-card--flush { padding: 0; }
.adm-card--flush .adm-empty { padding: 1.2rem 1rem; }
.adm-empty { color: var(--muted); font-size: 0.86rem; padding: 1rem 0; }
small.mut { color: var(--muted); }
.adm-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.78em; color: var(--ink); }

/* ---- Dashboard: five stat cards + recent downloads ---- */
.adm-sec { margin-top: 2.2rem; }
.adm-sec__lbl { display: flex; align-items: center; gap: 0.6rem; font-size: 0.56rem; letter-spacing: 0.24em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 0.75rem; }
.adm-sec__lbl .grow { flex: 1; }

/* ---- Toolbar (search / segments) ---- */
.adm-tools { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; margin-bottom: 1.2rem; }
.adm-seg, .lx-tabs { display: inline-flex; gap: 2px; flex-wrap: wrap; background: #eeede8; border-radius: 9px; padding: 2px; }
.adm-seg button, .lx-tab { font-family: var(--sans); background: transparent; border: 0; border-radius: 7px; cursor: pointer; font-size: 0.7rem; font-weight: 600; color: var(--muted); padding: 0.4rem 0.75rem; letter-spacing: 0; text-transform: none; }
.adm-seg button.on, .lx-tab.on { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(15,34,64,0.12); }
.adm-tools input[type=search], .adm-tools select { font-family: var(--sans); font-size: 0.8rem; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 0.5rem 0.8rem; outline: none; }
.adm-tools input[type=search] { min-width: 220px; }
.adm-tools input[type=search]:focus, .adm-tools select:focus { border-color: var(--navy); }

/* ---- Listing page (project detail) ---- */
.adm-lhead { display: flex; align-items: flex-start; gap: 1.4rem; flex-wrap: wrap; margin: 0.2rem 0 1.8rem; }
.adm-lhead h1 { font-family: var(--serif); font-weight: 400; font-style: normal; letter-spacing: -0.01em; font-size: clamp(1.7rem, 2.6vw, 2.2rem); color: var(--ink); margin: 0 0 0.3rem; line-height: 1.08; }
.adm-lhead .meta { font-size: 0.8rem; color: var(--muted); line-height: 1.6; }
.adm-lhead .meta a { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.adm-lhead .sent { font-size: 0.72rem; color: var(--muted); margin-top: 0.3rem; }
.adm-lhead .acts { margin-left: auto; display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: flex-start; }
.adm-lgrid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 1.6rem 3rem; }
@media (max-width: 900px) { .adm-lgrid { grid-template-columns: 1fr; } .adm-lhead .acts { margin-left: 0; } }
.adm-rows { font-size: 0.84rem; }
.adm-row { display: flex; align-items: baseline; gap: 0.7rem; padding: 0.55rem 0; border-bottom: 1px solid var(--line-soft); flex-wrap: wrap; }
.adm-row:last-child { border-bottom: 0; }
.adm-row .grow { flex: 1; }
.adm-row a { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.adm-row .dim { color: var(--muted); }
.adm-cgrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 0.5rem; }
@media (max-width: 1100px) { .adm-cgrid { grid-template-columns: repeat(4, 1fr); } }
@media (max-width: 600px) { .adm-cgrid { grid-template-columns: repeat(3, 1fr); gap: 0.35rem; } }
.adm-cg { position: relative; aspect-ratio: 3 / 2; background: var(--paper-warm); overflow: hidden; cursor: pointer; border-radius: 2px; outline: 2px solid transparent; outline-offset: -2px; transition: outline-color 0.2s; }
.adm-cg img { width: 100%; height: 100%; object-fit: cover; display: block; }
.adm-cg:hover { outline-color: rgba(15,34,64,0.35); }
.adm-cg.on { outline-color: var(--navy); }
.adm-cg .tag { position: absolute; left: 6px; top: 6px; font-size: 0.48rem; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 600; background: var(--navy); color: #fff; padding: 3px 7px; }
.adm-cg .film { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; background: rgba(9,22,39,0.28); font-size: 1.3rem; }
.adm-cg .x { position: absolute; right: 5px; top: 5px; width: 22px; height: 22px; border: 0; border-radius: 50%; background: rgba(15,34,64,0.75); color: #fff; font-size: 0.7rem; cursor: pointer; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s; }
.adm-cg:hover .x { opacity: 1; } .adm-cg .x:hover { background: #8a2f2f; }
.adm-cg .nm { position: absolute; left: 0; right: 0; bottom: 0; font-size: 0.55rem; color: #fff; background: linear-gradient(transparent, rgba(9,22,39,0.7)); padding: 0.9rem 0.45rem 0.3rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0; transition: opacity 0.2s; }
.adm-cg:hover .nm { opacity: 1; }
.adm-drop { border: 1px dashed rgba(15,34,64,0.35); background: #fff; padding: 2.4rem 1rem; text-align: center; cursor: pointer; border-radius: var(--adm-r); transition: border-color 0.2s, background 0.2s; }
.adm-drop.over { border-color: var(--navy); background: #f2f4f8; }
.adm-drop b { display: block; font-family: var(--serif); font-size: 1.4rem; font-weight: 400; color: var(--ink); }
.adm-drop small { display: block; margin-top: 0.4rem; font-size: 0.74rem; color: var(--muted); }
.adm-drop.busy { cursor: default; }
.adm-prog { margin: 0.9rem auto 0; max-width: 420px; height: 3px; background: var(--line-soft); }
.adm-prog i { display: block; height: 100%; background: var(--navy); width: 0; transition: width 0.25s; }
.adm-drop .st { display: block; margin-top: 0.6rem; font-size: 0.72rem; color: var(--ink); }

/* ---- Portfolio grid ---- */
.adm-projgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1.2rem; }
.adm-proj { background: #fff; border: 1px solid var(--line); border-radius: var(--adm-r); overflow: hidden; display: block; color: var(--ink); position: relative; }
.adm-proj .ph-wrap { aspect-ratio: 3/2; background: var(--navy-deep); overflow: hidden; }
.adm-proj img { width: 100%; height: 100%; object-fit: cover; display: block; }
.adm-proj .cap { padding: 0.8rem 0.9rem 0.9rem; }
.adm-proj .cap b { display: block; font-family: var(--serif); font-weight: 500; font-size: 1.05rem; color: var(--ink); margin-bottom: 0.3rem; }

/* ---- Detail pages ---- */
.adm-detail { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem 2rem; margin-bottom: 0.4rem; }
.adm-kv label { display: block; font-size: 0.52rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 0.3rem; }
.adm-kv div { font-size: 0.92rem; color: var(--ink); }
.adm-kv a { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.adm-notes { background: #faf9f6; border: 1px solid var(--line-soft); border-radius: var(--adm-r); padding: 1rem 1.2rem; font-size: 0.88rem; color: var(--ink); white-space: pre-line; margin-top: 1rem; }
.adm-phead { display: flex; align-items: flex-start; gap: 1.2rem; flex-wrap: wrap; margin: 0.4rem 0 1.6rem; }
.adm-phead h1 { font-family: var(--serif); font-style: normal; font-weight: 400; letter-spacing: -0.01em; font-size: clamp(1.6rem, 2.4vw, 2rem); color: var(--ink); margin: 0 0 0.3rem; line-height: 1.1; }
.adm-phead .sub { font-size: 0.86rem; color: var(--muted); }

.adm-phead .acts { margin-left: auto; display: flex; gap: 0.6rem; flex-wrap: wrap; }
.adm-detail2 { display: grid; grid-template-columns: 1.55fr 1fr; gap: 1.4rem; align-items: start; }

.adm-kvgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1.1rem 2rem; }
.adm-sched { display: flex; gap: 1rem; align-items: center; padding: 0.85rem 0; }

.adm-confnote { font-size: 0.8rem; color: var(--muted); margin-top: 0.8rem; text-align: center; line-height: 1.55; }
.adm-confnote.ok { color: #2f6b3f; }
.adm-avatar { flex: 0 0 54px; width: 54px; height: 54px; border-radius: 50%; background: var(--navy); color: #fff; display: flex; align-items: center; justify-content: center; font-family: var(--serif); font-style: italic; font-weight: 400; font-size: 1.2rem; letter-spacing: 0.02em; }

/* ---- Modal / forms ---- */
.adm-modal { position: fixed; inset: 0; z-index: 200; background: rgba(9,22,39,0.55); display: flex; align-items: flex-start; justify-content: center; padding: 4vh 1rem; overflow: auto; }
.adm-modal__card { background: #fff; border-radius: var(--adm-r); border: 1px solid var(--line); width: min(680px, 100%); padding: clamp(1.5rem, 3vw, 2.2rem); }
.adm-modal__card h2 { font-family: var(--serif); font-style: normal; font-weight: 400; letter-spacing: -0.01em; font-size: 1.7rem; color: var(--ink); margin: 0 0 1.2rem; }
.adm-form { display: grid; grid-template-columns: 1fr 1fr; gap: 0.9rem; }
.adm-form .full { grid-column: 1 / -1; }
@media (max-width: 560px) { .adm-form { grid-template-columns: 1fr; } }
.adm-field label { display: block; font-size: 0.52rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 0.4rem; }
.adm-field input, .adm-field select, .adm-field textarea { width: 100%; box-sizing: border-box; font-family: var(--sans); font-size: 0.9rem; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: var(--adm-r); padding: 0.62rem 0.85rem; outline: none; }
.adm-field textarea { min-height: 70px; resize: vertical; }
.adm-field input:focus, .adm-field select:focus, .adm-field textarea:focus { border-color: var(--navy); background: #fff; }
.adm-cl-list { position: absolute; top: 100%; left: 0; right: 0; z-index: 40; background: #fff;
  border: 1px solid var(--line); box-shadow: 0 10px 30px rgba(15,34,64,0.12); max-height: 260px; overflow: auto; }
.adm-cl-item { padding: 0.55rem 0.75rem; cursor: pointer; }
.adm-cl-item:hover { background: var(--paper-warm); }
.adm-cl-item b { display: block; font-size: 0.88rem; font-weight: 500; color: var(--ink); }
.adm-cl-item small { color: var(--muted); font-size: 0.74rem; }
.adm-cl-item--empty { color: var(--muted); font-size: 0.8rem; cursor: default; }
.adm-cl-item--empty:hover { background: none; }
.dv-lrow { display: flex; gap: 0.6rem; margin-bottom: 0.6rem; }
.dv-lrow input { box-sizing: border-box; font-family: var(--sans); font-size: 0.88rem; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: var(--adm-r); padding: 0.6rem 0.85rem; outline: none; }
.dv-lrow input:focus { border-color: var(--navy); }
.dv-lrow .dv-lbl { flex: 0 0 220px; }
.dv-lrow .dv-url { flex: 1; }
.dv-x { flex: 0 0 38px; background: none; border: 1px solid var(--line); color: var(--muted); font-size: 1.1rem; cursor: pointer; border-radius: var(--adm-r); }
.dv-x:hover { color: #a03a3a; border-color: #a03a3a; }
.dv-save { flex: 0 0 auto; background: none; border: 1px solid var(--line); color: var(--navy); border-radius: var(--adm-r);
  font-family: var(--sans); font-size: 0.56rem; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 600; padding: 0 0.9rem; cursor: pointer; }
.dv-save:hover { border-color: var(--navy); }
.dv-save.ok { background: #e6f0e8; border-color: #e6f0e8; color: #2f6b3f; }
@media (max-width: 700px) { .dv-lrow { flex-wrap: wrap; } .dv-lrow .dv-lbl { flex: 1 1 100%; } }
.adm-msg { font-size: 0.85rem; margin-top: 0.8rem; color: #a33; }

/* ---- Portfolio CMS media tiles ---- */
.sp-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 0.9rem; max-width: 640px; }
.sp-tile { position: relative; aspect-ratio: 4/3; background: var(--paper-warm); border: 1px dashed var(--line); display: flex; align-items: center; justify-content: center; overflow: hidden; }
.sp-tile.has { border-style: solid; }
.sp-tile img, .sp-tile video { width: 100%; height: 100%; object-fit: cover; }
.sp-tile--empty { cursor: pointer; font-size: 0.78rem; color: var(--muted); transition: border-color 0.25s, color 0.25s; }
.sp-tile--empty:hover { border-color: var(--navy); color: var(--navy); }
.sp-tile__label { position: absolute; left: 0; right: 0; bottom: 0; font-size: 0.6rem; letter-spacing: 0.14em; text-transform: uppercase; color: #fff; background: rgba(15,34,64,0.55); padding: 0.25rem 0.5rem; }
.sp-thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 0.6rem; }
.sp-thumb { position: relative; aspect-ratio: 1; background: var(--paper-warm); overflow: hidden; }
.sp-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.sp-thumb--add { border: 1px dashed var(--line); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.72rem; color: var(--muted); text-align: center; }
.sp-thumb--add:hover { border-color: var(--navy); color: var(--navy); }
.sp-x { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border: 0; border-radius: 50%; background: rgba(15,34,64,0.72); color: #fff; font-size: 0.65rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.sp-x:hover { background: #8a2f2f; }
.sp-ord { position: absolute; bottom: 4px; left: 4px; display: flex; gap: 3px; }
.sp-ord button { border: 0; background: rgba(255,255,255,0.85); color: var(--navy); width: 22px; height: 20px; font-size: 0.7rem; cursor: pointer; }
.sp-thumb[draggable] { cursor: grab; }
.sp-thumb.sp-dragging { opacity: 0.35; }
.sp-thumb.sp-drop-l::before, .sp-thumb.sp-drop-r::after,
.adm-proj.sp-drop-l::before, .adm-proj.sp-drop-r::after { content: ""; position: absolute; top: 0; bottom: 0; width: 3px; background: var(--navy); z-index: 2; }
.adm-proj.sp-dragging { opacity: 0.35; }
.sp-thumb.sp-drop-l::before, .adm-proj.sp-drop-l::before { left: -5px; }
.sp-thumb.sp-drop-r::after, .adm-proj.sp-drop-r::after { right: -5px; }
.sp-progress { margin-top: 1rem; font-size: 0.82rem; color: var(--accent); }

/* ---- Toasts ---- */
#adm-toasts { position: fixed; bottom: 1.4rem; left: 50%; transform: translateX(-50%); z-index: 300; display: flex; flex-direction: column; gap: 0.5rem; align-items: center; pointer-events: none; }
.adm-toast { background: var(--navy); color: #fff; font-size: 0.82rem; line-height: 1.45; border-radius: var(--adm-r); padding: 0.7rem 1.3rem; box-shadow: 0 10px 30px rgba(9,22,39,0.3); opacity: 0; transform: translateY(8px); transition: opacity 0.3s, transform 0.3s; max-width: min(480px, 90vw); text-align: center; }
.adm-toast.in { opacity: 1; transform: translateY(0); }
.adm-toast--err { background: #6e2f2a; }

/* ================= Licensing (lx-*) — same square language =========== */
.lx-card { margin-bottom: 1.2rem; }
.lx-card__head { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.9rem; flex-wrap: wrap; }
.lx-card__head .grow { flex: 1; }
.lx-input { font-family: var(--sans); font-size: 0.9rem; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: var(--adm-r); padding: 0.62rem 0.9rem; outline: none; }
.lx-input:focus { border-color: var(--navy); }
select.lx-input { padding-right: 2rem; }
.lx-btn:hover { background: var(--navy-deep); }
.lx-btn--teal { background: var(--navy); }
.lx-chip { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.54rem; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 600; padding: 0.32rem 0.7rem;
  border-radius: 999px; border: 1px solid var(--line); color: var(--muted); background: #fff; white-space: nowrap; }
.lx-chip .d { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.lx-chip--prospect { color: #8a6d1f; border-color: rgba(138,109,31,0.35); background: #faf6e9; }
.lx-chip--preview_sent { color: #2c5d8f; border-color: rgba(44,93,143,0.4); background: #ecf1f8; }
.lx-chip--accepted { color: #6b4fa0; border-color: rgba(107,79,160,0.35); background: #f2eefa; }
.lx-chip--licensed { color: #2c5d8f; border-color: rgba(44,93,143,0.4); background: #ecf1f8; }
.lx-chip--paid { color: #2f6b3f; border-color: rgba(47,107,63,0.4); background: #e6f0e8; }
.lx-chip--declined { color: #9c3a3a; border-color: rgba(156,58,58,0.35); background: #faeeee; }
.lx-chip--role { color: var(--ink); background: #f1f0ec; border-color: transparent; }
.lx-chip--due { color: #b3541e; border-color: rgba(179,84,30,0.4); background: #fdf1e7; }
.lx-row { border: 1px solid var(--line); border-radius: var(--adm-r); padding: 0.95rem 1.15rem; margin-bottom: 0.65rem; background: #fff; transition: border-color 0.2s; }
.lx-row:hover { border-color: rgba(15,34,64,0.42); }
.lx-row__top { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
.lx-row__co { font-family: var(--serif); font-weight: 500; font-size: 1.15rem; color: var(--ink); }
.lx-fee { font-family: var(--serif); font-weight: 500; font-size: 1.05rem; color: var(--ink); border: 1px solid var(--line); border-radius: var(--adm-r); padding: 0.25rem 0.7rem; font-variant-numeric: lining-nums; font-feature-settings: 'lnum' 1; }
.lx-fee--paid { background: var(--navy); color: #fff; border-color: var(--navy); }
.lx-row__meta { font-size: 0.8rem; color: var(--muted); margin-top: 0.35rem; }
.lx-row__meta a { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
.lx-row__acts { display: flex; gap: 0.45rem; flex-wrap: wrap; margin-top: 0.7rem; }
.lx-note { font-size: 0.72rem; letter-spacing: 0.02em; color: var(--muted); background: #faf9f6; border: 1px solid var(--line-soft); border-radius: var(--adm-r); padding: 0.75rem 1rem; line-height: 1.8; }
.lx-note a { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
.lx-result { padding: 0.85rem 0.2rem; border-bottom: 1px solid var(--line-soft); }
.lx-result:last-child { border-bottom: 0; }
.lx-result__t { display: flex; align-items: center; gap: 0.7rem; flex-wrap: wrap; }
.lx-result__t a.title { font-weight: 600; font-size: 0.9rem; color: var(--ink); text-decoration: none; }
.lx-result__t a.title:hover { color: var(--navy); text-decoration: underline; text-underline-offset: 3px; }
.lx-domain { font-size: 0.52rem; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 0.18rem 0.55rem; }
.lx-snippet { font-size: 0.8rem; color: var(--muted); margin-top: 0.25rem; line-height: 1.55; }
@media (max-width: 640px) { .lx-card { padding: 1.05rem 1.1rem; } }

/* ---- proposal line-item editor: quiet editorial ledger ------------- */
.adm-prop-item { display: grid; grid-template-columns: 132px 1fr 150px auto;
  gap: 0.15rem 1.2rem; align-items: start; background: #fff;
  border: 1px solid var(--line); border-radius: var(--adm-r);
  padding: 1rem 1.1rem 0.9rem; margin-bottom: 0.7rem; }
.adm-prop-item input { width: 100%; box-sizing: border-box; font-family: var(--sans);
  background: transparent; border: 0; border-bottom: 1px solid transparent; border-radius: 0;
  padding: 0.18rem 0.05rem; outline: none; color: var(--ink); transition: border-color 0.2s; }
.adm-prop-item input:hover { border-bottom-color: rgba(15,34,64,0.14); }
.adm-prop-item input:focus { border-bottom-color: var(--navy); }
.adm-prop-item input::placeholder { color: #b6bdc9; font-weight: 400; }
.adm-prop-item .pi-group { font-size: 0.6rem; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 600; color: var(--muted); margin-top: 0.55rem; }
.adm-prop-item .pi-name { font-family: var(--serif); font-size: 1.25rem; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: lining-nums; font-feature-settings: 'lnum' 1; }
.adm-prop-item .pi-name::placeholder { font-family: var(--sans); font-size: 0.9rem; }
.adm-prop-item .pi-desc { font-size: 0.83rem; color: var(--muted); }
.adm-prop-item .pi-badge { font-size: 0.62rem; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600; color: var(--accent); }

.adm-prop-item .pi-price { font-family: var(--serif); font-size: 1.2rem; font-weight: 500; text-align: right; margin-top: 0.3rem;
  font-variant-numeric: lining-nums; font-feature-settings: 'lnum' 1; -moz-appearance: textfield; appearance: textfield; }

.adm-prop-item .pi-price::placeholder { font-family: var(--sans); font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; }
.adm-prop-item .pi-acts { display: flex; flex-direction: column; gap: 0.3rem; opacity: 0.3; transition: opacity 0.2s; padding-top: 0.15rem; }
.adm-prop-item:hover .pi-acts, .adm-prop-item:focus-within .pi-acts { opacity: 1; }
.adm-prop-item .pi-acts button { width: 27px; height: 27px; display: flex; align-items: center; justify-content: center; padding: 0; border-radius: 999px; font-size: 0.8rem; line-height: 1; }
@media (max-width: 760px) {
  .adm-prop-item { grid-template-columns: 1fr 110px auto; }
  .adm-prop-item .pi-group { grid-column: 1 / -1; margin-top: 0; }
}

/* ---- Mobile ---- */
@media (max-width: 760px) {
  .adm-table .hide-m { display: none; }
}
@media (max-width: 520px) {

  .adm-head .adm-btn { padding: 0.6rem 0.9rem; font-size: 0.56rem; }
  .adm-card { padding: 1rem 0.9rem; }
  .adm-modal { padding: 0; align-items: stretch; }
  .adm-modal__card { width: 100%; min-height: 100%; padding: 1.2rem 1rem 3rem; border: 0; }
  .adm-projgrid { grid-template-columns: 1fr 1fr; gap: 0.7rem; }
  .sp-tiles { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }

  #adm-toasts { left: 0.8rem; right: 0.8rem; transform: none; }

}

/* ================= Dashboard — deal-desk layout (2026-08-08) ==========
   Reference: the "DealSpace" dashboard mock Jacob sent (profile ring +
   4 stat tiles, latest-matches cards, active-mandates table + tasks).
   JCS mapping: matches = requests, mandates = projects, seller = client,
   sector = service. Soft SaaS card language in JCS navy. ============ */
.dz-card { background: #fff; border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 8px 24px rgba(15,34,64,0.045); }
.dz-profile { padding: 1.35rem 1.5rem 1.4rem; }
.dz-lbl { font-size: 0.6rem; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 600; color: var(--muted); margin-bottom: 0.7rem; }
.dz-btn { font-family: var(--sans); font-size: 0.7rem; font-weight: 600; letter-spacing: 0.01em; border-radius: 8px; padding: 0.55rem 0.9rem; cursor: pointer; border: 1px solid var(--navy); background: var(--navy); color: #fff; white-space: nowrap; }
.dz-btn:hover { background: var(--navy-deep); }
.dz-btn--ghost { background: #fff; color: var(--ink); border-color: var(--line); }
.dz-btn--ghost:hover { border-color: rgba(15,34,64,0.5); color: var(--navy); background: #fff; }
.dz-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.75rem; }
@media (max-width: 1000px) { .dz-stats { grid-template-columns: 1fr 1fr; } }
@media (max-width: 520px) { .dz-stats { grid-template-columns: 1fr; } }
.dz-stat { border: 1px solid var(--line); border-radius: 12px; padding: 0.95rem 1.05rem 1rem; background: #fff; }
.dz-stat .lbl { display: flex; align-items: center; gap: 0.5rem; font-size: 0.72rem; color: var(--muted); font-weight: 500; }
.dz-stat .lbl i { width: 20px; height: 20px; border-radius: 6px; background: #eef2f7; color: var(--navy); display: inline-flex; align-items: center; justify-content: center; font-style: normal; font-size: 0.6rem; flex: none; }
.dz-stat b { display: block; margin-top: 0.55rem; font-family: var(--sans); font-weight: 600; font-size: 1.5rem; letter-spacing: -0.02em; color: var(--ink); line-height: 1; }
.dz-stat b small { font-size: 0.7rem; font-weight: 500; color: var(--muted); margin-left: 3px; letter-spacing: 0; }
.dz-stat .d { display: inline-block; margin-top: 0.45rem; font-size: 0.66rem; color: var(--muted); }
.dz-stat .d em { font-style: normal; font-weight: 600; color: #2f6b3f; }
.dz-stat .d em.down { color: #a03a3a; }
.dz-stat .d em::before { content: "\2197\00a0"; }
.dz-stat .d em.down::before { content: "\2198\00a0"; }

.dz-sec { margin-top: 1.5rem; }
.dz-sechead { display: flex; align-items: center; gap: 0.55rem; margin-bottom: 0.7rem; }
.dz-sechead h2 { font-family: var(--sans); font-size: 0.86rem; font-weight: 600; color: var(--ink); margin: 0; letter-spacing: -0.01em; }
.dz-count { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 6px; background: var(--navy); color: #fff; font-size: 0.62rem; font-weight: 600; }
.dz-sechead .grow { flex: 1; }
.dz-sechead a.more { font-size: 0.7rem; color: var(--muted); cursor: pointer; }
.dz-sechead a.more:hover { color: var(--navy); }
.dz-arrows { display: flex; gap: 0.3rem; }
.dz-arrows button { width: 26px; height: 26px; border-radius: 7px; border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; font-size: 0.8rem; line-height: 1; }
.dz-arrows button:hover { border-color: rgba(15,34,64,0.5); }
.dz-row { display: flex; gap: 0.75rem; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 0.3rem; scrollbar-width: none; }
.dz-row::-webkit-scrollbar { display: none; }
.dz-match { flex: 0 0 min(340px, 88vw); scroll-snap-align: start; padding: 1rem 1.05rem 1rem; cursor: pointer; transition: border-color 0.2s, transform 0.2s; }
.dz-match:hover { border-color: rgba(15,34,64,0.35); }
.dz-match__top { display: flex; align-items: center; gap: 0.6rem; }
.dz-avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--navy); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 0.6rem; font-weight: 600; letter-spacing: 0.04em; flex: none; }
.dz-avatar--soft { background: #eef2f7; color: var(--navy); }
.dz-match__who { flex: 1; min-width: 0; }
.dz-match__who b { display: block; font-size: 0.82rem; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

@media (max-width: 720px) {
  .acc > summary { flex-wrap: wrap; gap: 0.35rem 0.9rem; padding: 0.85rem 1rem; }

  .acc__meta { flex-basis: 100%; order: 3; }

}
/* ---- settings: templates (each one a compact row that opens on click) ---- */
.tpl { border: 1px solid var(--line-soft); border-radius: 10px; margin-bottom: 0.5rem; }

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];}); }
  function money(n){ return n==null||n===''?'—':'$'+Number(n).toLocaleString(); }
  function fmtT(t){ if(!/^\d{2}:\d{2}/.test(String(t||''))) return t||''; var p=t.slice(0,5).split(':'); var h=+p[0], ap=h>=12?'PM':'AM'; h=h%12||12; return h+':'+p[1]+' '+ap; }
  function discLabel(d){ return d.code + ' — ' + (d.kind === 'percent' ? Number(d.value) + '%' : '$' + Number(d.value).toLocaleString()) + (d.note ? ' · ' + d.note : ''); }
  function net(b){ return (Number(b.price) || 0) - (Number(b.discount_value) || 0); }
  function dstr(d){ if(!d) return '—'; var t=new Date(d); return isNaN(t)?'—':t.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); }

  var state = { clients: [], bookings: [], requests: [], discounts: [], siteProjects: [], proposals: [], licenseLeads: [], sp: null, reqTab: 'pending', loaded: false,
              q: '', clientFilter: '',
              licTab: 'active', licProp: '', licResults: null, licSearching: false,
              stageFilter: 'active', ls: null, downloads: [], dlWeek: 0,
              billTab: 'all', gcal: null, gcalBusy: false, qItems: [], qSel: -1,
              testimonials: [], calMonth: '', fDrag: null, env: {}, calExt: {}, calBusy: {}, backup: null, dl: null, dlBusy: false, dvTab: 'all', dvSort: 'new', dvQ: '' };
  // Service lineup — mirrors the JCS-Pricing sheet (2026-07-29).
  var ADDONS = {
    'Photography': ['Flash / Ambient Photography','Aerial Photography','Vertical / Vignette Images','Twilight Photography','Virtual Staging','Virtual Twilight'],
    'Film':        ['Cinematic Property Film','Luxury Social Reel','Basic Property Film','Basic Social Reel','Twilight Videography','Teaser Video'],
    'Beyond':      ['Zillow 3D Tour','2D Floor Plan','Property Website']
  };
  var STAGES = ['upcoming','editing','revisions','delivered','completed','paid'];   // pipeline order
  // Mirror of api/_lib/templates.js DEFAULTS — the Settings editor shows
  // these when nothing has been overridden.
  var TPL_DEFAULTS = {
    confirm: { label: 'Booking confirmed', subject: '{property} | Booking Confirmed', note: "You're on the calendar. Questions before the shoot? Just reply. Everything about your shoot — schedule, delivery, and invoices — lives in your client portal." },
    delivery: { label: 'Media delivery', subject: '{property} | Media Delivery', note: 'Hi {first} — your full delivery is ready. View, download individual files, or grab the full-res and MLS bundles from your listing page — always up to date.' },
    invoice: { label: 'Invoice', subject: '{property} | Invoice {number}', note: 'Hi {first} — here is your invoice. Questions? Just reply.' },
    proposal: { label: 'Proposal', subject: '{property} | Project Proposal', note: "Hi {first} — your bespoke proposal for {property} is ready. Review the scope, and reserve the dates when you're ready." },
    application: { label: 'Application received', subject: '{property} | Application Received', note: 'Hi {first} — your application for {property} has been received. I review every application personally and will reply within 24 hours with availability and your personal proposal — accepting it is what confirms your shoot.' },
    reminder_invoice: { label: 'Reminder — unpaid invoice', subject: '{property} | A note on invoice {number}', note: 'Hi {first} — a quick note that invoice {number} for {property} ({total}) is still open. The link below has everything; reply if anything needs adjusting.' },
    reminder_proposal: { label: 'Reminder — proposal waiting', subject: '{property} | Your proposal is waiting', note: "Hi {first} — checking in on the proposal for {property}. The dates are held for now; the link below reserves them whenever you're ready." },
    reminder_delivery: { label: 'Reminder — approve the delivery', subject: '{property} | Happy with everything?', note: 'Hi {first} — your delivery for {property} has been up for a few days. If everything looks right, an approval on your listing page closes it out; if not, tell me what to adjust — revisions are always included.' }
  };
  // 'pending' sits BEFORE the pipeline: proposal sent, waiting on the
  // client's acceptance (which flips the project to upcoming).
  var STAGE_LABEL = { pending:'Pending proposal', upcoming:'Upcoming', editing:'Editing', revisions:'Revisions', delivered:'Delivered', completed:'Completed', paid:'Paid' };
  var STATUSES = ['pending'].concat(STAGES).concat(['canceled']);

  // ---- pricing-data.js hookups (the Numbers-sheet rates) -------------
  // Shared by the project + proposal forms so admin quotes always match
  // the sheet. svcDesc: the public description for a service name.
  function svcDesc(nm) {
    var P = window.JCS_PRICING || { services: [], extras: [] };
    var hit = '';
    (P.services || []).forEach(function (s) {
      if (s.name === nm && s.desc) hit = hit || s.desc;
      (s.addons || []).forEach(function (a) { if (a.name === nm) hit = hit || a.note || ''; });
    });
    (P.extras || []).forEach(function (x) { if (x.name === nm) hit = hit || x.note || ''; });
    return hit;
  }
  // svcQuote: exact price at a sqft — same engine as the booking wizard
  // (tiered brackets, flat add-ons, Zillow's own table). Tiered things
  // stay blank without a sqft; per-image add-ons return a note instead
  // of a price; 6,000+ (Inquire) stays blank for a hand quote.
  function svcQuote(nm, sqft) {
    var P = window.JCS_PRICING, out = { price: '', note: '' };
    if (!P) return out;
    var n = parseInt(sqft, 10) || 0;
    function tiered(t) { if (!n) return; var p = P.priceAt(t, n); if (typeof p === 'number') out.price = p; else out.inquire = true; }
    (P.services || []).forEach(function (s) {
      if (s.name === nm) tiered(s);
      (s.addons || []).forEach(function (a) {
        if (a.name !== nm) return;
        if (a.unit) out.note = '$' + a.price + ' per ' + a.unit + ' — tallied after the shoot';
        else out.price = a.price;
      });
    });
    (P.extras || []).forEach(function (x) {
      if (x.name !== nm) return;
      if (typeof x.price === 'number') out.price = x.price; else tiered(x);
    });
    return out;
  }

  async function api(path, method, body) {
    var r = await fetch('/api/admin/' + path, {
      method: method || 'GET',
      cache: 'no-store',   // admin data is live state — never serve it from disk cache
      headers: body ? { 'Content-Type': 'application/json' } : undefined,
      body: body ? JSON.stringify(body) : undefined
    });
    if (r.status === 401) { showLogin(); throw new Error('unauthorized'); }
    var j = await r.json().catch(function(){ return {}; });
    if (!r.ok) throw new Error(j.error || 'error');
    return j;
  }
  function friendly(err) {
    if (err && err.userMessage) return err.userMessage;   // validation notes pass through
    return String(err.message) === 'db-not-configured'
      ? 'Database not connected — check the Neon integration in Vercel.'
      : 'Something went wrong — try again.';
  }

  // Quiet toast notifications (replaces alert() popups).
  function toast(msg, kind) {
    var host = $('adm-toasts');
    if (!host) {
      host = document.createElement('div');
      host.id = 'adm-toasts';
      document.body.appendChild(host);
    }
    var t = document.createElement('div');
    t.className = 'adm-toast' + (kind === 'err' ? ' adm-toast--err' : '');
    t.textContent = msg;
    host.appendChild(t);
    requestAnimationFrame(function () { t.classList.add('in'); });
    setTimeout(function () {
      t.classList.remove('in');
      setTimeout(function () { t.remove(); }, 350);
    }, kind === 'err' ? 5200 : 3200);
  }

  // ================= router =================
  function go(route) { location.hash = route; }
  function route() { return (location.hash || '#dash').slice(1); }
  window.addEventListener('hashchange', render);

  // ================= auth =================
  function showLogin(){ $('login').classList.remove('adm-hidden'); $('app').classList.add('adm-hidden'); }
  async function showApp(){
    $('login').classList.add('adm-hidden'); $('app').classList.remove('adm-hidden');
    try { await reload(); } catch (e) {}
    render();
  }
  async function reload() {
    var all = await Promise.all([api('clients'), api('bookings'), api('requests'), api('discounts'), api('settings'), api('siteprojects'), api('proposals'), api('licensing')]);
    var c = all[0], b = all[1], r = all[2], d = all[3], st = all[4], sp = all[5], pr = all[6], lic = all[7];
    state.clients = c.clients; state.bookings = b.bookings; state.requests = r.requests; state.discounts = d.discounts;
    state.siteProjects = sp.projects || [];
    state.proposals = pr.proposals || [];
    state.licenseLeads = lic.leads || [];
    state.settings = st.settings || {}; state.env = st.env || {}; state.loaded = true;
    var extra = await Promise.all([api('downloads?limit=80').catch(function () { return {}; }), api('testimonials').catch(function () { return {}; })]);
    state.downloads = extra[0].events || []; state.dlWeek = extra[0].week || 0; state.testimonials = extra[1].testimonials || [];
    paintBell();
    var pending = state.requests.filter(function (x) { return x.status === 'pending'; }).length;
    var badge = $('req-badge');
    if (badge) { badge.textContent = pending; badge.classList.toggle('adm-hidden', !pending); }
  }
  $('login-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    var msg = $('login-msg'); msg.classList.add('adm-hidden');
    var r = await fetch('/api/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: $('l-email').value, password: $('l-pass').value }) }).catch(function(){ return null; });
    if (!r || !r.ok) {
      msg.textContent = !r ? 'Network error — try again.' : 'Wrong email or password.';
      msg.classList.remove('adm-hidden'); return;
    }
    $('l-pass').value = ''; showApp();
  });
  $('logout').addEventListener('click', async function () {
    await fetch('/api/admin/logout', { method: 'POST' }).catch(function(){});
    showLogin();
  });

  // ================= modal =================
  function closeModal(){ $('modal-root').innerHTML = ''; }
  function openModal(title, formHtml, onSubmit, submitLabel) {
    $('modal-root').innerHTML =
      '<div class="adm-modal" id="modal-bg"><form class="adm-modal__card" id="modal-form">' +
      '<h2>' + esc(title) + '</h2><div class="adm-form">' + formHtml + '</div>' +
      '<div style="margin-top:1.4rem;display:flex;gap:0.8rem">' +
      '<button class="adm-btn" type="submit">' + esc(submitLabel || 'Save') + '</button>' +
      '<button class="adm-btn adm-btn--ghost" type="button" id="modal-cancel">Cancel</button></div>' +
      '<p class="adm-msg adm-hidden" id="modal-msg"></p></form></div>';
    $('modal-cancel').addEventListener('click', closeModal);
    $('modal-bg').addEventListener('mousedown', function (e) { if (e.target === this) closeModal(); });
    document.addEventListener('keydown', function onEsc(e) { if (e.key === 'Escape') { closeModal(); document.removeEventListener('keydown', onEsc); } });
    $('modal-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      try { await onSubmit(); closeModal(); } catch (err) {
        var m = $('modal-msg'); m.textContent = friendly(err); m.classList.remove('adm-hidden');
      }
    });
  }
  function fld(id, label, inner) {
    return '<div class="adm-field"><label for="' + id + '">' + label + '</label>' + inner + '</div>';
  }
  // Time picker: a select in 30-minute steps (6:00 AM – 10:00 PM). If an
  // existing project has an off-grid time (e.g. 9:15), it's kept as an
  // extra option so editing never silently changes it.
  function timeSel(id, val) {
    val = String(val || '').slice(0, 5);
    var opts = ['<option value="">—</option>'], onGrid = false;
    for (var m = 6 * 60; m <= 22 * 60; m += 30) {
      var hh = String(Math.floor(m / 60)).padStart(2, '0'), mm = m % 60 ? '30' : '00';
      var t = hh + ':' + mm, sel = t === val;
      if (sel) onGrid = true;
      opts.push('<option value="' + t + '"' + (sel ? ' selected' : '') + '>' + fmtT(t) + '</option>');
    }
    if (val && !onGrid) opts.push('<option value="' + esc(val) + '" selected>' + fmtT(val) + '</option>');
    return '<select id="' + id + '">' + opts.join('') + '</select>';
  }

  // ================= client form =================
  function clientModal(c, onSaved) {
    c = c || {};
    openModal(c.id ? 'Edit client' : 'New client',

      fld('f-brokerage', 'Brokerage', '<input id="f-brokerage" value="' + esc(c.brokerage || '') + '">') +

      fld('f-phone', 'Phone', '<input id="f-phone" value="' + esc(c.phone || '') + '">') +

        '<input id="f-extra" placeholder="assistant@brokerage.com, spouse@gmail.com" value="' + esc(cliExtras(c).join(', ')) + '"></div>' +
      '<div class="adm-field full"><label for="f-notes">Notes</label><textarea id="f-notes">' + esc(c.notes || '') + '</textarea></div>',
      async function () {

  // ================= project (booking) form =================
  function bookingModal(b, presetClient, draft) {
    b = b || {};
    var v = draft || b;   // draft = values captured before a quick client-create
    var checkedAddons = [];
    try { checkedAddons = JSON.parse(v.addons || '[]'); } catch (e) {}
    var selClientId = v.client_id || presetClient || '';
    var selClient = state.clients.find(function (c) { return c.id == selClientId; });
    function addonLabel(label, on) {
      return '<label style="display:flex;align-items:center;gap:0.5rem;font-size:0.85rem;color:var(--ink);text-transform:none;letter-spacing:0;cursor:pointer">' +
        '<input type="checkbox" class="f-addon" value="' + esc(label) + '"' + (on ? ' checked' : '') + ' style="width:auto"> ' + esc(label) +
        '<small class="f-svc-pr" data-nm="' + esc(label) + '" style="color:var(--muted);margin-left:0.35rem;white-space:nowrap"></small></label>';
    }
    var standardAddons = Object.keys(ADDONS).reduce(function (all, g) { return all.concat(ADDONS[g]); }, []);
    var customAddons = checkedAddons.filter(function (x) { return standardAddons.indexOf(x) === -1; });
    var addonsHtml = Object.keys(ADDONS).map(function (group) {
      return '<div style="margin-top:0.6rem"><div style="font-size:0.6rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--muted);margin-bottom:0.4rem">' + group + '</div>' +
        '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:0.35rem 1rem">' +
        ADDONS[group].map(function (label) { return addonLabel(label, checkedAddons.indexOf(label) > -1); }).join('') +
        '</div></div>';
    }).join('') +
      '<div style="margin-top:0.6rem"><div style="font-size:0.6rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--muted);margin-bottom:0.4rem">Custom</div>' +
        '<div id="f-customlist" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:0.35rem 1rem">' +
        customAddons.map(function (label) { return addonLabel(label, true); }).join('') + '</div>' +
        '<div style="display:flex;gap:0.5rem;margin-top:0.5rem">' +
          '<input id="f-customsvc" placeholder="Add a custom service…" style="flex:1;font-family:var(--sans);font-size:0.85rem;color:var(--ink);background:var(--paper-warm);border:1px solid var(--line);padding:0.5rem 0.7rem;outline:none">' +
          '<input id="f-customprice" type="number" min="0" step="1" placeholder="$" style="width:110px;font-family:var(--sans);font-size:0.85rem;color:var(--ink);background:var(--paper-warm);border:1px solid var(--line);padding:0.5rem 0.7rem;outline:none">' +
          '<button type="button" class="adm-btn adm-btn--ghost" id="f-addcustom" style="padding:0.45rem 0.9rem">+ Add</button>' +
        '</div></div>';

    openModal(b.id ? 'Edit project' : 'New project',
      '<div class="adm-field full"><label for="f-title">Property address *</label><div style="position:relative">' +
        '<input id="f-title" required placeholder="7750 Lahontan Drive" autocomplete="off" value="' + esc(v.title || '') + '">' +
        '<div id="f-addr-list" class="adm-cl-list" hidden></div></div></div>' +
      fld('f-city', 'City', '<input id="f-city" placeholder="Truckee" value="' + esc(v.city || '') + '">') +
      '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:0.9rem">' +
        '<div class="adm-field"><label for="f-state">State</label><input id="f-state" value="' + esc(v.state || 'CA') + '"></div>' +
        '<div class="adm-field"><label for="f-zip">Zip</label><input id="f-zip" value="' + esc(v.zip || '') + '"></div>' +
        '<div class="adm-field"><label for="f-sqft">Sqft</label><input id="f-sqft" type="number" min="0" value="' + (v.sqft == null ? '' : v.sqft) + '"></div>' +
      '</div>' +
      '<div class="adm-field full"><label for="f-client-q">Client</label><div style="display:flex;gap:0.5rem">' +
        '<div style="position:relative;flex:1">' +
          '<input type="hidden" id="f-client" value="' + esc(selClientId) + '">' +
          '<input id="f-client-q" placeholder="Search clients\u2026" autocomplete="off" value="' + esc(selClient ? selClient.name : '') + '">' +

        '<small id="f-total-note" class="mut" style="display:block;text-align:right;letter-spacing:0"></small></div></div>' +
      // Sending options — pick from the first three, or the proposal by

      (function () {
        var optConfirm = b.id ? !v.skip_confirmation : true;
        var optPrice = v.show_price !== false;
        var optSilent = !!v.skip_confirmation;
        var chk = function (id, text, on, sub) {

          chk('f-opt-confirm', 'Send booking confirmation' + (b.id ? '' : ' <small style="color:var(--muted)">(emails the client + calendar invite when you create)</small>'), optConfirm) +
          chk('f-opt-price', 'Include price in confirmation', optPrice, true) +
          chk('f-opt-silent', 'Don&rsquo;t send confirmation <small style="color:var(--muted)">(you still get your copy + calendar on Confirm)</small>', optSilent) +

            : '') +
          '</div></div>';
      })(),
      async function () {
        // merge over the existing booking so delivery fields (managed in

        var body = Object.assign({}, b.id ? b : {}, collectProjectForm(b.id));
        var viaProposal = !b.id && $('f-opt-proposal') && $('f-opt-proposal').checked;
        var sendNow = !b.id && !viaProposal && $('f-opt-confirm').checked;
        if (!b.id && !viaProposal && !$('f-opt-confirm').checked && !$('f-opt-silent').checked) {
          throw Object.assign(new Error('opt'), { userMessage: 'Pick a sending option — confirmation, no confirmation, or a proposal.' });
        }
        if (sendNow && !$('f-date').value) {
          throw Object.assign(new Error('opt'), { userMessage: 'Add a shoot date to send the confirmation on create — or choose "Don\u2019t send confirmation".' });
        }
        var missingInq = [];
        document.querySelectorAll('.f-svc-pr .f-inqprice').forEach(function (inp) {
          var lab = inp.closest('label'); var box = lab && lab.querySelector('.f-addon');

        var j = await api('bookings', b.id ? 'PUT' : 'POST', body);
        if (sendNow && j.booking) {
          try {
            var conf = await api('confirm', 'POST', { id: j.booking.id });

          toast('Project created — no emails sent.');

        // Proposal-first: draft a linked proposal prefilled from the

        // review, tweak, Send. The project stays Pending until accepted.
        if (viaProposal && j.booking) {
          var bk = j.booking;
          var cl = state.clients.find(function (c) { return c.id == bk.client_id; }) || {};
          // Each checked service becomes its own priced line (sheet rates
          // at the project's sqft); custom services ride along unpriced.
          var picked = [];
          try { picked = JSON.parse(bk.addons || '[]'); } catch (e2) {}
          var groupOf = function (label) {
            var g = Object.keys(ADDONS).filter(function (k) { return ADDONS[k].indexOf(label) > -1; })[0];
            return g === 'Beyond' ? 'Extras' : (g || 'The Campaign');
          };
          var inqMap = {};
          document.querySelectorAll('.f-svc-pr .f-inqprice').forEach(function (inp) {
            if (inp.value !== '') inqMap[inp.dataset.nm] = Number(inp.value) || 0;

          var items = picked.map(function (nm) {
            var q = svcQuote(nm, bk.sqft);
            var d = svcDesc(nm);
            var priceVal = (q.inquire && inqMap[nm] != null) ? inqMap[nm] : q.price;
            return { group: groupOf(nm), name: nm,
                     desc: d + (q.note ? (d ? ' — ' : '') + q.note : ''),
                     price: priceVal, badge: '' };
          });
          if (!items.length) items = [{ group: 'The Campaign', name: bk.type || 'Photography',
            desc: bk.deliverables || '', price: bk.price == null || bk.price === '' ? '' : Number(bk.price), badge: '' }];
          if (Number(bk.travel_fee)) items.push({ group: 'The Campaign', name: 'Travel',
            desc: bk.travel_note || '', price: Number(bk.travel_fee), badge: '' });
          var pj = await api('proposals', 'POST', {
            title: bk.title, location: bk.location || '',
            client_name: cl.name || '', client_email: cl.email || '',
            items: items, booking_id: bk.id, client_id: bk.client_id || ''
          });
          await reload();
          go('proposal/' + pj.proposal.id);

    // addons → deliverables composer
    function checkedList() {

    }

    function derivedType() {
      var mains = ((window.JCS_PRICING || {}).services || []).map(function (s) { return s.name; });
      var hit = checkedList().filter(function (l) { return mains.indexOf(l) > -1; })[0];
      return hit || '';
    }
    function regenDeliverables() { $('f-deliverables').value = checkedList().join(' · '); }
    // delegate so custom checkboxes added later also trigger the composer
    $('modal-form').addEventListener('change', function (e) {
      if (e.target.classList && e.target.classList.contains('f-addon')) regenDeliverables();
    });
    function addCustomService() {
      var input = $('f-customsvc');
      var label = input.value.trim().slice(0, 100);
      var price = $('f-customprice').value === '' ? null : Number($('f-customprice').value) || 0;
      if (!label) return;
      var exists = Array.prototype.some.call(document.querySelectorAll('.f-addon'), function (x) {
        return x.value.toLowerCase() === label.toLowerCase();
      });
      if (!exists) {
        var wrap = document.createElement('div');
        wrap.innerHTML = addonLabel(label, true);
        var box = wrap.firstChild.querySelector('input');
        if (price != null) {
          box.setAttribute('data-price', price);
          var tag = document.createElement('small');
          tag.style.cssText = 'color:var(--muted);margin-left:0.35rem';
          tag.textContent = '— ' + money(price);
          wrap.firstChild.appendChild(tag);
        }
        $('f-customlist').appendChild(wrap.firstChild);
      }
      input.value = ''; $('f-customprice').value = '';
      regenDeliverables();
      autoPrice();   // declaration is hoisted; joins the quote instantly
    }
    $('f-addcustom').addEventListener('click', addCustomService);
    $('f-customsvc').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); addCustomService(); }
    });
    // inline new client: stash the draft, create the client, come back
    // address autocomplete — Google Places when a key is set in
    // Settings (Google-quality suggestions), Photon/OSM as fallback.
    // Picking a suggestion fills street, city, state, and zip.
    (function () {
      var input = $('f-title'), list = $('f-addr-list'), timer = null, seq = 0;
      var gkey = (state.settings || {}).google_places_key || '';
      var ST = { 'california':'CA','nevada':'NV','oregon':'OR','washington':'WA','arizona':'AZ','utah':'UT',
        'idaho':'ID','colorado':'CO','texas':'TX','florida':'FL','new york':'NY','montana':'MT','wyoming':'WY',
        'hawaii':'HI','new mexico':'NM','georgia':'GA','north carolina':'NC','south carolina':'SC','tennessee':'TN',
        'massachusetts':'MA','new jersey':'NJ','connecticut':'CT','illinois':'IL','michigan':'MI','minnesota':'MN',
        'ohio':'OH','pennsylvania':'PA','virginia':'VA','maryland':'MD' };
      function stateCode(s) { return ST[String(s || '').toLowerCase()] || s || ''; }
      function show(items) {
        list.innerHTML = items.map(function (it, i) {
          return '<div class="adm-cl-item" data-i="' + i + '"><b>' + esc(it.line) + '</b>' +
            (it.sub ? '<small>' + esc(it.sub) + '</small>' : '') + '</div>';
        }).join('');
        list._items = items;
        list.hidden = !items.length;
      }
      async function lookupGoogle(q, mySeq) {
        var r = await fetch('https://places.googleapis.com/v1/places:autocomplete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Goog-Api-Key': gkey },
          body: JSON.stringify({
            input: q,
            includedRegionCodes: ['us'],
            locationBias: { circle: { center: { latitude: 38.5, longitude: -121.5 }, radius: 50000 } }
          })
        });
        if (!r.ok || mySeq !== seq) return false;
        var j = await r.json();
        var items = (j.suggestions || []).map(function (s) {
          var p = s.placePrediction;
          if (!p) return null;
          return {
            line: (p.structuredFormat && p.structuredFormat.mainText && p.structuredFormat.mainText.text) || p.text.text,
            sub: (p.structuredFormat && p.structuredFormat.secondaryText && p.structuredFormat.secondaryText.text) || '',
            placeId: p.placeId
          };
        }).filter(Boolean).slice(0, 6);
        if (mySeq !== seq) return true;
        show(items);
        return true;
      }
      async function lookupPhoton(q, mySeq) {
        var r = await fetch('https://photon.komoot.io/api/?limit=6&lat=38.5&lon=-121.5&q=' + encodeURIComponent(q));
        if (!r.ok || mySeq !== seq) return;
        var j = await r.json();
        var items = (j.features || []).filter(function (f) {
          return f.properties && f.properties.housenumber && f.properties.street;
        }).map(function (f) {
          var p = f.properties;
          return {
            line: (p.housenumber + ' ' + p.street).trim(),
            sub: [p.city || p.district, stateCode(p.state), p.postcode].filter(Boolean).join(', '),
            fill: { city: p.city || p.district || '', state: stateCode(p.state), zip: p.postcode || '' }
          };
        }).slice(0, 6);
        if (mySeq !== seq) return;
        show(items);
      }
      async function lookup(q) {
        var mySeq = ++seq;
        try {
          if (gkey) { if (await lookupGoogle(q, mySeq)) return; }
          await lookupPhoton(q, mySeq);
        } catch (e) { list.hidden = true; }
      }
      async function pick(it) {
        input.value = it.line;
        if (it.fill) {
          if (it.fill.city) $('f-city').value = it.fill.city;
          if (it.fill.state) $('f-state').value = it.fill.state;
          if (it.fill.zip) $('f-zip').value = it.fill.zip;
        } else if (it.placeId && gkey) {
          try {
            var r = await fetch('https://places.googleapis.com/v1/places/' + it.placeId + '?fields=addressComponents', {
              headers: { 'X-Goog-Api-Key': gkey }
            });
            if (r.ok) {
              var j = await r.json();
              var get = function (type, short) {
                var c = (j.addressComponents || []).find(function (x) { return (x.types || []).indexOf(type) > -1; });
                return c ? (short ? c.shortText : c.longText) : '';
              };
              var num = get('street_number'), route = get('route');
              if (num && route) input.value = num + ' ' + route;
              if (get('locality')) $('f-city').value = get('locality');
              if (get('administrative_area_level_1', true)) $('f-state').value = get('administrative_area_level_1', true);
              if (get('postal_code')) $('f-zip').value = get('postal_code');
            }
          } catch (e) { /* keep the typed line */ }
        }
        list.hidden = true;
      }
      input.addEventListener('input', function () {
        clearTimeout(timer);
        var q = input.value.trim();
        if (q.length < 5) { list.hidden = true; return; }
        timer = setTimeout(function () { lookup(q); }, 300);
      });
      input.addEventListener('keydown', function (e) { if (e.key === 'Escape') list.hidden = true; });
      input.addEventListener('blur', function () { setTimeout(function () { list.hidden = true; }, 180); });
      list.addEventListener('mousedown', function (e) {
        var item = e.target.closest('.adm-cl-item'); if (!item) return;
        pick(list._items[item.dataset.i]);
      });
    })();

    // live total: price + travel − discount
    function updateTotal() {
      var price = Number($('f-price').value) || 0;
      var travel = Number($('f-travel').value) || 0;
      var code = $('f-discount').value;
      var disc = 0, note = [];
      if (travel) note.push('incl. ' + money(travel) + ' travel');
      if (code) {
        var d = state.discounts.find(function (x) { return x.code === code; });
        if (d) {
          disc = d.kind === 'percent' ? Math.round(price * Number(d.value)) / 100 : Math.min(Number(d.value), price);
          note.push('\u2212' + money(disc) + ' ' + code);
        }
      }
      $('f-total').textContent = money(price + travel - disc);
      $('f-total-note').textContent = note.join(' \u00b7 ');
    }
    ['f-price', 'f-travel'].forEach(function (id) { $(id).addEventListener('input', updateTotal); });
    $('f-discount').addEventListener('change', updateTotal);
    updateTotal();

    // ---- price auto-generates from the pricing sheet -----------------
    // New projects only, and only until the price is touched by hand:
    // base service at the sqft (Full Campaign = stills + film), plus
    // every flat-priced add-on that matches the sheet. Per-image and

    var priceAuto = !b.id && (v.price == null || v.price === '');
    // Past 6,000 sqft the sheet says Inquire: each tiered service takes
    // its own custom price input, and those add into the auto total.
    function paintProjPrices() {
      var sq = $('f-sqft').value;
      document.querySelectorAll('.f-svc-pr').forEach(function (el) {
        var q = svcQuote(el.dataset.nm, sq);
        if (q.inquire) {
          var prev = el.querySelector('.f-inqprice');
          var val = prev ? prev.value : '';
          el.innerHTML = '&mdash; <input type="number" min="0" step="1" class="f-inqprice" data-nm="' + esc(el.dataset.nm) + '" placeholder="$" value="' + esc(val) + '" style="width:84px;font-family:var(--sans);font-size:0.8rem;color:var(--ink);background:var(--paper-warm);border:1px solid var(--line);padding:0.25rem 0.45rem;outline:none">';
        } else el.innerHTML = '';
      });

    function autoPrice() {
      if (!priceAuto) return;
      var sq = $('f-sqft').value, sum = null;
      checkedList().forEach(function (nm) {
        var q = svcQuote(nm, sq);
        if (typeof q.price === 'number') sum = (sum || 0) + q.price;
      });
      document.querySelectorAll('.f-addon:checked[data-price]').forEach(function (x) {
        sum = (sum || 0) + (Number(x.dataset.price) || 0);
      });
      document.querySelectorAll('.f-svc-pr .f-inqprice').forEach(function (inp) {
        var lab = inp.closest('label'); var box = lab && lab.querySelector('.f-addon');
        if (box && box.checked && inp.value !== '') sum = (sum || 0) + (Number(inp.value) || 0);
      });
      $('f-price').value = sum == null ? '' : sum;
      updateTotal();
    }
    // Sending options keep each other honest: price implies confirm;
    // silent and proposal clear the others; at least one stays checked
    // at save (validated in the handler).
    (function () {
      var c = $('f-opt-confirm'), p = $('f-opt-price'), sl = $('f-opt-silent'), pr = $('f-opt-proposal');
      function un(x) { if (x) x.checked = false; }
      if (c) c.addEventListener('change', function () { if (c.checked) { un(sl); un(pr); } else un(p); });
      if (p) p.addEventListener('change', function () { if (p.checked) { c.checked = true; un(sl); un(pr); } });
      if (sl) sl.addEventListener('change', function () { if (sl.checked) { un(c); un(p); un(pr); } });
      if (pr) pr.addEventListener('change', function () { if (pr.checked) { un(c); un(p); un(sl); } });
    })();

    $('f-price').addEventListener('input', function () { priceAuto = false; });

    $('modal-form').addEventListener('change', function (e) {

  // ================= delivery links (external extras) =================
  // Named links (JSON on the booking) — 3D tours, floor plans, anything
  // hosted elsewhere. Media itself lives in delivery_files now.
  function dvLinks(b) {
    try {
      var arr = JSON.parse(b.delivery_links || '[]');
      if (arr.length) return arr;
    } catch (e) {}
    var legacy = [];
    if (b.delivery_url) legacy.push({ label: 'View Gallery', url: b.delivery_url });
    if (b.download_url) legacy.push({ label: 'Download Films & Files', url: b.download_url });
    return legacy;
  }
  function dvRow(l) {

      '<input class="dv-lbl" placeholder="Title — e.g. 3D Tour" value="' + esc(l.label || '') + '">' +

  }

  async function setStage(id, status) {
    var b = state.bookings.find(function (x) { return x.id == id; });

    var body = Object.assign({}, b, {
      status: status,
      delivered_at: b.delivered_at || (status === 'delivered' ? new Date().toISOString().slice(0, 10) : null)
    });

  // ================= views =================
  // Page titles read "Dashboard." / "Projects." — the trailing period is
  // part of the pattern (jacobguthrie.com/admin).
  function head(title, extra, back) {
    return (back ? '<span class="adm-back" onclick="history.back()">&larr; Back</span>' : '') +
      '<div class="adm-head"><h1>' + esc(title) + '</h1><span class="grow"></span>' + (extra || '') + '</div>';
  }
  // "2026-08-06 23:54" — the activity-feed timestamp format
  function stamp(iso) {
    if (!iso) return '—';
    var d = new Date(iso); if (isNaN(d)) return '—';
    var p = function (n) { return String(n).padStart(2, '0'); };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function fileWord(n) { return n + (n === 1 ? ' file' : ' files'); }
  function invoiceState(b) {
    if (b.status === 'paid') return 'paid';
